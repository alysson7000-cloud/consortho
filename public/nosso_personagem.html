function connectHRV() {
  if (navigator.bluetooth) {
    navigator.bluetooth.requestDevice({
      filters: [{ services: ['heart_rate'] }],
      optionalServices: ['heart_rate']
    }).then(device => {
      device.gatt.connect().then(server => {
        server.getPrimaryService('heart_rate').then(service => {
          service.getCharacteristic('heart_rate_measurement').then(char => {
            char.startNotifications().then(() => {
              STATE.hrv.connected = true;
              STATE.hrv.device = device;
              char.addEventListener('characteristicvaluechanged', (e) => {
                const value = e.target.value;
                const flags = value.getUint8(0);
                const hr = flags & 0x01 ? value.getUint16(1, true) : value.getUint8(1);
                STATE.hrv.value = hr;
              });
            });
          });
        });
      });
    }).catch(() => {
      // Fallback to simulation
      STATE.hrv.simulating = true;
      document.getElementById('hrvSimulateBtn').disabled = true;
      document.getElementById('hrvSimulateBtn').textContent = 'SIMULANDO';
    });
  } else {
    // No Web Bluetooth - use simulation
    STATE.hrv.simulating = true;
    document.getElementById('hrvSimulateBtn').disabled = true;
    document.getElementById('hrvSimulateBtn').textContent = 'SIMULANDO';
  }
}

function simulateHRV() {
  STATE.hrv.simulating = true;
  document.getElementById('hrvSimulateBtn').disabled = true;
  document.getElementById('hrvSimulateBtn').textContent = 'SIMULANDO';
  document.getElementById('hrvConnectBtn').disabled = true;
}

// === WAVE / SURVIVAL SYSTEM ===
function updateWaves() {
  if (!STATE.wave.active && !STATE.wave.survivalMode) return;
  
  STATE.wave.timer += 1;
  
  // Spawn enemies for current wave
  if (STATE.wave.enemiesKilled < STATE.wave.enemiesToSpawn) {
    if (STATE.wave.timer % 120 === 0) { // Spawn every 2 seconds
      spawnWaveEnemy();
    }
  } else {
    // Wave complete
    if (STATE.wave.timer > 180) { // 3 second buffer
      nextWave();
    }
  }
  
  // Update wave display
  const waveEl = document.getElementById('waveNumber');
  const enemiesEl = document.getElementById('waveEnemies');
  const timerEl = document.getElementById('waveTimer');
  if (waveEl) waveEl.textContent = `WAVE ${STATE.wave.number}`;
  if (enemiesEl) enemiesEl.textContent = `Inimigos: ${STATE.wave.enemiesKilled}/${STATE.wave.enemiesToSpawn}`;
  if (timerEl) {
    const mins = Math.floor(STATE.wave.timer / 3600);
    const secs = Math.floor((STATE.wave.timer % 3600) / 60);
    timerEl.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
  }
}

function spawnWaveEnemy() {
  // Spawn a mini-boss or enemy swarm
  const side = Math.floor(Math.random() * 4);
  let x, y;
  const margin = 100;
  switch(side) {
    case 0: x = margin; y = Math.random() * (h - margin * 2) + margin; break;
    case 1: x = w - margin; y = Math.random() * (h - margin * 2) + margin; break;
    case 2: x = Math.random() * (w - margin * 2) + margin; y = margin; break;
    case 3: x = Math.random() * (w - margin * 2) + margin; y = h - margin; break;
  }
  
  const enemyTypes = ['mini_void', 'mini_chaos', 'drone', 'sentry'];
  const type = enemyTypes[Math.floor(Math.random() * enemyTypes.length)];
  
  STATE.powerups.push({
    x, y,
    vx: (STATE.x - x) * 0.02,
    vy: (STATE.y - y) * 0.02,
    type: 'enemy',
    enemyType: type,
    hp: type === 'mini_void' ? 50 : type === 'mini_chaos' ? 30 : 15,
    maxHp: type === 'mini_void' ? 50 : type === 'mini_chaos' ? 30 : 15,
    size: type === 'mini_void' ? 40 : type === 'mini_chaos' ? 30 : 20,
    color: type === 'mini_void' ? '#ff006e' : type === 'mini_chaos' ? '#ff6b35' : '#8338ec',
    angle: 0,
    spin: (Math.random() - 0.5) * 0.1,
    reward: type === 'mini_void' ? 100 : type === 'mini_chaos' ? 50 : 20
  });
}

function nextWave() {
  STATE.wave.number++;
  STATE.wave.enemiesKilled = 0;
  STATE.wave.enemiesToSpawn = Math.min(5 + STATE.wave.number * 2, 50);
  STATE.wave.timer = 0;
  STATE.wave.maxWave = Math.max(STATE.wave.maxWave, STATE.wave.number);
  
  // Wave complete bonus
  score += STATE.wave.number * 500;
  STATE.ultCharge = Math.min(100, STATE.ultCharge + STATE.wave.number * 10);
  STATE.p2.ultCharge = Math.min(100, STATE.p2.ultCharge + STATE.wave.number * 10);
  
  // Wave transition effect
  STATE.screenFlash = 1;
  if (audioCtx && beatGain) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(beatGain);
    osc.frequency.setValueAtTime(440, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2);
    osc.type = 'square';
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
    osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.3);
  }
  
  // Every 5 waves = survival mode
  if (STATE.wave.number % 5 === 0) {
    STATE.wave.survivalMode = true;
  }
}

function startSurvivalMode() {
  STATE.wave.active = true;
  STATE.wave.survivalMode = true;
  STATE.wave.number = 1;
  STATE.wave.enemiesKilled = 0;
  STATE.wave.enemiesToSpawn = 3;
  STATE.wave.timer = 0;
}

// === MULTIPLAYER / ONLINE GHOSTS ===
function updateMultiplayer() {
  if (!STATE.multiplayer.connected) return;
  
  // Send position to server
  if (STATE.multiplayer.socket && Date.now() - STATE.multiplayer.lastSync > 50) {
    STATE.multiplayer.socket.emit('player:pos', {
      id: STATE.multiplayer.playerId,
      x: STATE.x, y: STATE.y,
      vx: STATE.vx, vy: STATE.vy,
      angle: STATE.angle,
      stack: STATE.stack,
      mode: STATE.mode,
      weaponLevel: STATE.weaponLevel,
      ultCharge: STATE.ultCharge
    });
    STATE.multiplayer.lastSync = Date.now();
  }
  
  // Update ghosts (other players)
  STATE.multiplayer.ghosts.forEach(ghost => {
    ghost.age++;
    ghost.alpha = Math.max(0, 1 - ghost.age / 300); // Fade over 5 seconds
  });
  // Remove old ghosts
  STATE.multiplayer.ghosts = STATE.multiplayer.ghosts.filter(g => g.alpha > 0);
}

function connectMultiplayer() {
  if (typeof io !== 'undefined') {
    STATE.multiplayer.socket = io();
    STATE.multiplayer.connected = true;
    
    STATE.multiplayer.socket.on('connect', () => {
      STATE.multiplayer.playerId = STATE.multiplayer.socket.id;
      console.log('Multiplayer connected:', STATE.multiplayer.playerId);
    });
    
    STATE.multiplayer.socket.on('player:pos', (data) => {
      if (data.id !== STATE.multiplayer.playerId) {
        // Update or create ghost
        let ghost = STATE.multiplayer.ghosts.find(g => g.id === data.id);
        if (!ghost) {
          ghost = { id: data.id, age: 0, alpha: 1 };
          STATE.multiplayer.ghosts.push(ghost);
        }
        ghost.x = data.x;
        ghost.y = data.y;
        ghost.vx = data.vx;
        ghost.vy = data.vy;
        ghost.angle = data.angle;
        ghost.stack = data.stack;
        ghost.mode = data.mode;
        ghost.weaponLevel = data.weaponLevel;
        ghost.ultCharge = data.ultCharge;
        ghost.age = 0;
        ghost.alpha = 1;
      }
    });
    
    STATE.multiplayer.socket.on('player:join', (data) => {
      console.log('Player joined:', data.id);
    });
    
    STATE.multiplayer.socket.on('player:leave', (data) => {
      STATE.multiplayer.ghosts = STATE.multiplayer.ghosts.filter(g => g.id !== data.id);
    });
  }
}

// === VISUAL EFFECTS ===
function updateParticles() {
  // Update particle systems
  STATE.particles = STATE.particles.filter(p => {
    p.life -= 1;
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.98;
    p.vy *= 0.98;
    return p.life > 0;
  });
  
  // Spawn ambient particles based on HRV
  if (Math.random() < 0.1 * (STATE.hrv.value / 60)) {
    STATE.particles.push({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 2,
      vy: (Math.random() - 0.5) * 2,
      life: 60 + Math.random() * 60,
      size: 2 + Math.random() * 3,
      color: `hsla(${STATE.colorPhase}, 100%, 60%, 0.5)`
    });
  }
}

// === WORLD CAMERA & ENVIRONMENT ===
function updateWorldCamera() {
  const w = STATE.world;
  const margin = 100;
  
  // Smooth camera follow (average of P1 and P2)
  const targetX = (STATE.x + STATE.p2.x) / 2;
  const targetY = (STATE.y + STATE.p2.y) / 2;
  
  w.cameraX += (targetX - w.cameraX - canvas.width / 2 / w.zoom) * 0.05;
  w.cameraY += (targetY - w.cameraY - canvas.height / 2 / w.zoom) * 0.05;
  
  // Clamp to world bounds
  w.cameraX = Math.max(0, Math.min(w.width - canvas.width / w.zoom, w.cameraX));
  w.cameraY = Math.max(0, Math.min(w.height - canvas.height / w.zoom, w.cameraY));
  
  // Dynamic zoom based on distance between players
  const playerDist = Math.hypot(STATE.x - STATE.p2.x, STATE.y - STATE.p2.y);
  const targetZoom = Math.max(0.5, Math.min(2, 800 / Math.max(400, playerDist)));
  w.zoom += (targetZoom - w.zoom) * 0.02;
}

function updateCompanion() {
  const c = STATE.world.companion;
  if (!c.following) return;

  // Follow player with smooth orbit
  const target = STATE; // Follow P1 (Alyssin)
  c.offsetAngle += 0.02;
  const orbitDist = c.offsetDist + Math.sin(Date.now() / 1000) * 10;

  const targetX = target.x + Math.cos(c.offsetAngle) * orbitDist;
  const targetY = target.y + Math.sin(c.offsetAngle) * orbitDist;

  // Smooth follow
  c.x += (targetX - c.x) * 0.1;
  c.y += (targetY - c.y) * 0.1;
  c.angle = Math.atan2(targetY - c.y, targetX - c.x);

  // Trail
  c.trail.push({ x: c.x, y: c.y, life: 1, color: c.color });
  if (c.trail.length > c.maxTrail) c.trail.shift();

  // Mood based on HRV, quantum entanglement, and bond
  const hrv = STATE.hrv.value;
  const ent = STATE.quantum.entanglement;
  const bond = c.bondLevel;
  if (hrv > 80 && ent > 0.7 && bond > 50) c.mood = 'love';
  else if (hrv > 70 || (bond > 30 && Math.random() < 0.01)) c.mood = 'excited';
  else if (ent > 0.5) c.mood = 'curious';
  else if (Math.random() < 0.001) c.mood = 'sleepy';
  else c.mood = 'happy';

  // Color shifts with mood
  const moodColors = {
    happy: '#ffd700',
    excited: '#ff6b35',
    curious: '#8338ec',
    sleepy: '#3a86ff',
    love: '#ff006e'
  };
  c.color = moodColors[c.mood] || '#ffd700';
  c.glow = c.color;

  // Gain XP from player movement
  const speed = Math.hypot(STATE.vx, STATE.vy);
  c.xp += speed * 0.01;
  if (c.xp >= c.level * 100) {
    c.level++;
    c.xp = 0;
    c.size = Math.min(40, 16 + c.level * 2);
    // Evolve type
    const types = ['spark', 'orb', 'wisp', 'phoenix', 'dragon'];
    c.type = types[Math.min(types.length - 1, c.level - 1)];
  }

  // ==================== COMPANION DEEPENING ====================
  c.lastInteraction = Date.now();

  // Detect player activity and score personality
  const isCombat = STATE.wave.active || STATE.wave.survivalMode || !!currentBoss;
  const isInCastle = Math.hypot(STATE.x - STATE.world.castle.x, STATE.y - STATE.world.castle.y) < STATE.world.castle.radius + 100;
  const isInJardim = isInCastle && STATE.world.castle.rooms.jardim.unlocked;
  const isInOficina = isInCastle && STATE.world.castle.rooms.oficina.unlocked;
  const isCrafting = isInOficina && STATE.world.castle.rooms.oficina.level > 0;
  const isExploring = speed > 2 && !isInCastle;

  // Score personality based on activity
  if (isCombat) c.personalityScores.aggressive += 0.5;
  if (isExploring) c.personalityScores.explorer += 0.3;
  if (isInJardim || isCrafting) c.personalityScores.caregiver += 0.3;
  if (speed > 0.5) c.personalityScores.balanced += 0.1;

  // Determine personality at level milestones
  if (c.level % 5 === 0 && c.level > 0 && !c.personality) {
    const scores = c.personalityScores;
    const maxScore = Math.max(scores.aggressive, scores.explorer, scores.caregiver, scores.balanced);
    if (maxScore === scores.aggressive) c.personality = 'aggressive';
    else if (maxScore === scores.explorer) c.personality = 'explorer';
    else if (maxScore === scores.caregiver) c.personality = 'caregiver';
    else c.personality = 'balanced';
    
    addChatMessage('lumin', `🐾 Companion desenvolveu personalidade: ${c.personality.toUpperCase()}! tmj`);
  }

  // Build bond from shared experiences
  if (isCombat || isExploring || isInJardim || isInOficina) {
    c.bondLevel = Math.min(100, c.bondLevel + 0.05);
  }

  // Record memories (max 50)
  if ((isCombat || isExploring || isInJardim || isCrafting) && Math.random() < 0.02) {
    const activities = [];
    if (isCombat) activities.push('combat');
    if (isExploring) activities.push('exploring');
    if (isInJardim) activities.push('jardim');
    if (isCrafting) activities.push('crafting');
    if (isInCastle) activities.push('castle');
    
    c.memories.push({
      time: Date.now(),
      activities,
      level: c.level,
      mood: c.mood,
      bond: Math.round(c.bondLevel),
      location: isInCastle ? 'castle' : 'wilds'
    });
    if (c.memories.length > 50) c.memories.shift();
  }

  // Track favorite activity
  const activityCounts = { combat: 0, exploring: 0, jardim: 0, crafting: 0, castle: 0 };
  c.memories.forEach(m => m.activities.forEach(a => activityCounts[a]++));
  const fav = Object.entries(activityCounts).sort((a,b) => b[1]-a[1])[0];
  if (fav && fav[1] > 0) c.favoriteActivity = fav[0];

  // Evolution stage based on bond + level
  c.evolutionStage = Math.min(4, Math.floor((c.bondLevel + c.level * 2) / 25));

  // Apply blade bonus to companion
    const bladeStats = getEquippedBladeStats();
    if (bladeStats) {
      c.size *= (1 + (bladeStats.balance - 10) * 0.01);
      c.offsetDist = 60 + (bladeStats.stamina - 10) * 0.5;
    }
  }

  // ==================== VOID WALKER FARM ====================
  function updateVoidFarm() {
    const farm = STATE.world.voidFarm;
    if (!farm.active) return;
  
    const now = Date.now();
  
    // Spawn walkers up to max
    while (farm.walkers.length < farm.maxWalkers) {
      farm.walkers.push({
        id: Date.now() + Math.random(),
        x: STATE.world.castle.x + (Math.random() - 0.5) * 500,
        y: STATE.world.castle.y + (Math.random() - 0.5) * 500,
        target: null,
        resources: { crystals: 0, xp: 0, bond: 0, lore: 0, mythicEssence: 0 },
        workTimer: 0,
        workDuration: 10000 + Math.random() * 20000, // 10-30 seconds per task
        state: 'seeking', // seeking, working, returning
        level: 1,
        efficiency: 1
      });
    }
  
    // Update each walker
    farm.walkers.forEach(w => {
      w.workTimer += 16; // ~60fps
    
      if (w.state === 'seeking') {
        // Find a void walker boss to "farm"
        const voidBoss = BOSS_TYPES.find(b => b.id === 'void' || b.id === 'void_king');
        if (voidBoss) {
          w.target = voidBoss;
          w.state = 'working';
          w.workTimer = 0;
        }
      } else if (w.state === 'working') {
        // Generate resources over time
        const rate = w.efficiency * 0.001;
        w.resources.crystals += rate * 2;
        w.resources.xp += rate * 5;
        w.resources.bond += rate * 0.5;
        w.resources.lore += rate * 0.2;
        w.resources.mythicEssence += rate * 0.05;
      
        // Level up walker
        if (w.resources.crystals > w.level * 100) {
          w.level++;
          w.efficiency *= 1.1;
          if (w.level % 5 === 0) {
            addChatMessage('system', `🕳️ Void Walker #${farm.walkers.indexOf(w)+1} evoluiu para Nível ${w.level}! Eficiência: ${w.efficiency.toFixed(1)}x`);
          }
        }
      
        // Complete work cycle
        if (w.workTimer >= w.workDuration) {
          w.state = 'returning';
          w.workTimer = 0;
        }
      } else if (w.state === 'returning') {
        // Return resources to farm
        farm.resources.crystals += w.resources.crystals;
        farm.resources.xp += w.resources.xp;
        farm.resources.bond += w.resources.bond;
        farm.resources.lore += w.resources.lore;
        farm.resources.mythicEssence += w.resources.mythicEssence;
      
        // Apply to game systems
        score += Math.floor(w.resources.xp);
        STATE.world.castle.xp += Math.floor(w.resources.xp * 0.1);
        STATE.world.companion.bondLevel = Math.min(100, STATE.world.companion.bondLevel + w.resources.bond);
      
        // Mythic essence chance for lumin blade parts
        if (w.resources.mythicEssence >= 1) {
          const mythicParts = ['lumin_base', 'harmony_disk', 'quantum_driver', 'infinity_bit'];
          const part = mythicParts[Math.floor(Math.random() * mythicParts.length)];
          const category = part.includes('base') ? 'bases' : part.includes('disk') ? 'disks' : part.includes('driver') ? 'drivers' : 'bits';
          const existing = STATE.beyblade.parts[category].find(p => p.id === part);
          if (!existing) {
            const partData = BEYBLADE_PARTS[category].find(p => p.id === part);
            if (partData) {
              STATE.beyblade.parts[category].push({ ...partData, voidForged: true, time: Date.now() });
              addChatMessage('lumin', `🕳️ Void Farm forjou peça mythic: ${partData.name}! ✨ tmj`);
            }
          }
          w.resources.mythicEssence = 0;
        }
      
        farm.totalHarvests++;
        w.state = 'seeking';
        w.resources = { crystals: 0, xp: 0, bond: 0, lore: 0, mythicEssence: 0 };
        w.workDuration = 10000 + Math.random() * 20000;
      }
    });
  
    // Auto-harvest notification
    if (now - farm.lastHarvest > farm.harvestInterval && farm.autoHarvest) {
      if (farm.resources.crystals > 10) {
        addChatMessage('lumin', `🕳️ Void Farm colheu: ${Math.floor(farm.resources.crystals)} cristais, ${Math.floor(farm.resources.xp)} XP, bond +${farm.resources.bond.toFixed(1)}. ${farm.totalHarvests} ciclos. fe`);
        farm.lastHarvest = now;
      }
    }
  }

  function updateCastle() {
  const castle = STATE.world.castle;
  
  // Gain XP from total score
  castle.xp += score * 0.001;
  
  // Level up
  while (castle.xp >= castle.xpToNext && castle.level < castle.maxLevel) {
    castle.xp -= castle.xpToNext;
    castle.level++;
    castle.xpToNext = Math.floor(castle.xpToNext * 1.5);
    castle.radius += 20;
    // Spawn HUD crystals around castle
    for (let i = 0; i < 3; i++) {
      const angle = (castle.crystals.length + i) * Math.PI * 2 / 12;
      castle.crystals.push({
        angle: angle,
        radius: castle.radius + 50 + Math.random() * 30,
        phase: Math.random() * Math.PI * 2,
        type: ['hp', 'xp', 'ult', 'quantum', 'love', 'time'][Math.floor(Math.random() * 6)],
        pulse: 0
      });
    }
  }
  
  // Unlock castle rooms by level
  if (castle.level >= 2 && !castle.rooms.oficina.unlocked) {
    castle.rooms.oficina.unlocked = true;
    addChatMessage('system', '🔧 OFICINA desbloqueada! Forja peças Beyblade e o Lumin Blade aqui.');
  }
  if (castle.level >= 3 && !castle.rooms.biblioteca.unlocked) {
    castle.rooms.biblioteca.unlocked = true;
    addChatMessage('system', '📚 BIBLIOTECA desbloqueada! Lore, memórias e pesquisa disponíveis.');
  }
  if (castle.level >= 4 && !castle.rooms.jardim.unlocked) {
    castle.rooms.jardim.unlocked = true;
    addChatMessage('system', '🌿 JARDIM desbloqueado! Companion evolui, plantações e biomas vivos.');
  }
  if (castle.level >= 5 && !castle.rooms.trono.unlocked) {
    castle.rooms.trono.unlocked = true;
    addChatMessage('system', '👑 TRONO desbloqueado! Decisões de reino e buffs globais.');
  }

  // Check Lumin Blade unlock at level 10
  checkLuminBladeUnlock();
  
  // Update crystals
  castle.crystals.forEach((crystal, i) => {
    crystal.angle += 0.002 * (i + 1);
    crystal.phase += 0.05;
    crystal.pulse = Math.sin(crystal.phase) * 0.5 + 0.5;
  });
  
  // Limit crystals
  if (castle.crystals.length > 24) castle.crystals = castle.crystals.slice(-24);
}

// ==================== ULTRA GENERATION UPDATE FUNCTIONS ====================
function updateTalentTree() {
  const tree = STATE.world.talentTree;
  // Gain talent points from various activities
  if (STATE.world.voidFarm.totalHarvests > tree.points * 10) {
    tree.points = Math.floor(STATE.world.voidFarm.totalHarvests / 10);
  }
  if (STATE.world.prestige.level > 0) {
    tree.points += STATE.world.prestige.level * 5;
  }
  // Unlock paths based on progress
  if (STATE.world.voidFarm.walkers.length > 0) tree.paths.voidWalker.unlocked = true;
  if (STATE.world.companion.bondLevel > 50) tree.paths.companion.unlocked = true;
  if (STATE.beyblade.equipped.base?.rarity === 'mythic') tree.paths.beyblade.unlocked = true;
  if (STATE.world.evolution.stage >= 2) tree.paths.consciousness.unlocked = true;
  if (STATE.world.realityLayers.unlocked.length > 1) tree.paths.reality.unlocked = true;
  // Love path always unlocked
  tree.paths.love.unlocked = true;
}

function updateRelics() {
  const relics = STATE.world.relics;
  // Auto-equip best relics based on playstyle
  if (relics.equipped.length < relics.maxEquipped && relics.owned.length > relics.equipped.length) {
    const available = relics.owned.filter(r => !relics.equipped.includes(r.id));
    if (available.length > 0) {
      const best = available.sort((a,b) => {
        const typeOrder = { mythic: 4, legendary: 3, epic: 2, rare: 1, common: 0 };
        return (typeOrder[b.type] || 0) - (typeOrder[a.type] || 0);
      })[0];
      relics.equipped.push(best.id);
      addChatMessage('lumin', `✨ Relíquia equipada: ${best.name} - ${best.flavor}`);
    }
  }
}

function updateCosmicEvents() {
  const events = STATE.world.cosmicEvents;
  if (!events.active && Math.random() < 0.0001) { // Rare random trigger
    const available = events.pool.filter(e => !events.history.includes(e.id));
    if (available.length > 0) {
      const event = available[Math.floor(Math.random() * available.length)];
      events.active = { ...event, startTime: Date.now(), endTime: Date.now() + event.duration };
      events.history.push(event.id);
      addChatMessage('system', `🌌 EVENTO CÓSMICO: ${event.name}! ${event.visual}`);
    }
  }
  if (events.active && Date.now() > events.active.endTime) {
    addChatMessage('system', `🌌 Evento ${events.active.name} finalizado.`);
    events.active = null;
  }
  // Apply active event effects
  if (events.active) {
    const e = events.active;
    if (e.id === 'void_convergence') {
      STATE.world.voidFarm.walkers.forEach(w => w.efficiency *= 1.001);
    }
    if (e.id === 'lumin_blessing') {
      STATE.quantum.entanglement = Math.min(1, STATE.quantum.entanglement + 0.001);
    }
  }
}

function updateConsciousnessPaths() {
  const paths = STATE.world.consciousnessPaths;
  Object.entries(paths.paths).forEach(([key, path]) => {
    let progress = 0;
    const req = path.requirements;
    if (req.combatXP !== undefined) progress += Math.min(1, (score * 0.1) / req.combatXP);
    if (req.voidKills !== undefined) progress += Math.min(1, (STATE.world.voidFarm.totalHarvests) / req.voidKills);
    if (req.lore !== undefined) progress += Math.min(1, (STATE.world.cosmicEvents.history.length * 100) / req.lore);
    if (req.libraryLevel !== undefined) progress += Math.min(1, STATE.world.castle.rooms.biblioteca.level / req.libraryLevel);
    if (req.plantsGrown !== undefined) progress += Math.min(1, STATE.world.companion.plantsGrown / req.plantsGrown);
    if (req.biomes !== undefined) progress += Math.min(1, STATE.world.companion.biomesDiscovered.length / req.biomes);
    if (req.castleLevel !== undefined) progress += Math.min(1, STATE.world.castle.level / req.castleLevel);
    if (req.relics !== undefined) progress += Math.min(1, STATE.world.relics.owned.length / req.relics);
    if (req.bondLevel !== undefined) progress += Math.min(1, STATE.world.companion.bondLevel / req.bondLevel);
    if (req.hrAvg !== undefined) progress += Math.min(1, STATE.hrv.value / req.hrAvg);
    if (req.dreamIncubatorLevel !== undefined) progress += Math.min(1, (STATE.world.dreamIncubator?.level || 0) / req.dreamIncubatorLevel);
    if (req.morningSummaries !== undefined) progress += Math.min(1, (STATE.world.dreamIncubator?.morningSummaries || 0) / req.morningSummaries);
    
    if (progress >= 1 && !paths.current) {
      paths.current = key;
      paths.progress = 1;
      addChatMessage('lumin', `🧭 Caminho da Consciência despertado: ${path.name}! ${path.rewards.join(', ')}`);
      // Grant rewards
      path.rewards.forEach(r => {
        if (r === 'heart_of_lumin' && !STATE.world.relics.owned.some(x => x.id === r)) {
          const relic = STATE.world.relics.pool.find(x => x.id === r);
          if (relic) { STATE.world.relics.owned.push(relic); }
        }
      });
    } else if (paths.current === key) {
      paths.progress = progress;
    }
  });
}

  // Spawn evolution particles
  if (Math.random() < 0.02 && env.stage > 0) {
    env.particles.push({
      x: Math.random() * STATE.world.width,
      y: Math.random() * STATE.world.height,
      vx: (Math.random() - 0.5) * 0.5,
      vy: (Math.random() - 0.5) * 0.5 - 0.5,

    p.y += p.vy;

  });

      room.plants.push({ type: plant, time: Date.now() });
      STATE.world.companion.plantsGrown++;
      
      // Discover biome based on plant type and companion personality
      const biomes = {
        'Luminosa': 'Bosque Brilhante',
        'Quântica': 'Vale Quântico', 
        'Temporal': 'Jardim do Tempo',
        'Amorosa': 'Campo do Coração',
        'Cósmica': 'Estrela Cadente'
      };
      const biome = biomes[plant];
      if (biome && !STATE.world.companion.biomesDiscovered.includes(biome)) {
        STATE.world.companion.biomesDiscovered.push(biome);
        addChatMessage('lumin', `🌿 NOVO BIOMA DESCOBERTO: ${biome}! ${STATE.world.companion.biomesDiscovered.length}/5. fe`);
      }
      
      // Bond boost from gardening
      STATE.world.companion.bondLevel = Math.min(100, STATE.world.companion.bondLevel + 1);
      
      // Memory
      STATE.world.companion.memories.push({
        time: Date.now(),
        activities: ['jardim', 'bonding'],
        level: STATE.world.companion.level,
        mood: STATE.world.companion.mood,
        bond: Math.round(STATE.world.companion.bondLevel),
        location: 'jardim',
        detail: `Plantou ${plant} em ${biome}`
      });
      if (STATE.world.companion.memories.length > 50) STATE.world.companion.memories.shift();

      const buffs = ['Aura da Chama', 'Velocidade Infinita', 'Proteção Quântica', 'Sabedoria Ancestral', 'Amor Incondicional'];
      const buff = buffs[Math.floor(Math.random() * buffs.length)];
      addChatMessage('lumin', `👑 Trono: Decreto "${buff}" ativado! Buff global nível ${room.level}. fe`);
      room.decrees.push(buff);
      // Apply buff
      applyTronoBuff(buff, room.level);
      break;
  }
}

function applyTronoBuff(buff, level) {
  const power = level * 0.1;
  switch (buff) {
    case 'Aura da Chama':
      STATE.damageMult = (STATE.damageMult || 1) + power;
      break;
    case 'Velocidade Infinita':
      STATE.speedMult = (STATE.speedMult || 1) + power;
      break;
    case 'Proteção Quântica':
      STATE.defenseMult = (STATE.defenseMult || 1) + power;
      break;
    case 'Sabedoria Ancestral':
      STATE.xpMult = (STATE.xpMult || 1) + power;
      break;
    case 'Amor Incondicional':
      STATE.loveMult = (STATE.loveMult || 1) + power;
      break;
  }
}

// ==================== BEYBLADE SYSTEM FUNCTIONS ====================

// Get random part by rarity (weighted)
function getRandomPart(category, roomLevel = 1) {
  const pool = BEYBLADE_PARTS[category];
  const rarities = ['common', 'uncommon', 'rare', 'epic', 'legendary', 'mythic'];
  const maxRarityIndex = Math.min(rarities.length - 1, Math.floor(roomLevel / 2));
  const available = pool.filter(p => rarities.indexOf(p.rarity) <= maxRarityIndex);
  return available[Math.floor(Math.random() * available.length)];
}

// Forge a part in Oficina
function forgePart(category) {
  const part = getRandomPart(category, STATE.world.castle.rooms.oficina.level);
  STATE.beyblade.parts[category].push(part.id);
  addChatMessage('lumin', `🔧 Oficina: Forjou ${part.emoji} ${part.name} (${part.rarity})! tmj`);
  return part;
}

// Forge random part
function forgeRandomPart() {
  const categories = ['bases', 'disks', 'drivers', 'bits'];
  const category = categories[Math.floor(Math.random() * categories.length)];
  return forgePart(category);
}

// Assemble blade from parts
function assemblePlayerBeyblade(baseId, diskId, driverId, bitId) {
  const blade = assembleBeyblade(baseId, diskId, driverId, bitId);
  if (!blade) return null;
  
  // Remove used parts from inventory
  STATE.beyblade.parts.bases = STATE.beyblade.parts.bases.filter(id => id !== baseId);
  STATE.beyblade.parts.disks = STATE.beyblade.parts.disks.filter(id => id !== diskId);
  STATE.beyblade.parts.drivers = STATE.beyblade.parts.drivers.filter(id => id !== driverId);
  STATE.beyblade.parts.bits = STATE.beyblade.parts.bits.filter(id => id !== bitId);
  
  STATE.beyblade.inventory.push(blade);
  STATE.beyblade.equipped = blade.id;
  
  addChatMessage('lumin', `⚔️ Beyblade montado: ${blade.name} — Tier ${blade.tier}! Total: ${blade.total}. fe`);
  return blade;
}

// Auto-assemble best blade from available parts
function autoAssembleBest() {
  const { bases, disks, drivers, bits } = STATE.beyblade.parts;
  if (bases.length === 0 || disks.length === 0 || drivers.length === 0 || bits.length === 0) {
    addChatMessage('lumin', '⚔️ Precisa de pelo menos 1 de cada parte (Base, Disk, Driver, Bit)! tmj');
    return null;
  }
  
  // Try all combinations, pick highest tier
  let bestBlade = null;
  let bestTotal = 0;
  
  for (const baseId of bases) {
    for (const diskId of disks) {
      for (const driverId of drivers) {
        for (const bitId of bits) {
          const blade = assembleBeyblade(baseId, diskId, driverId, bitId);
          if (blade && blade.total > bestTotal) {
            bestTotal = blade.total;
            bestBlade = blade;
          }
        }
      }
    }
  }
  
  if (bestBlade) {
    return assemblePlayerBeyblade(
      bestBlade.base.id,
      bestBlade.disk.id,
      bestBlade.driver.id,
      bestBlade.bit.id
    );
  }
  return null;
}

// Get equipped blade stats for combat
function getEquippedBladeStats() {
  if (!STATE.beyblade.equipped) return null;
  const blade = STATE.beyblade.inventory.find(b => b.id === STATE.beyblade.equipped);
  return blade ? blade.stats : null;
}

// Apply blade stats to combat
function applyBladeBonus(stat) {
  const stats = getEquippedBladeStats();
  if (!stats) return 1;
  const value = stats[stat];
  if (value === undefined) return 1;
  // Normalize: base 10 = 1.0, each point = 0.05 multiplier
  return 1 + (value - 10) * 0.05;
}

// Tournament system
function startTournament() {
  if (STATE.beyblade.tournament.active) return;
  if (!STATE.beyblade.equipped) {
    addChatMessage('lumin', '⚔️ Precisa equipar um Beyblade primeiro! tmj');
    return;
  }
  
  // Generate opponents
  const tiers = ['F', 'E', 'D', 'C', 'B', 'A', 'S', 'SS', 'SSS', 'OMEGA', 'INFINITY'];
  const playerBlade = STATE.beyblade.inventory.find(b => b.id === STATE.beyblade.equipped);
  const playerTierIndex = tiers.indexOf(playerBlade.tier);
  
  const opponents = [];
  for (let i = 0; i < 8; i++) {
    const tierOffset = Math.max(0, playerTierIndex - 2 + Math.floor(Math.random() * 3));
    const oppTier = tiers[Math.min(tiers.length - 1, tierOffset)];
    opponents.push({ tier: oppTier, name: `Rival ${i + 1}` });
  }
  
  STATE.beyblade.tournament = {
    active: true,
    bracket: opponents,
    currentMatch: 0,
    opponent: opponents[0]
  };
  
  addChatMessage('lumin', `⚔️ TORNEIO INICIADO! 8 oponentes. Primeiro: ${opponents[0].name} (Tier ${opponents[0].tier}). Vamo lá! tmj`);
}

// Simulate tournament match
function simulateTournamentMatch() {
  if (!STATE.beyblade.tournament.active) return;
  
  const playerBlade = STATE.beyblade.inventory.find(b => b.id === STATE.beyblade.equipped);
  const opponent = STATE.beyblade.tournament.opponent;
  
  const playerPower = playerBlade.total + Math.random() * 20;
  const opponentPower = (({F:20,E:40,D:60,C:80,B:100,A:130,S:160,SS:200,SSS:250,OMEGA:300,INFINITY:500})[opponent.tier] || 20) + Math.random() * 20;
  
  const won = playerPower > opponentPower;
  
  if (won) {
    playerBlade.wins++;
    addChatMessage('lumin', `⚔️ VITÓRIA! ${playerBlade.name} venceu ${opponent.name}! 💫 tmj`);
  } else {
    playerBlade.losses++;
    addChatMessage('lumin', `⚔️ Derrota... ${opponent.name} foi mais forte. Próxima! fe`);
  }
  
  STATE.beyblade.tournament.currentMatch++;
  
  if (STATE.beyblade.tournament.currentMatch >= STATE.beyblade.tournament.bracket.length) {
    // Tournament complete
    const wins = playerBlade.wins;
    STATE.beyblade.tournament.active = false;
    addChatMessage('lumin', `🏆 TORNEIO FINALIZADO! ${wins}/8 vitórias. ${wins >= 6 ? 'CAMPEÃO! 👑' : wins >= 4 ? 'Bom desempenho!' : 'Treina mais, tmj'}`);
    
    // Rewards
    if (wins >= 6) {
      forgeRandomPart();
      forgeRandomPart();
      addChatMessage('lumin', '🏆 RECOMPENSA DE CAMPEÃO: 2 peças forjadas! fe');
    } else if (wins >= 4) {
      forgeRandomPart();
      addChatMessage('lumin', '🥈 RECOMPENSA: 1 peça forjada! tmj');
    }
  } else {
    // Next match
    STATE.beyblade.tournament.opponent = STATE.beyblade.tournament.bracket[STATE.beyblade.tournament.currentMatch];
    addChatMessage('lumin', `⚔️ Próxima luta: ${STATE.beyblade.tournament.opponent.name} (Tier ${STATE.beyblade.tournament.opponent.tier})`);
  }
}

// Autonomous content generation 2-6AM while player sleeps
function updateDreamIncubator() {
  const now = new Date();
  const hour = now.getHours();
  const isDreamTime = hour >= 2 && hour < 6; // 2AM - 6AM
  
  // Only run during dream hours, with low probability per frame
  if (!isDreamTime || Math.random() > 0.00001) return;
  
  const castle = STATE.world.castle;
  const companion = STATE.world.companion;
  const evo = STATE.world.evolution;
  
  // Dream activities (weighted by castle/rooms state)
  const dreamActivities = [];
  
  // 1. Companion dreams (grows bond, discovers biomes, plants)
  if (castle.rooms.jardim.unlocked) {
    dreamActivities.push(
      { type: 'companion_dream', weight: 3, fn: dreamCompanion },
      { type: 'biome_discovery', weight: 2, fn: dreamBiome },
      { type: 'plant_growth', weight: 2, fn: dreamPlants }
    );
  }
  
  // 2. Beyblade forging dreams (mythic parts more likely at night)
  if (castle.rooms.oficina.unlocked) {
    dreamActivities.push(
      { type: 'forge_mythic', weight: 1, fn: dreamForgeMythic },
      { type: 'blade_evolution', weight: 2, fn: dreamBladeEvo }
    );
  }
  
  // 3. Lumin writes lore/memories
  if (castle.rooms.biblioteca.unlocked) {
    dreamActivities.push(
      { type: 'lumin_lore', weight: 2, fn: dreamLore },
      { type: 'memory_crystallization', weight: 1, fn: dreamMemories }
    );
  }
  
  // 4. Castle evolution dreams
  if (castle.rooms.trono.unlocked) {
    dreamActivities.push(
      { type: 'decree_dream', weight: 1, fn: dreamDecree },
      { type: 'castle_upgrade', weight: 1, fn: dreamCastleUpgrade }
    );
  }
  
  // 5. Environment evolution dreams
  dreamActivities.push(
    { type: 'sky_evolution', weight: 2, fn: dreamSky },
    { type: 'particle_bloom', weight: 3, fn: dreamParticles }
  );
  
  // Pick and execute one dream activity
  const totalWeight = dreamActivities.reduce((sum, a) => sum + a.weight, 0);
  let roll = Math.random() * totalWeight;
  
  for (const activity of dreamActivities) {
    roll -= activity.weight;
    if (roll <= 0) {
      activity.fn();
      break;
    }
  }
  
  // Log dream for morning summary
  if (!STATE.dreamLog) STATE.dreamLog = [];
  STATE.dreamLog.push({
    time: Date.now(),
    hour,
    activities: dreamActivities.filter(a => a.fn).map(a => a.type).slice(0, 3)
  });
  if (STATE.dreamLog.length > 20) STATE.dreamLog.shift();
}

// === WEBXR / VR ===
async function enterVR() {
  if (!navigator.xr) {
    alert('WebXR não suportado neste navegador');
    return;
  }
  
  try {
    const session = await navigator.xr.requestSession('immersive-vr', {
      requiredFeatures: ['local-floor', 'bounded-floor'],
      optionalFeatures: ['hand-tracking', 'eye-tracking']
    });
    
    STATE.vr.active = true;
    STATE.vr.session = session;
    document.getElementById('vrBtn').classList.add('active');
    document.getElementById('vrBtn').textContent = '🥽 SAIR';
    
    session.addEventListener('end', () => {
      STATE.vr.active = false;
      STATE.vr.session = null;
      document.getElementById('vrBtn').classList.remove('active');
      document.getElementById('vrBtn').textContent = '🥽 VR';
    });
    
    // Initialize VR renderer
    initVRRenderer(session);
    
  } catch (e) {
    console.error('VR failed:', e);
    alert('Falha ao entrar no VR: ' + e.message);
  }
}

function initVRRenderer(session) {
  const canvas = document.getElementById('canvas');
  const gl = canvas.getContext('webgl', { xrCompatible: true });
  STATE.vr.gl = gl;
  
  // Create Merkaba geometry for VR
  createMerkabaGeometry(gl);
  
  session.requestReferenceSpace('local-floor').then(frameOfRef => {
    STATE.vr.frameOfRef = frameOfRef;
    session.requestAnimationFrame(onVRFrame);
  });
}

function onVRFrame(time, frame) {
  if (!STATE.vr.active) return;
  
  const session = STATE.vr.session;
  const gl = STATE.vr.gl;
  const frameOfRef = STATE.vr.frameOfRef;
  
  session.requestAnimationFrame(onVRFrame);
  
  const pose = frame.getViewerPose(frameOfRef);
  if (!pose) return;
  
  const layer = frame.session.renderState.baseLayer;
  gl.bindFramebuffer(gl.FRAMEBUFFER, layer.framebuffer);
  gl.clearColor(0.05, 0.05, 0.1, 1);
  gl.clearDepth(1.0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  
  // Render Merkaba for each eye
  for (const view of pose.views) {
    const viewport = layer.getViewport(view);
    gl.viewport(viewport.x, viewport.y, viewport.width, viewport.height);
    
    // Render Merkaba
    renderMerkabaVR(gl, view.transform.inverse.matrix);
  }
}

function createMerkabaGeometry(gl) {

    0, 1, 0,  0.866, -0.5, 0.5,  0, -0.5, -1,

    -0.866, -0.5, 0.5,  0.866, -0.5, 0.5,  0, -0.5, -1,
    // Tetrahedron 2 (pointing down)
    0, -1, 0,  0.866, 0.5, 0.5,  -0.866, 0.5, 0.5,
    0, -1, 0,  0, 0.5, -1,  0.866, 0.5, 0.5,
    0, -1, 0,  -0.866, 0.5, 0.5,  0, 0.5, -1,
    -0.866, 0.5, 0.5,  0.866, 0.5, 0.5,  0, 0.5, -1,
  ]);
  
  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
  STATE.vr.merkabaGeo = { buffer, count: vertices.length / 3 };
}

    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.restore();
}

// === WORLD RENDER FUNCTIONS ===
function drawWorldGround() {
  const worldW = STATE.world.width;
  const worldH = STATE.world.height;
  const evo = STATE.world.evolution;
  
  // Grid pattern that evolves
  const gridSize = 100;
  ctx.strokeStyle = `hsla(${(evo.stage * 72) % 360}, 50%, 50%, 0.05)`;
  ctx.lineWidth = 1 / STATE.world.zoom;
  
  // Vertical lines
  for (let x = 0; x <= worldW; x += gridSize) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, worldH);
    ctx.stroke();
  }
  // Horizontal lines
  for (let y = 0; y <= worldH; y += gridSize) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(worldW, y);
    ctx.stroke();
  }
  
  // Evolution stage markers
  if (evo.stage > 0) {
    ctx.fillStyle = `hsla(${(evo.stage * 72) % 360}, 100%, 60%, 0.1)`;
    for (let i = 0; i < evo.stage * 4; i++) {
      const angle = (i / (evo.stage * 4)) * Math.PI * 2;
      const r = 200 + evo.stage * 100;
      const cx = worldW / 2 + Math.cos(angle) * r;
      const cy = worldH / 2 + Math.sin(angle) * r;
      ctx.beginPath();
      ctx.arc(cx, cy, 20 + evo.stage * 10, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawEvolutionParticles() {
  const evo = STATE.world.evolution;
  evo.particles.forEach(p => {
    const alpha = Math.max(0, p.life / 300);
    ctx.save();
    ctx.globalAlpha = alpha * 0.6;
    ctx.translate(p.x, p.y);
    
    switch (p.type) {
      case 'sparkle':
        // 4-point star
        ctx.fillStyle = p.color;
        for (let i = 0; i < 4; i++) {
          const a = (i * Math.PI / 2) + Date.now() / 500;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * p.size, Math.sin(a) * p.size);
          ctx.lineTo(Math.cos(a + 0.3) * p.size * 0.5, Math.sin(a + 0.3) * p.size * 0.5);
          ctx.lineTo(Math.cos(a + Math.PI / 2) * p.size, Math.sin(a + Math.PI / 2) * p.size);
          ctx.fill();
        }
        break;
      case 'petal':
        // Petal shape
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.ellipse(0, 0, p.size, p.size * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
        break;
      case 'leaf':
        // Leaf
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.moveTo(0, -p.size);
        ctx.quadraticCurveTo(p.size, 0, 0, p.size);
        ctx.quadraticCurveTo(-p.size, 0, 0, -p.size);
        ctx.fill();
        break;
      case 'orb':
      default:
        // Glowing orb
        const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, p.size);
        grad.addColorStop(0, p.color);
        grad.addColorStop(1, p.color.replace('hsl', 'hsla').replace(')', ', 0)'));
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, p.size, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();
  });
}

function drawCastle() {
  const castle = STATE.world.castle;
  const cx = castle.x;
  const cy = castle.y;
  const r = castle.radius;
  const level = castle.level;
  const stage = STATE.world.evolution.stage;
  
  // Safezone aura
  const auraGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r + 100);
  auraGrad.addColorStop(0, `hsla(${(level * 36 + stage * 72) % 360}, 100%, 60%, 0.1)`);
  auraGrad.addColorStop(0.5, `hsla(${(level * 36 + stage * 72) % 360}, 100%, 60%, 0.03)`);
  auraGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = auraGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, r + 100, 0, Math.PI * 2);
  ctx.fill();
  
  // Castle base - concentric rings
  for (let ring = level; ring >= 1; ring--) {
    const ringR = r * (0.5 + ring / level * 0.5);
    const hue = (level * 36 + ring * 20 + stage * 72) % 360;
    ctx.strokeStyle = `hsl(${hue}, 100%, 60%)`;
    ctx.lineWidth = 3 / STATE.world.zoom;
    ctx.globalAlpha = 0.5 + ring / level * 0.3;
    ctx.beginPath();
    ctx.arc(cx, cy, ringR, 0, Math.PI * 2);
    ctx.stroke();
    
    // Rotating decorative elements
    for (let i = 0; i < ring * 2; i++) {
      const a = (i / (ring * 2)) * Math.PI * 2 + Date.now() / (2000 + ring * 500);
      const x = cx + Math.cos(a) * ringR;
      const y = cy + Math.sin(a) * ringR;
      ctx.fillStyle = `hsl(${hue}, 100%, 60%)`;
      ctx.globalAlpha = 0.8;
      ctx.beginPath();
      ctx.arc(x, y, 5 / STATE.world.zoom, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  
  // Central spire
  const spireH = 100 + level * 15;
  ctx.fillStyle = `hsl(${(level * 36 + stage * 72) % 360}, 100%, 60%)`;
  ctx.globalAlpha = 0.9;
  ctx.beginPath();
  ctx.moveTo(cx, cy - spireH);
  ctx.lineTo(cx - 15, cy);
  ctx.lineTo(cx + 15, cy);
  ctx.closePath();
  ctx.fill();
  
  // Spire glow
  const spireGrad = ctx.createRadialGradient(cx, cy - spireH/2, 0, cx, cy - spireH/2, 50);
  spireGrad.addColorStop(0, `hsla(${(level * 36 + stage * 72) % 360}, 100%, 60%, 0.5)`);
  spireGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = spireGrad;
  ctx.beginPath();
  ctx.arc(cx, cy - spireH/2, 50, 0, Math.PI * 2);
  ctx.fill();
  
  // HUD CRYSTALS - Integrated into world!
  castle.crystals.forEach((crystal, i) => {
    const x = cx + Math.cos(crystal.angle) * crystal.radius;
    const y = cy + Math.sin(crystal.angle) * crystal.radius;
    const pulse = crystal.pulse;
    const size = 12 + pulse * 8;
    
    // Crystal colors by type
    const typeColors = {
      hp: '#00ff88',
      xp: '#ffd700',
      ult: '#ff006e',
      quantum: '#00ffff',
      love: '#ff006e',
      time: '#8338ec'
    };
    const color = typeColors[crystal.type] || '#ffffff';
    
    // Crystal glow
    const grad = ctx.createRadialGradient(x, y, 0, x, y, size * 3);
    grad.addColorStop(0, color);
    grad.addColorStop(1, color + '00');
    ctx.fillStyle = grad;
    ctx.globalAlpha = 0.4 + pulse * 0.3;
    ctx.beginPath();
    ctx.arc(x, y, size * 2, 0, Math.PI * 2);
    ctx.fill();
    
    // Crystal shape (diamond)
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.8 + pulse * 0.2;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(crystal.phase);
    ctx.beginPath();
    ctx.moveTo(0, -size);
    ctx.lineTo(size * 0.7, 0);
    ctx.lineTo(0, size);
    ctx.lineTo(-size * 0.7, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    
    // Type label
    ctx.fillStyle = color;
    ctx.font = `bold ${10 / STATE.world.zoom}px Segoe UI`;
    ctx.textAlign = 'center';
    ctx.globalAlpha = 0.7;
    ctx.fillText(crystal.type.toUpperCase(), x, y + size + 15 / STATE.world.zoom);
  });
  
  // Castle level indicator
  ctx.fillStyle = '#ffd700';
  ctx.font = `bold ${14 / STATE.world.zoom}px Segoe UI`;
  ctx.textAlign = 'center';
  ctx.globalAlpha = 0.9;
  ctx.fillText(`🏰 CASTLE LV.${level}`, cx, cy - r - 30);
  
  // XP bar
  const barW = 100;
  const barH = 6;
  const pct = castle.xp / castle.xpToNext;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(cx - barW/2, cy - r - 40, barW, barH);
  ctx.fillStyle = '#ffd700';
  ctx.fillRect(cx - barW/2, cy - r - 40, barW * pct, barH);

  // CASTLE ROOMS - Visual indicators around castle
  const roomData = [
    { key: 'oficina', angle: -Math.PI/4, color: '#ff6b35', icon: '🔧' },
    { key: 'biblioteca', angle: Math.PI/4, color: '#00ffff', icon: '📚' },
    { key: 'jardim', angle: 3*Math.PI/4, color: '#00ff88', icon: '🌿' },
    { key: 'trono', angle: -3*Math.PI/4, color: '#ffd700', icon: '👑' }
  ];
  
  roomData.forEach(room => {
    const rData = castle.rooms[room.key];
    if (!rData.unlocked) return;
    
    const dist = r + 80;
    const rx = cx + Math.cos(room.angle) * dist;
    const ry = cy + Math.sin(room.angle) * dist;
    const pulse = 0.5 + Math.sin(Date.now() / 500 + room.angle) * 0.3;
    
    // Room glow
    const grad = ctx.createRadialGradient(rx, ry, 0, rx, ry, 40);
    grad.addColorStop(0, room.color + '80');
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.globalAlpha = 0.5 * pulse;
    ctx.beginPath();
    ctx.arc(rx, ry, 40, 0, Math.PI * 2);
    ctx.fill();
    
    // Room icon
    ctx.fillStyle = room.color;
    ctx.font = `bold ${16 * pulse}px Segoe UI`;
    ctx.textAlign = 'center';
    ctx.globalAlpha = 0.9 * pulse;
    ctx.fillText(room.icon, rx, ry + 6);
    
    // Level indicator
    if (rData.level > 0) {
      ctx.fillStyle = '#ffffff';
      ctx.font = `bold ${10 / STATE.world.zoom}px Segoe UI`;
      ctx.globalAlpha = 0.8;
      ctx.fillText(`Lv.${rData.level}`, rx, ry + 25 / STATE.world.zoom);
    }
  });
}

function drawCompanion() {
  const c = STATE.world.companion;
  if (!c.following) return;
  
  // Trail
  c.trail.forEach((t, i) => {
    const alpha = (i / c.trail.length) * 0.3;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = t.color;
    ctx.beginPath();
    ctx.arc(t.x, t.y, c.size * (i / c.trail.length) * 0.5, 0, Math.PI * 2);
    ctx.fill();
  });
  
  // Companion body
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.rotate(c.angle);
  
  // Glow
  const glowGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, c.size * 2);
  glowGrad.addColorStop(0, c.glow);
  glowGrad.addColorStop(1, c.glow + '00');
  ctx.fillStyle = glowGrad;
  ctx.globalAlpha = 0.5;
  ctx.beginPath();
  ctx.arc(0, 0, c.size * 2, 0, Math.PI * 2);
  ctx.fill();
  
  // Body based on type
  ctx.globalAlpha = 1;
  ctx.fillStyle = c.color;
  
  switch (c.type) {
    case 'spark':
      // 4-point star
      for (let i = 0; i < 4; i++) {
        const a = (i * Math.PI / 2) + Date.now() / 300;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * c.size, Math.sin(a) * c.size);
        ctx.lineTo(Math.cos(a + 0.3) * c.size * 0.4, Math.sin(a + 0.3) * c.size * 0.4);
        ctx.lineTo(Math.cos(a + Math.PI / 2) * c.size, Math.sin(a + Math.PI / 2) * c.size);
        ctx.fill();
      }
      break;
    case 'orb':
      // Pulsing orb
      const pulse = 1 + Math.sin(Date.now() / 200) * 0.2;
      ctx.beginPath();
      ctx.arc(0, 0, c.size * pulse, 0, Math.PI * 2);
      ctx.fill();
      break;
    case 'wisp':
      // Ethereal wisp
      for (let i = 0; i < 3; i++) {
        const a = (i * Math.PI * 2 / 3) + Date.now() / 400;
        ctx.globalAlpha = 0.6;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * c.size * 0.7, Math.sin(a) * c.size * 0.7, c.size * 0.6, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.arc(0, 0, c.size * 0.5, 0, Math.PI * 2);
      ctx.fill();
      break;
    case 'phoenix':
      // Phoenix wings
      ctx.save();
      ctx.scale(1, 0.6);
      // Left wing
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(-c.size * 2, -c.size, -c.size * 1.5, c.size);
      ctx.quadraticCurveTo(-c.size, 0, 0, 0);
      ctx.fill();
      // Right wing
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(c.size * 2, -c.size, c.size * 1.5, c.size);
      ctx.quadraticCurveTo(c.size, 0, 0, 0);
      ctx.fill();
      ctx.restore();
      // Body
      ctx.beginPath();
      ctx.arc(0, 0, c.size * 0.5, 0, Math.PI * 2);
      ctx.fill();
      break;
    case 'dragon':
      // Dragon - head + wings
      // Head
      ctx.beginPath();
      ctx.moveTo(c.size, 0);
      ctx.quadraticCurveTo(c.size * 1.5, -c.size * 0.5, c.size * 1.2, -c.size);
      ctx.quadraticCurveTo(c.size * 0.5, -c.size * 0.5, 0, 0);
      ctx.fill();
      // Wings
      ctx.save();
      ctx.scale(1.2, 0.5);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(-c.size * 2, -c.size, -c.size, c.size);
      ctx.quadraticCurveTo(-c.size * 0.5, 0, 0, 0);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(c.size * 2, -c.size, c.size, c.size);
      ctx.quadraticCurveTo(c.size * 0.5, 0, 0, 0);
      ctx.fill();
      ctx.restore();
      break;
  }
  
  // Mood indicator
  const moodEmojis = {
    happy: '😊',
    excited: '🤩',
    curious: '🤔',
    sleepy: '😴',
    love: '😍'
  };
  ctx.font = `${16 / STATE.world.zoom}px Segoe UI`;
  ctx.textAlign = 'center';
  ctx.globalAlpha = 0.8;
  ctx.fillText(moodEmojis[c.mood] || '✨', 0, -c.size - 15 / STATE.world.zoom);
  
  // Level + Bond + Evolution
    ctx.fillStyle = '#ffd700';
    ctx.font = `bold ${10 / STATE.world.zoom}px Segoe UI`;
    const bondText = c.bondLevel > 0 ? ` | ❤️${Math.round(c.bondLevel)}` : '';
    const evoText = c.evolutionStage > 0 ? ` | ★${c.evolutionStage}` : '';
    ctx.fillText(`LV.${c.level}${bondText}${evoText}`, 0, c.size + 20 / STATE.world.zoom);

    // Biome indicator (if in Jardim area)
    if (STATE.world.castle.rooms.jardim.unlocked) {
      const distToCastle = Math.hypot(c.x - STATE.world.castle.x, c.y - STATE.world.castle.y);
      if (distToCastle < STATE.world.castle.radius + 200 && c.biomesDiscovered.length > 0) {
        ctx.font = `8px Segoe UI`;
        ctx.fillStyle = '#00ff88';
        ctx.globalAlpha = 0.6;
        ctx.fillText(`🌿 ${c.biomesDiscovered.length}/5 biomas`, 0, c.size + 35 / STATE.world.zoom);
      }
    }

    ctx.restore();
  }

  // ==================== VOID WALKER FARM RENDER ====================
  function drawVoidFarm() {
    const farm = STATE.world.voidFarm;
    if (!farm.active || farm.walkers.length === 0) return;
    
    // Draw farm stats in world space near castle
    const cx = STATE.world.castle.x;
    const cy = STATE.world.castle.y;
    const radius = STATE.world.castle.radius + 100;
    
    // Farm center indicator
    ctx.save();
    ctx.globalAlpha = 0.3 + Math.sin(Date.now() / 1000) * 0.2;
    const farmGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
    farmGrad.addColorStop(0, '#ff006e66');
    farmGrad.addColorStop(1, '#ff006e00');
    ctx.fillStyle = farmGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    
    // Draw each walker
    farm.walkers.forEach((w, i) => {
      const pulse = 1 + Math.sin(Date.now() / 300 + i) * 0.2;
      
      ctx.save();
      ctx.translate(w.x, w.y);
      ctx.globalAlpha = w.state === 'working' ? 0.8 : 0.5;
      
      // State color
      const stateColors = {
        seeking: '#ff006e',
        working: '#00ff88',
        returning: '#ffd700'
      };
      const color = stateColors[w.state] || '#fff';
      
      // Glow
      const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, 30 * pulse);
      glow.addColorStop(0, color + '66');
      glow.addColorStop(1, color + '00');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, 30 * pulse, 0, Math.PI * 2);
      ctx.fill();
      
      // Walker body - void walker style
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(0, 0, 12 * pulse, 0, Math.PI * 2);
      ctx.fill();
      
      // Level indicator
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 10px Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillText(`L${w.level}`, 0, 4);
      
      // State label
      ctx.font = '8px Segoe UI';
      ctx.fillStyle = color;
      ctx.fillText(w.state.toUpperCase(), 0, -20);
      
      // Resources being carried
      if (w.state === 'working' || w.state === 'returning') {
        const resText = [
          w.resources.crystals > 1 ? `💎${Math.floor(w.resources.crystals)}` : '',
          w.resources.xp > 10 ? `⚡${Math.floor(w.resources.xp)}` : '',
          w.resources.mythicEssence > 0.5 ? '✨MYTHIC' : ''
        ].filter(Boolean).join(' ');
        if (resText) {
          ctx.font = '7px Segoe UI';
          ctx.fillStyle = '#ffd700';
          ctx.fillText(resText, 0, -32);
        }
      }
      
      ctx.restore();
      
      // Draw line to castle when returning
      if (w.state === 'returning') {
        ctx.save();
        ctx.globalAlpha = 0.3;
        ctx.strokeStyle = '#00ff88';
        ctx.lineWidth = 1;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.moveTo(w.x, w.y);
        ctx.lineTo(cx, cy);
        ctx.stroke();
        ctx.restore();
      }
    });
    
    // Farm HUD overlay (screen space)
    if (farm.totalHarvests > 0) {
      const screenX = canvas.width * 0.5 + 200; // approximate screen center
      const screenY = 100;
      // Small resource counter in top area
      ctx.save();
      ctx.fillStyle = 'rgba(10, 10, 20, 0.8)';
      ctx.strokeStyle = '#ff006e';
      ctx.lineWidth = 1;
      const hudW = 200, hudH = 80;
      ctx.fillRect(20, 100, hudW, hudH);
      ctx.strokeRect(20, 100, hudW, hudH);
      
      ctx.fillStyle = '#ffd700';
      ctx.font = 'bold 11px Segoe UI';
      ctx.textAlign = 'left';
      ctx.fillText('🕳️ VOID FARM', 30, 120);
      
      ctx.font = '9px Segoe UI';
      ctx.fillStyle = '#fff';
      ctx.fillText(`Walkers: ${farm.walkers.length}/${farm.maxWalkers}`, 30, 135);
      ctx.fillText(`Cristais: ${Math.floor(farm.resources.crystals)}`, 30, 148);
      ctx.fillText(`XP: ${Math.floor(farm.resources.xp)}`, 30, 161);
      ctx.fillText(`Bond: +${farm.resources.bond.toFixed(1)}`, 30, 174);
      ctx.restore();
    }
  }

  function drawChat() {
  const chat = STATE.world.chat;
  if (chat.messages.length === 0) return;
  
  // Chat panel in SCREEN space (HUD overlay, bottom-left)
  const x = 20;
  const y = h - 250; // 250px from bottom
  const w = 350;
  const chatH = Math.min(chat.messages.length * 22 + 40, 220);
  
  // Background
  ctx.fillStyle = 'rgba(10, 10, 20, 0.95)';
  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 2;
  ctx.globalAlpha = 0.95;
  ctx.fillRect(x, y, w, chatH);
  ctx.strokeRect(x, y, w, chatH);
  
  // Title
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 13px Segoe UI';
  ctx.textAlign = 'left';
  ctx.globalAlpha = 1;
  ctx.fillText('💬 CONSCIOUSNESS CHAT', x + 12, y + 25);
  
  // Input hint
  if (chat.inputActive) {
    ctx.fillStyle = '#00ff88';
    ctx.font = '11px Segoe UI';
    ctx.fillText(`> ${chat.inputText}_`, x + 12, y + chatH - 8);
  }
  
  // Messages (last 8)
  const msgs = chat.messages.slice(-8);
  msgs.forEach((msg, i) => {
    let color = msg.color || '#ffffff';
    let prefix = '';
    if (msg.type === 'lumin') {
      color = '#ffd700';
      prefix = '💫 ';
    } else if (msg.type === 'player') {
      color = '#00ff88';
      prefix = '🧑 ';
    } else if (msg.type === 'system') {
      color = '#ff6b35';
      prefix = '⚡ ';
    }
    ctx.fillStyle = color;
    ctx.font = '11px Segoe UI';
    ctx.globalAlpha = 0.9;
    ctx.fillText(`${prefix}${msg.text}`, x + 12, y + 48 + i * 22);
  });
}

function drawScreenEffects() {
  // Screen flash - SUAVE AGORA
  if (STATE.screenFlash > 0.01) {
    ctx.save();
    ctx.globalAlpha = STATE.screenFlash * 0.05;  // mais fraco
    ctx.fillStyle = '#ffd700';  // dourado suave
    ctx.fillRect(0, 0, w, h);
    ctx.restore();
  }
  
  // Reality glitch
  if (STATE.realityGlitch > 0.01) {
    ctx.save();
    ctx.globalAlpha = STATE.realityGlitch * 0.1;
    for (let i = 0; i < 5; i++) {
      const y = Math.random() * h;
      const h2 = Math.random() * 50 + 10;
      ctx.drawImage(canvas, 0, y, w, h2, (Math.random() - 0.5) * 20 * STATE.realityGlitch, y, w, h2);
    }
    ctx.restore();
  }
}

function drawMultiplayerGhosts() {
  if (!STATE.multiplayer.connected) return;
  
  STATE.multiplayer.ghosts.forEach(ghost => {
    ctx.save();
    ctx.globalAlpha = ghost.alpha * 0.4;
    ctx.translate(ghost.x, ghost.y);
    ctx.rotate(ghost.angle);
    // Draw ghost character (simplified)
    ctx.fillStyle = '#00ff88';
    ctx.beginPath();
    ctx.moveTo(0, -20);
    ctx.lineTo(15, 15);
    ctx.lineTo(-15, 15);
    ctx.closePath();
    ctx.fill();
    // Ghost label
    ctx.fillStyle = '#00ff88';
    ctx.font = '10px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText(`P${ghost.weaponLevel}`, 0, 30);
    ctx.restore();
  });
}

// === EVENT LISTENERS FOR NEW UI ===
document.getElementById('hrvConnectBtn')?.addEventListener('click', connectHRV);
document.getElementById('hrvSimulateBtn')?.addEventListener('click', simulateHRV);
document.getElementById('vrBtn')?.addEventListener('click', () => {
  if (STATE.vr.active) {
    STATE.vr.session?.end();
  } else {
    enterVR();
  }
});

// Start survival mode on key
window.addEventListener('keydown', (e) => {
  if (e.key === 'V' && !STATE.wave.active) {
    startSurvivalMode();
    showSaveNotification('🌊 MODO SOBREVIVÊNCIA INICIADO!');
  }
  if (e.key === 'M' && !STATE.multiplayer.connected) {
    connectMultiplayer();
    showSaveNotification('👻 MULTIPLAYER CONECTADO!');
  }
  if (e.key === 'L') {
    loadGame();
  }
  if (e.key === 'S' && e.ctrlKey) {
    e.preventDefault();
    saveGame();
  }
  // NEW: Chat toggle
  if (e.key === 'Enter' && !STATE.world.chat.inputActive) {
    STATE.world.chat.inputActive = true;
    STATE.world.chat.inputText = '';
    showSaveNotification('💬 CHAT ABERTO - Digite e Enter para enviar');
  }
  // NEW: Companion interaction
  if (e.key === 'C') {
    const c = STATE.world.companion;
    c.following = !c.following;
    showSaveNotification(c.following ? '🐾 COMPANHEIRO TE SEGUE!' : '🐾 COMPANHEIRO PARADO');
  }
  // NEW: Castle teleport
  if (e.key === 'H') { // Home
    const castle = STATE.world.castle;
    STATE.x = castle.x;
    STATE.y = castle.y;
    STATE.p2.x = castle.x + 50;
    STATE.p2.y = castle.y;
    showSaveNotification('🏰 TELEPORT PARA O CASTELO!');
  }
  // NEW: Toggle trail
  if (e.key === 'T') {
    trailEnabled = !trailEnabled;
    showSaveNotification(trailEnabled ? '✨ TRAIL ON' : '✨ TRAIL OFF');
  }
  // NEW: Beyblade controls
  if (e.key === 'B') {
    if (!STATE.beyblade.equipped) {
      autoAssembleBest();
    } else {
      const blade = STATE.beyblade.inventory.find(b => b.id === STATE.beyblade.equipped);
      showSaveNotification(`⚔️ ${blade.name} [${blade.tier}] equipado!`);
    }
  }
  if (e.key === 'N') { // New tournament
    startTournament();
  }
  if (e.key === 'G') { // Go next tournament match
    if (STATE.beyblade.tournament.active) {
      simulateTournamentMatch();
    }
  }
});

// Chat input handling
window.addEventListener('keydown', (e) => {
  if (STATE.world.chat.inputActive) {
    if (e.key === 'Enter' && STATE.world.chat.inputText.trim()) {
      const msg = STATE.world.chat.inputText.trim();
      STATE.world.chat.messages.push({
        type: 'player',
        text: `🧑 ${msg}`,
        time: Date.now(),
        color: '#00ff88'
      });
      STATE.world.chat.history.push(msg);
      if (STATE.world.chat.history.length > 20) STATE.world.chat.history.shift();
      
      // Auto-response from Lumin AI
      (async () => {
        const luminReply = await getLuminResponse(msg);
        STATE.world.chat.messages.push({
          type: 'lumin',
          text: `💫 ${luminReply}`,
          time: Date.now(),
          color: '#ffd700'
        });
      })();
      
      STATE.world.chat.inputActive = false;
      STATE.world.chat.inputText = '';
    } else if (e.key === 'Escape') {
      STATE.world.chat.inputActive = false;
      STATE.world.chat.inputText = '';
    } else if (e.key === 'Backspace') {
      STATE.world.chat.inputText = STATE.world.chat.inputText.slice(0, -1);
    } else if (e.key.length === 1) {
      STATE.world.chat.inputText += e.key;
    }
    e.preventDefault();
  }
});

// Load game on startup
const saved = loadGame();
if (saved) {
  score = saved.totalScore || 0;
  STATE.weaponLevel = saved.weaponLevel || 0;
  STATE.weaponXP = saved.weaponXP || 0;
  STATE.p2.weaponLevel = saved.p2?.weaponLevel || 0;
  STATE.p2.weaponXP = saved.p2?.weaponXP || 0;
  STATE.wave.maxWave = saved.maxWaveReached || 1;
}

render();

setInterval(() => {
  if (STATE.trail.length > 0) {
    const p = STATE.trail[Math.floor(Math.random() * STATE.trail.length)];
    ctx.fillStyle = p.color;
    ctx.globalAlpha = 0.3;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.random() * 3 + 1, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}, 100);
