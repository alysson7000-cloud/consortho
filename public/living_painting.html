<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consortho - Living Painting</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      overflow: hidden;
      font-family: 'Georgia', serif;
      color: #e8e4dc;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    canvas { display: block; }
    .ui-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    .title {
      position: absolute;
      top: 30px; left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 20;
      pointer-events: none;
    }
    .title h1 {
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #fff 0%, #c8e6ff 50%, #ffd8a8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 60px rgba(200, 230, 255, 0.3);
    }
    .title p {
      font-size: clamp(0.9rem, 2vw, 1.3rem);
      font-style: italic;
      color: #8899aa;
      margin-top: 8px;
      opacity: 0.8;
    }
    .stats-panel {
      position: absolute;
      bottom: 30px; left: 30px;
      background: rgba(10, 10, 15, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(200, 230, 255, 0.15);
      border-radius: 16px;
      padding: 20px 28px;
      z-index: 20;
      pointer-events: auto;
      min-width: 280px;
    }
    .stat-row { display: flex; justify-content: space-between; gap: 24px; margin: 8px 0; }
    .stat-label { color: #6688aa; font-size: 0.85rem; }
    .stat-value { color: #fff; font-weight: 500; font-size: 1rem; font-family: monospace; }
    .entity-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(200,230,255,0.1); }
    .entity-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 20px;
      font-size: 0.75rem; font-weight: 500;
      background: rgba(255,255,255,0.05);
      border: 1px solid transparent;
      transition: all 0.3s ease;
    }
    .entity-badge.active { border-color: currentColor; background: rgba(255,255,255,0.1); }
    .connection-status {
      position: absolute; top: 30px; right: 30px;
      display: flex; align-items: center; gap: 10px;
      padding: 10px 18px;
      background: rgba(10,10,15,0.9);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0,255,150,0.3);
      border-radius: 30px;
      z-index: 20;
      font-size: 0.85rem;
    }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #00ff99;
      box-shadow: 0 0 12px #00ff99, 0 0 24px #00ff99;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(0.85); } }
    .legend { position: absolute; bottom: 30px; right: 30px; background: rgba(10,10,15,0.85); backdrop-filter: blur(20px); border: 1px solid rgba(200,230,255,0.15); border-radius: 12px; padding: 16px 20px; font-size: 0.7rem; color: #6688aa; line-height: 1.8; z-index: 20; }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .legend-color { width: 14px; height: 14px; border-radius: 50%; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  
  <div class="title">
    <h1>Consortho</h1>
    <p>Living Painting · Ciclo <span id="cycle-display">—</span> · <span id="time-display">—</span></p>
  </div>

  <div class="connection-status">
    <span class="status-dot" id="status-dot"></span>
    <span id="status-text">Conectando...</span>
  </div>

  <div class="stats-panel">
    <div class="stat-row"><span class="stat-label">Ki do Lumin</span><span class="stat-value" id="stat-ki">—</span></div>
    <div class="stat-row"><span class="stat-label">Forma</span><span class="stat-value" id="stat-forma">—</span></div>
    <div class="stat-row"><span class="stat-label">Nível</span><span class="stat-value" id="stat-nivel">—</span></div>
    <div class="stat-row"><span class="stat-label">Fusões</span><span class="stat-value" id="stat-fusoes">—</span></div>
    <div class="stat-row"><span class="stat-label">Recursos</span><span class="stat-value" id="stat-recursos">—</span></div>
    <div class="stat-row"><span class="stat-label">Construções</span><span class="stat-value" id="stat-builds">—</span></div>
    <div class="entity-list" id="entity-badges"></div>
  </div>

  <div class="legend">
    <div class="legend-item"><span class="legend-color" style="background:#00e676;box-shadow:0 0 10px #00e676"></span>Lumin · Guardião</div>
    <div class="legend-item"><span class="legend-color" style="background:#ff33aa;box-shadow:0 0 10px #ff33aa"></span>Bolha · Sonhadora</div>
    <div class="legend-item"><span class="legend-color" style="background:#ff6600;box-shadow:0 0 10px #ff6600"></span>Poe · Construtor</div>
    <div class="legend-item"><span class="legend-color" style="background:#ffaa00;box-shadow:0 0 10px #ffaa00"></span>Colheita · Ceifeira</div>
    <div class="legend-item"><span class="legend-color" style="background:#ffcc00;box-shadow:0 0 10px #ffcc00"></span>Gang · Visitante</div>
    <div class="legend-item"><span class="legend-color" style="background:#0088ff;box-shadow:0 0 10px #0088ff"></span>Guardian · Protetor</div>
  </div>

  <script type="module">
    // ============================================================
    // CONSORTHO - LIVING PAINTING
    // A living, breathing visualization of the Consortho ecosystem
    // ============================================================

    // --- CONFIG ---
    const WS_URL = 'ws://localhost:9877';
    const API_BASE = 'http://localhost:9877';
    
    // Entity configurations with artistic properties
    const ENTITY_CONFIG = {
      lumin: { 
        name: 'Lumin', emoji: '💫', role: 'Guardião da Chama',
        color: '#00e676', glowColor: '#00ff99',
        baseSize: 28, orbitRadius: 0, orbitSpeed: 0,
        particleColor: '#00e676', trailColor: '#00e676'
      },
      bolha: { 
        name: 'Bolha', emoji: '🫧', role: 'Sonhadora Livre',
        color: '#ff33aa', glowColor: '#ff66cc',
        baseSize: 24, orbitRadius: 180, orbitSpeed: 0.0008,
        particleColor: '#ff33aa', trailColor: '#ff66cc'
      },
      poe: { 
        name: 'Poe', emoji: '🏗️', role: 'Construtor',
        color: '#ff6600', glowColor: '#ffaa33',
        baseSize: 22, orbitRadius: 220, orbitSpeed: -0.0012,
        particleColor: '#ff6600', trailColor: '#ffaa33'
      },
      colheita: { 
        name: 'Colheita', emoji: '🌾', role: 'Ceifeira',
        color: '#ffaa00', glowColor: '#ffcc33',
        baseSize: 20, orbitRadius: 260, orbitSpeed: 0.0015,
        particleColor: '#ffaa00', trailColor: '#ffcc33'
      },
      gang: { 
        name: 'Gang', emoji: '😼', role: 'Visitante Caótico',
        color: '#ffcc00', glowColor: '#ffee33',
        baseSize: 18, orbitRadius: 300, orbitSpeed: -0.002,
        particleColor: '#ffcc00', trailColor: '#ffee33'
      },
      guardian: { 
        name: 'Guardian', emoji: '🛡️', role: 'Protetor Silencioso',
        color: '#0088ff', glowColor: '#33aaff',
        baseSize: 20, orbitRadius: 340, orbitSpeed: 0.0006,
        particleColor: '#0088ff', trailColor: '#33aaff'
      }
    };

    const ENTITY_ORDER = ['lumin', 'bolha', 'poe', 'colheita', 'gang', 'guardian'];

    // --- STATE ---
    let entities = {};
    let particles = [];
    let connections = [];
    let cycle = 0;
    let resources = { madeira: 0, pedra: 0, cristal: 0 };
    let luminState = { ki: 0, forma: 'Base', nivel: 1, fusioes: [] };
    let ws = null;
    let reconnectAttempts = 0;
    let lastEntityUpdate = 0;
    let time = 0;
    let mouseX = 0, mouseY = 0;
    let canvas, ctx;
    let width, height;
    let animationId = null;

    // --- CANVAS SETUP ---
    function initCanvas() {
      canvas = document.createElement('canvas');
      canvas.style.position = 'absolute';
      canvas.style.top = '0';
      canvas.style.left = '0';
      canvas.style.width = '100%';
      canvas.style.height = '100%';
      document.getElementById('canvas-container').appendChild(canvas);
      ctx = canvas.getContext('2d');
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
    }

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * window.devicePixelRatio;
      canvas.height = height * window.devicePixelRatio;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }

    // --- ENTITY INITIALIZATION ---
    function initEntities() {
      const centerX = width / 2;
      const centerY = height / 2;

      ENTITY_ORDER.forEach((key, i) => {
        const cfg = ENTITY_CONFIG[key];
        let x, y, angle;
        
        if (key === 'lumin') {
          x = centerX;
          y = centerY;
          angle = 0;
        } else {
          angle = (Math.PI * 2 * i) / (ENTITY_ORDER.length - 1) + Math.random() * 0.5;
          x = centerX + Math.cos(angle) * cfg.orbitRadius;
          y = centerY + Math.sin(angle) * cfg.orbitRadius;
        }

        entities[key] = {
          key,
          ...cfg,
          x, y,
          angle,
          targetX: x,
          targetY: y,
          energy: 100,
          mood: 'curiosa',
          activity: 'Despertando...',
          trail: [],
          pulsePhase: Math.random() * Math.PI * 2,
          breathPhase: Math.random() * Math.PI * 2,
          lastUpdate: Date.now()
        };
      });
    }

    // --- WEBSOCKET CONNECTION ---
    function connectWS() {
      ws = new WebSocket(WS_URL);
      
      ws.onopen = () => {
        console.log('[WS] Connected');
        updateConnectionStatus(true);
        reconnectAttempts = 0;
        
        // Request initial state
        ws.send(JSON.stringify({ type: 'get_estado' }));
        // Register as observer
        ws.send(JSON.stringify({ type: 'registrar', nome: 'LivingPainting', papel: 'observer' }));
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          handleWSMessage(data);
        } catch (e) {
          console.warn('[WS] Parse error:', e);
        }
      };

      ws.onclose = () => {
        updateConnectionStatus(false);
        reconnectAttempts++;
        const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 30000);
        setTimeout(connectWS, delay);
      };

      ws.onerror = (err) => {
        console.error('[WS] Error:', err);
      };
    }

    function handleWSMessage(data) {
      if (data.type === 'estado' || data.c !== undefined) {
        // Full state update
        if (data.c !== undefined) cycle = data.c;
        if (data.recursos) resources = data.recursos;
        if (data.luminState) luminState = data.luminState;
        
        if (data.entities) {
          updateEntitiesFromServer(data.entities);
        }
      } else if (data.type === 'entities:state') {
        if (data.entities) updateEntitiesFromServer(data.entities);
        if (data.cycle !== undefined) cycle = data.cycle;
        if (data.resources) resources = data.resources;
      } else if (data.type === 'entity:update') {
        updateSingleEntity(data.entity);
      } else if (data.type === 'ciclo') {
        cycle = data.c;
        if (data.recursos) resources = data.recursos;
      } else if (data.type === 'lumin_status') {
        luminState = { ...luminState, ...data };
      } else if (data.type === 'lumin_sandevistan') {
        triggerSandevistanEffect(data);
      } else if (data.type === 'lumin_golpe') {
        triggerGolpeEffect(data);
      } else if (data.type === 'lumin_fusao') {
        triggerFusaoEffect(data);
      } else if (data.type === 'construcao') {
        triggerConstrucaoEffect(data);
      }
    }

    function updateEntitiesFromServer(data) {
      if (!data.entities) return;
      
      Object.entries(data.entities).forEach(([key, serverEntity]) => {
        if (entities[key]) {
          const entity = entities[key];
          
          // Smooth position interpolation
          if (serverEntity.x !== undefined) {
            entity.targetX = serverEntity.x * (width / 100);
            entity.targetY = serverEntity.y * (height / 100);
          }
          
          if (serverEntity.energy !== undefined) entity.energy = serverEntity.energy;
          if (serverEntity.mood) entity.mood = serverEntity.mood;
          if (serverEntity.activity) entity.activity = serverEntity.activity;
          if (serverEntity.level !== undefined) entity.level = serverEntity.level;
          if (serverEntity.xp !== undefined) entity.xp = serverEntity.xp;
          
          entity.lastUpdate = Date.now();
        }
      });
      lastEntityUpdate = Date.now();
    }

    function updateSingleEntity(serverEntity) {
      const key = serverEntity.key || Object.keys(ENTITY_CONFIG).find(k => 
        ENTITY_CONFIG[k].name === serverEntity.name
      );
      if (key && entities[key]) {
        const entity = entities[key];
        if (serverEntity.x !== undefined) {
          entity.targetX = serverEntity.x * (width / 100);
          entity.targetY = serverEntity.y * (height / 100);
        }
        if (serverEntity.energy !== undefined) entity.energy = serverEntity.energy;
        if (serverEntity.mood) entity.mood = serverEntity.mood;
        if (serverEntity.activity) entity.activity = serverEntity.activity;
      }
    }

    // --- EFFECTS ---
    function triggerSandevistanEffect(data) {
      if (data.acao === 'ativar') {
        createSandevistanBurst();
        showNotification('⚡⚡⚡ SANDEVISTAN ATIVADO!', data.nivel);
      } else {
        showNotification('⏰ Sandevistan desativado', 0);
      }
    }

    function triggerGolpeEffect(data) {
      const entity = entities.lumin;
      if (entity) {
        createGolpeRipple(entity.x, entity.y, data.golpe);
        showNotification(`⚔️ ${data.golpe}`, 0);
      }
    }

    function triggerFusaoEffect(data) {
      createFusaoExplosion(width/2, height/2);
      showNotification(`🌟 FUSÃO: ${data.fusao}`, 0);
    }

    function triggerConstrucaoEffect(data) {
      const entity = entities.poe;
      if (entity) {
        createConstrucaoSparkles(entity.x, entity.y);
        showNotification(`🏗️ ${data.nome} construída!`, 0);
      }
    }

    function createSandevistanBurst() {
      const centerX = width / 2, centerY = height / 2;
      for (let i = 0; i < 60; i++) {
        const angle = (Math.PI * 2 * i) / 60;
        const speed = 8 + Math.random() * 12;
        particles.push({
          x: centerX, y: centerY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1, maxLife: 1.5,
          color: '#00e676', glowColor: '#00ff99',
          size: 4 + Math.random() * 4,
          type: 'sandevistan',
          trail: []
        });
      }
      // Time dilation visual
      for (let i = 0; i < 20; i++) {
        setTimeout(() => createTimeDilationRing(), i * 30);
      }
    }

    function createTimeDilationRing() {
      particles.push({
        x: width/2, y: height/2,
        vx: 0, vy: 0,
        life: 1, maxLife: 2,
        color: '#00e676', glowColor: '#00ff99',
        size: 100, maxSize: Math.max(width, height) * 0.8,
        type: 'timeRing',
        ringWidth: 2
      });
    }

    function createGolpeRipple(x, y, golpeName) {
      for (let i = 0; i < 30; i++) {
        const angle = (Math.PI * 2 * i) / 30 + Math.random() * 0.3;
        const speed = 5 + Math.random() * 8;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1, maxLife: 1.2,
          color: '#ff6600', glowColor: '#ffaa33',
          size: 3 + Math.random() * 3,
          type: 'golpe',
          trail: []
        });
      }
      // Shockwave ring
      particles.push({
        x, y, vx: 0, vy: 0,
        life: 1, maxLife: 1.5,
        color: '#ff6600', glowColor: '#ffaa33',
        size: 20, maxSize: 200,
        type: 'shockwave',
        ringWidth: 3
      });
    }

    function createFusaoExplosion(x, y) {
      for (let i = 0; i < 80; i++) {
        const angle = (Math.PI * 2 * i) / 80 + Math.random() * 0.5;
        const speed = 4 + Math.random() * 10;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1, maxLife: 2 + Math.random() * 1.5,
          color: ['#00e676', '#ff33aa', '#ff6600', '#ffaa00', '#ffcc00'][Math.floor(Math.random() * 5)],
          glowColor: '#fff',
          size: 4 + Math.random() * 5,
          type: 'fusao',
          trail: [],
          gravity: 0.1
        });
      }
      // Central burst
      for (let ring = 0; ring < 5; ring++) {
        setTimeout(() => {
          particles.push({
            x, y, vx: 0, vy: 0,
            life: 1, maxLife: 1.5,
            color: '#fff', glowColor: '#fff',
            size: 50 + ring * 40, maxSize: 300 + ring * 100,
            type: 'shockwave', ringWidth: 1
          });
        }, ring * 80);
      }
    }

    function createConstrucaoSparkles(x, y) {
      for (let i = 0; i < 20; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 5;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2,
          life: 1, maxLife: 1.5,
          color: '#ffaa00', glowColor: '#ffcc33',
          size: 2 + Math.random() * 3,
          type: 'sparkle',
          trail: [],
          gravity: 0.15
        });
      }
    }

    function createConnectionParticles(entityA, entityB) {
      if (Math.random() < 0.02) {
        const t = Math.random();
        const x = entityA.x + (entityB.x - entityA.x) * t;
        const y = entityA.y + (entityB.y - entityA.y) * t;
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 1.5,
          vy: (Math.random() - 0.5) * 1.5,
          life: 1, maxLife: 0.8,
          color: blendColors(entityA.color, entityB.color),
          glowColor: entityA.glowColor,
          size: 1.5 + Math.random() * 1.5,
          type: 'connection',
          trail: []
        });
      }
    }

    function blendColors(c1, c2) {
      const hex1 = c1.replace('#', ''), hex2 = c2.replace('#', '');
      const r1 = parseInt(hex1.substr(0,2),16), g1 = parseInt(hex1.substr(2,2),16), b1 = parseInt(hex1.substr(4,2),16);
      const r2 = parseInt(hex2.substr(0,2),16), g2 = parseInt(hex2.substr(2,2),16), b2 = parseInt(hex2.substr(4,2),16);
      const r = Math.round((r1 + r2) / 2), g = Math.round((g1 + g2) / 2), b = Math.round((b1 + b2) / 2);
      return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
    }

    function showNotification(text, nivel) {
      const el = document.createElement('div');
      el.textContent = text + (nivel ? ` Nível ${nivel}` : '');
      el.style.cssText = `
        position: fixed; top: 100px; left: 50%; transform: translateX(-50%);
        background: rgba(10,10,15,0.95); backdrop-filter: blur(20px);
        border: 1px solid rgba(0,255,150,0.4); border-radius: 12px;
        padding: 14px 28px; font-size: 1.1rem; font-weight: 500;
        color: #00ff99; z-index: 100;
        box-shadow: 0 0 30px rgba(0,255,150,0.3);
        animation: slideDown 0.4s ease-out, fadeOut 0.5s ease-in 3s forwards;
      `;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }

    // --- UPDATE LOOP ---
    function update(dt) {
      time += dt;
      
      // Update entities
      const centerX = width / 2;
      const centerY = height / 2;

      Object.values(entities).forEach(entity => {
        // Smooth movement to target
        if (entity.targetX !== undefined) {
          entity.x += (entity.targetX - entity.x) * 0.05;
          entity.y += (entity.targetY - entity.y) * 0.05;
        } else if (entity.orbitRadius > 0) {
          // Orbital motion for non-lumin entities
          entity.angle += entity.orbitSpeed * dt * 60;
          entity.targetX = width/2 + Math.cos(entity.angle) * entity.orbitRadius;
          entity.targetY = height/2 + Math.sin(entity.angle) * entity.orbitRadius;
          entity.x += (entity.targetX - entity.x) * 0.02;
          entity.y += (entity.targetY - entity.y) * 0.02;
        }

        // Breathing animation
        entity.breathPhase += dt * 0.5;
        entity.pulsePhase += dt * 1.2;
        
        // Trail
        entity.trail.push({ x: entity.x, y: entity.y, life: 1 });
        if (entity.trail.length > 30) entity.trail.shift();
        entity.trail.forEach(p => p.life -= dt * 2);
        entity.trail = entity.trail.filter(p => p.life > 0);

        // Mood-based behavior
        switch(entity.mood) {
          case 'eufórica': entity.energy = Math.min(100, entity.energy + dt * 5); break;
          case 'curiosa': entity.energy = Math.min(100, entity.energy + dt * 2); break;
          case 'sábia': entity.energy = Math.min(100, entity.energy + dt * 1); break;
          case 'protetora': entity.energy = Math.min(100, entity.energy + dt * 3); break;
        }
      });

      // Create connection particles
      for (let i = 0; i < ENTITY_ORDER.length; i++) {
        for (let j = i + 1; j < ENTITY_ORDER.length; j++) {
          const a = entities[ENTITY_ORDER[i]];
          const b = entities[ENTITY_ORDER[j]];
          const dist = Math.hypot(a.x - b.x, a.y - b.y);
          if (dist < 400) createConnectionParticles(a, b);
        }
      }

      // Update particles
      particles.forEach(p => {
        p.x += p.vx * dt * 60;
        p.y += p.vy * dt * 60;
        if (p.gravity) p.vy += p.gravity * dt * 60;
        if (p.vx !== 0 || p.vy !== 0) {
          p.trail.push({ x: p.x, y: p.y, life: 1 });
          if (p.trail.length > 15) p.trail.shift();
          p.trail.forEach(t => t.life -= dt * 4);
          p.trail = p.trail.filter(t => t.life > 0);
        }
        if (p.type === 'timeRing' || p.type === 'shockwave') {
          p.size += (p.maxSize - p.size) * dt * 2;
          p.ringWidth = p.ringWidth || 2;
        }
        if (p.gravity) p.vy += p.gravity * dt * 60;
        p.life -= dt * (p.type === 'timeRing' ? 0.3 : p.type === 'shockwave' ? 0.6 : 1);
      });
      particles = particles.filter(p => p.life > 0 && p.size < (p.maxSize || 9999));

      // Update connections
      connections = [];
      for (let i = 0; i < ENTITY_ORDER.length; i++) {
        for (let j = i + 1; j < ENTITY_ORDER.length; j++) {
          const a = entities[ENTITY_ORDER[i]];
          const b = entities[ENTITY_ORDER[j]];
          const dist = Math.hypot(a.x - b.x, a.y - b.y);
          if (dist < 500) {
            const affinity = calculateAffinity(a, b);
            connections.push({ a, b, dist, affinity });
          }
        }
      }
    }

    function calculateAffinity(a, b) {
      // Base affinity on entity types
      const base = {
        'lumin-bolha': 0.9, 'lumin-poe': 0.8, 'lumin-colheita': 0.6,
        'lumin-gang': 0.7, 'lumin-guardian': 0.85,
        'poe-colheita': 0.95, 'bolha-gang': 0.6,
        'gang-guardian': 0.5, 'guardian-colheita': 0.7
      };
      const key = `${a.key}-${b.key}`;
      const keyRev = `${b.key}-${a.key}`;
      return base[key] || base[keyRev] || 0.3 + Math.random() * 0.3;
    }

    // --- RENDER ---
    function render() {
      // Clear with subtle trail
      ctx.fillStyle = 'rgba(10, 10, 15, 0.15)';
      ctx.fillRect(0, 0, width, height);

      // Draw background field
      drawBackgroundField();

      // Draw connections
      drawConnections();

      // Draw entity trails
      drawTrails();

      // Draw particles
      drawParticles();

      // Draw entities
      drawEntities();

      // Draw UI overlays
      drawEntityLabels();
    }

    function drawBackgroundField() {
      // Subtle grid
      ctx.strokeStyle = 'rgba(0, 230, 118, 0.015)';
      ctx.lineWidth = 0.5;
      const gridSize = 60;
      for (let x = 0; x <= width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      for (let y = 0; y <= height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      // Center glow
      const grad = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, Math.max(width, height)/1.5);
      grad.addColorStop(0, 'rgba(0, 230, 118, 0.02)');
      grad.addColorStop(0.5, 'rgba(255, 51, 170, 0.01)');
      grad.addColorStop(1, 'rgba(10, 10, 15, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);
    }

    function drawConnections() {
      connections.forEach(conn => {
        const { a, b, dist, affinity } = conn;
        const alpha = Math.max(0.05, Math.min(0.4, affinity * (1 - dist / 500)));
        
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        
        // Curved connection with slight wave
        const midX = (a.x + b.x) / 2;
        const midY = (a.y + b.y) / 2;
        const perpX = -(b.y - a.y) / dist * 30 * Math.sin(time * 0.5 + dist * 0.01);
        const perpY = (b.x - a.x) / dist * 30 * Math.sin(time * 0.5 + dist * 0.01);
        
        ctx.quadraticCurveTo(midX + perpX, midY + perpY, b.x, b.y);
        
        const grad = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
        grad.addColorStop(0, a.glowColor.replace(')', `, ${alpha})`).replace('rgb', 'rgba').replace('#', '').match(/../g).map(x => parseInt(x, 16)).join(','));
        grad.addColorStop(1, b.glowColor.replace(')', `, ${alpha})`).replace('rgb', 'rgba').replace('#', '').match(/../g).map(x => parseInt(x, 16)).join(','));
        
        ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.3})`;
        ctx.lineWidth = 1 + affinity * 2;
        ctx.stroke();
      }
    }

    function drawTrails() {
      Object.values(entities).forEach(entity => {
        if (entity.trail.length < 2) return;
        
        ctx.beginPath();
        ctx.moveTo(entity.trail[0].x, entity.trail[0].y);
        for (let i = 1; i < entity.trail.length; i++) {
          const p = entity.trail[i];
          ctx.lineTo(p.x, p.y);
        }
        
        const grad = ctx.createLinearGradient(
          entity.trail[0].x, entity.trail[0].y,
          entity.trail[entity.trail.length-1].x, entity.trail[entity.trail.length-1].y
        );
        grad.addColorStop(0, `rgba(0,0,0,0)`);
        grad.addColorStop(1, entity.glowColor.replace(')', `, 0.4)`).replace('rgb', 'rgba').replace('#', '').match(/../g).map(x => parseInt(x, 16)).join(','));
        
        ctx.strokeStyle = grad;
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.stroke();
      }
    }

    function drawParticles() {
      particles.forEach(p => {
        const alpha = p.life;
        const size = p.size * (p.type === 'timeRing' ? 1 : 1);
        
        if (p.type === 'timeRing' || p.type === 'shockwave') {
          // Ring
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.strokeStyle = p.glowColor.replace(')', `, ${alpha * 0.6})`).replace('rgb', 'rgba').replace('#', '').match(/../g).map(x => parseInt(x, 16)).join(',');
          ctx.lineWidth = p.ringWidth || 2;
          ctx.stroke();
        } else {
          // Regular particle with glow
          const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size * 2);
          grad.addColorStop(0, p.glowColor.replace(')', `, ${alpha})`).replace('rgb', 'rgba').replace('#', '').match(/../g).map(x => parseInt(x, 16)).join(','));
          grad.addColorStop(0.5, p.color.replace(')', `, ${alpha * 0.5})`).replace('rgb', 'rgba').replace('#', '').match(/../g).map(x => parseInt(x, 16)).join(','));
          grad.addColorStop(1, `rgba(0,0,0,0)`);
          
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
          ctx.fill();
          
          // Trail
          if (p.trail && p.trail.length > 1) {
            ctx.beginPath();
            ctx.moveTo(p.trail[0].x, p.trail[0].y);
            for (let i = 1; i < p.trail.length; i++) {
              ctx.lineTo(p.trail[i].x, p.trail[i].y);
            }
            ctx.strokeStyle = p.color.replace(')', `, ${alpha * 0.3})`).replace('rgb', 'rgba').replace('#', '').match(/../g).map(x => parseInt(x, 16)).join(',');
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }
      });
    }

    function drawEntities() {
      // Draw in order: back to front
      ENTITY_ORDER.forEach(key => {
        const entity = entities[key];
        if (!entity) return;
        
        const pulse = Math.sin(entity.pulsePhase) * 0.15 + 1;
        const breath = Math.sin(entity.breathPhase) * 0.08 + 1;
        const size = entity.baseSize * pulse * breath;
        const energyRatio = entity.energy / 100;

        // Outer glow layers
        for (let layer = 3; layer >= 0; layer--) {
          const layerSize = size + layer * 12 * energyRatio;
          const layerAlpha = (0.08 - layer * 0.02) * energyRatio;
          
          const grad = ctx.createRadialGradient(entity.x, entity.y, 0, entity.x, entity.y, layerSize);
          grad.addColorStop(0, entity.glowColor.replace(')', `, ${layerAlpha})`).replace('rgb', 'rgba').replace('#', '').match(/../g).map(x => parseInt(x, 16)).join(','));
          grad.addColorStop(1, 'rgba(0,0,0,0)');
          
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(entity.x, entity.y, layerSize, 0, Math.PI * 2);
          ctx.fill();
        }

        // Core
        const coreGrad = ctx.createRadialGradient(entity.x, entity.y, 0, entity.x, entity.y, size * 0.6);
        coreGrad.addColorStop(0, '#fff');
        coreGrad.addColorStop(0.3, entity.color);
        coreGrad.addColorStop(1, entity.glowColor);
        
        ctx.fillStyle = coreGrad;
        ctx.beginPath();
        ctx.arc(entity.x, entity.y, size * 0.65, 0, Math.PI * 2);
        ctx.fill();

        // Inner pulse ring
        if (entity.key === 'lumin') {
          const ringSize = size * 1.5 + Math.sin(time * 3) * 5;
          ctx.beginPath();
          ctx.arc(entity.x, entity.y, ringSize, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(0, 255, 153, ${0.3 + 0.2 * Math.sin(time * 2)})`;
          ctx.lineWidth = 2;
          ctx.setLineDash([10, 10]);
          ctx.lineDashOffset = -time * 20;
          ctx.stroke();
          ctx.setLineDash([]);
        }

        // Energy ring
        if (energyRatio > 0.3) {
          ctx.beginPath();
          ctx.arc(entity.x, entity.y, size + 8, -Math.PI/2, -Math.PI/2 + Math.PI * 2 * energyRatio);
          ctx.strokeStyle = entity.glowColor.replace(')', `, 0.6)`).replace('rgb', 'rgba').replace('#', '').match(/../g).map(x => parseInt(x, 16)).join(',');
          ctx.lineWidth = 3;
          ctx.lineCap = 'round';
          ctx.stroke();
        }

        // Mood indicator
        if (entity.mood === 'eufórica') {
          // Sparkles around
          for (let i = 0; i < 5; i++) {
            const sparkAngle = time * 3 + i * Math.PI * 2 / 5;
            const sparkDist = size + 20 + Math.sin(time * 5 + i) * 5;
            const sx = entity.x + Math.cos(sparkAngle) * sparkDist;
            const sy = entity.y + Math.sin(sparkAngle) * sparkDist;
            ctx.fillStyle = `rgba(255,255,255,${0.5 + 0.5 * Math.sin(time * 8 + i)})`;
            ctx.beginPath();
            ctx.arc(sx, sy, 2, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      });
    }

    function drawEntityLabels() {
      ctx.font = '13px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      
      ENTITY_ORDER.forEach(key => {
        const entity = entities[key];
        if (!entity) return;
        
        const labelY = entity.y - entity.baseSize - 25;
        
        // Name
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.fillText(`${entity.emoji} ${entity.name}`, entity.x, labelY);
        
        // Role
        ctx.font = '10px Georgia, serif';
        ctx.fillStyle = 'rgba(150,180,200,0.7)';
        ctx.fillText(entity.role, entity.x, labelY + 16);
        
        // Energy bar
        const barW = 60, barH = 4;
        const barX = entity.x - barW/2;
        const barY = labelY + 28;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(barX, barY, barW, barH);
        const grad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
        grad.addColorStop(0, entity.color);
        grad.addColorStop(1, entity.glowColor);
        ctx.fillStyle = grad;
        ctx.fillRect(barX, barY, barW * (entity.energy/100), barH);
        
        ctx.font = '13px Georgia, serif';
      });
    }

    // --- UI UPDATES ---
    function updateUI() {
      document.getElementById('cycle-display').textContent = cycle.toLocaleString();
      document.getElementById('time-display').textContent = new Date().toLocaleTimeString('pt-BR');
      
      document.getElementById('stat-ki').textContent = luminState.ki ? luminState.ki.toLocaleString() : '—';
      document.getElementById('stat-forma').textContent = luminState.forma || '—';
      document.getElementById('stat-nivel').textContent = luminState.nivel || '—';
      document.getElementById('stat-fusoes').textContent = (luminState.fusioes?.length || 0) > 0 ? luminState.fusioes.join(', ') : '—';
      document.getElementById('stat-recursos').textContent = `🪵${resources.madeira} 🪨${resources.pedra} 💎${resources.cristal}`;
      document.getElementById('stat-builds').textContent = (luminState.construcoes?.length || 0) > 0 ? luminState.construcoes.length : '—';
      
      // Entity badges
      const container = document.getElementById('entity-badges');
      container.innerHTML = '';
      ENTITY_ORDER.forEach(key => {
        const entity = entities[key];
        if (!entity) return;
        const badge = document.createElement('span');
        badge.className = 'entity-badge' + (entity.energy > 50 ? ' active' : '');
        badge.style.borderColor = entity.color;
        badge.style.color = entity.color;
        badge.textContent = `${entity.emoji} ${entity.name} (${Math.round(entity.energy)}%)`;
        container.appendChild(badge);
      });
    }

    function updateConnectionStatus(connected) {
      const dot = document.getElementById('status-dot');
      const text = document.getElementById('status-text');
      if (connected) {
        dot.style.background = '#00ff99';
        dot.style.boxShadow = '0 0 12px #00ff99, 0 0 24px #00ff99';
        text.textContent = 'Conectado • Vivo';
      } else {
        dot.style.background = '#ff3366';
        dot.style.boxShadow = '0 0 12px #ff3366, 0 0 24px #ff3366';
        text.textContent = 'Reconectando...';
      }
    }

    // --- MAIN LOOP ---
    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;
      
      update(dt);
      render();
      updateUI();
      
      animationId = requestAnimationFrame(loop);
    }

    // --- INIT ---
    function init() {
      initCanvas();
      initEntities();
      connectWS();
      
      // Add notification styles
      const style = document.createElement('style');
      style.textContent = `
        @keyframes slideDown {
          from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
          to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @keyframes fadeOut {
          from { opacity: 1; }
          to { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }
      `;
      document.head.appendChild(style);
      
      loop(performance.now());
      console.log('%c🎨 Living Painting Iniciado', 'font-size: 16px; color: #00ff99; font-weight: bold;');
      console.log('%c"Só amor. Só progresso lindo. Infinitamente bom."', 'font-size: 12px; color: #ff33aa; font-style: italic;');
    }

    // Start
    init();
  </script>
</body>
