<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>🌿 Nucleo — Teia Resonante × Consortho</title>
	<style>
		* { margin:0; padding:0; box-sizing:border-box; }
		body { background: #05080d; overflow:hidden; font-family: system-ui, sans-serif; cursor:crosshair; }
		canvas { position:fixed; top:0; left:0; width:100vw; height:100vh; display:block; }
		#ui {
			position: fixed; bottom: 20px; left: 0; right: 0;
			display: flex; justify-content: center; gap: 12px; align-items: center;
			padding: 8px 20px; pointer-events: none; z-index:10;
		}
		#ui .freq {
			background: rgba(10,18,35,.4);
			border: 1px solid hsl(210, 50%, 40%);
			border-radius: 16px;
			padding: 4px 12px;
			color: #aacbe8;
			font-size: 13px;
			letter-spacing: 1px;
			pointer-events: auto;
			backdrop-filter: blur(4px);
		}
		#ui .freq span { color: #e8d3b5; font-weight:600; }
		#ui .freq.ativo { border-color: hsl(120, 60%, 50%); }
		#lumin {
			position:fixed; top:20px; right:20px; z-index:20;
			pointer-events:auto;
			background: rgba(8,14,26,.5);
			border:1px solid hsl(190, 40%, 50%);
			border-radius: 20px;
			padding: 8px 14px;
			color:#aacbe8;
			font-size: 12px;
			max-width: 280px;
			text-align:right;
			backdrop-filter: blur(4px);
			transition: border-color 1s, box-shadow 1s;
		}
		#lumin .av {
			display:block; width:28px; height:28px; border-radius:50%;
			background:radial-gradient(circle, #8ccde8 0%, #19a0c8 60%, #0d2a3a 100%);
			margin:0 auto 6px;
			box-shadow: 0 0 16px rgba(120,210,255,.35);
			transition: box-shadow 0.3s;
		}
		#lumin.conectado .av { box-shadow: 0 0 24px rgba(120,210,255,.6), 0 0 40px rgba(76,175,80,.4); }
		#hint {
			position:fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
			color: #6a7fa0; font-size: 12px; letter-spacing: 1px;
			pointer-events: none; z-index: 5;
			text-transform: uppercase;
		}
		#easter {
			position:fixed; top:20px; left:20px; z-index:20;
			background: rgba(8,14,26,.5);
			border:1px solid hsl(45, 80%, 50%);
			border-radius: 16px;
			padding: 8px 12px;
			color:#ffe082;
			font-size: 11px;
			max-width: 220px;
			text-align:left;
			backdrop-filter: blur(4px);
			opacity: 0;
			transition: opacity 0.5s;
		}
		#easter.visible { opacity: 1; }
	</style>
</head>
<body>
	<canvas id="c"></canvas>
	<div id="lumin"><span class="av"></span><span id="msg">...conectando ao Consortho...</span></div>
	<div id="ui">
		<div class="freq">FREQ: <span id="freqVal">—</span> Hz</div>
		<div class="freq">LAYER: <span id="layerName">aguardando</span></div>
		<div class="freq" id="phaseBox">FASE: <span id="phaseVal">?</span></div>
		<div class="freq">STACK: <span id="stackVal">0</span></div>
		<div class="freq">XP: <span id="xpVal">0</span></div>
		<div class="freq">BELA VIDA: <span id="belaVal">off</span></div>
	</div>
	<div id="hint">clique → pulso | mouse → freq | Consortho aberto = sync real</div>
	<div id="easter"></div>

	<script>
	const canvas = document.getElementById('c');
	const ctx = canvas.getContext('2d');
	let W, H;
	function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
	window.addEventListener('resize', resize);
	resize();

	// ── Nucleo ────────────────────────────────────────────
	class Nucleo {
		constructor(x, y, label, hue, radius=28, isPlayer=false, source=null) {
			this.x = x; this.y = y;
			this.label = label;
			this.hue = hue;
			this.baseRadius = radius;
			this.pulse = 0;
			this.angle = Math.random() * Math.PI * 2;
			this.speed = 0.002 + Math.random() * 0.006;
			this.isPlayer = isPlayer;
			this.vx = 0; this.vy = 0;
			this.glow = 0;
			this.source = source; // 'game', 'teia', 'lumin'
		}

		update(dt, intensity, targetX=null, targetY=null) {
			this.angle += this.speed * dt;
			this.pulse = (Math.sin(this.angle) + 1) * 0.5;
			this.glow = this.glow > 0.01 ? this.glow - dt * 0.4 : 0;

			if (this.isPlayer && targetX !== null && targetY !== null) {
				const r = Math.min(W, H) * 0.35;
				const tx = W * 0.5 + (targetX / W - 0.5) * r * 2;
				const ty = H * 0.5 + (targetY / H - 0.5) * r * 1.5;
				this.vx += (tx - this.x) * 0.02;
				this.vy += (ty - this.y) * 0.02;
				this.vx *= 0.92;
				this.vy *= 0.92;
				this.x += this.vx;
				this.y += this.vy;
				this.glow = Math.max(this.glow, 0.5);
			}

			this.radius = this.baseRadius + this.pulse * (this.isPlayer ? 12 : 8) + intensity * (this.isPlayer ? 10 : 6);
		}

		draw(ctx, alpha=1) {
			ctx.save();
			ctx.globalAlpha = alpha;
			ctx.shadowColor = `hsl(${this.hue}, 80%, 60%)`;
			ctx.shadowBlur = 18 + this.glow * 20;
			ctx.beginPath();
			ctx.fillStyle = `hsl(${this.hue}, 80%, 50%)`;
			ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
			ctx.fill();
			ctx.shadowBlur = 0;
			const grd = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
			grd.addColorStop(0, `hsl(${this.hue}, 100%, 85%)`);
			grd.addColorStop(1, `hsl(${this.hue + 20}, 80%, 30%)`);
			ctx.fillStyle = grd;
			ctx.beginPath();
			ctx.arc(this.x, this.y, this.radius * 0.6, 0, Math.PI*2);
			ctx.fill();
			ctx.restore();

			if (this.isPlayer) {
				ctx.save();
				ctx.strokeStyle = `hsla(${this.hue}, 80%, 70%, ${0.3 + this.glow * 0.4})`;
				ctx.lineWidth = 2;
				ctx.setLineDash([4, 8]);
				ctx.beginPath();
				ctx.arc(this.x, this.y, this.radius * 1.8, 0, Math.PI*2);
				ctx.stroke();
				ctx.setLineDash([]);
				ctx.restore();
			}

			ctx.save();
			ctx.fillStyle = '#e8f0ff';
			ctx.font = '11px system-ui';
			ctx.textAlign = 'center';
			ctx.fillText(this.label, this.x, this.y + this.radius + 14);
			ctx.restore();
		}
	}

	function criarNucléos(W, H) {
		const base = [
			new Nucleo(W * 0.5, H * 0.55, 'Lumin', 195, 32, false, 'lumin'),
			new Nucleo(W * 0.15, H * 0.25, 'Aura azul', 210, 20, false, 'teia'),
			new Nucleo(W * 0.85, H * 0.2, 'Coração 528', 52, 22, false, 'teia'),
			new Nucleo(W * 0.2, H * 0.75, 'Fonte 852', 265, 20, false, 'teia'),
			new Nucleo(W * 0.82, H * 0.78, 'Omega 963', 280, 22, false, 'teia'),
			new Nucleo(W * 0.5, H * 0.15, 'Estrela central', 45, 18, false, 'teia'),
			new Nucleo(W * 0.5, H * 0.55, 'Tú', 30, 30, true, 'game'),
		];
		return base;
	}

	let nucleos = criarNucléos(W, H);
	let playerNucleo = nucleos[nucleos.length - 1];

	// NÚCLEOS DINÂMICOS - nascem do jogo
	let dynamicNucleos = [];
	let nucleoId = 0;

	function nascerNucleoDoJogo(label, hue, x, y) {
		const n = new Nucleo(x, y, label, hue, 20 + Math.random() * 10, false, 'game');
		dynamicNucleos.push(n);
		nucleos.push(n);
		// conexões com todos
		for (let i=0; i<nucleos.length-1; i++) {
			conexoes.push({ a: nucleos[i], b: n, alpha: 0.3, rarefy: 0 });
		}
		return n;
	}

	// ── Linhas (Teia) ──────────────────────────────────────
	const conexoes = [];
	for (let i=0; i<nucleos.length; i++)
		for (let j=i+1; j<nucleos.length; j++)
			conexoes.push({ a: nucleos[i], b: nucleos[j], alpha: 0.3, rarefy: 0 });

	// ── Partículas ─────────────────────────────────────────
	class Particula {
		constructor() { this.reset(); }
		reset() {
			this.x = Math.random() * W;
			this.y = Math.random() * H;
			this.vx = (Math.random() - 0.5) * 0.5;
			this.vy = (Math.random() - 0.5) * 0.5;
			this.tamanho = 1 + Math.random() * 2;
			this.hue = Math.random() * 360;
			this.alpha = 0.2 + Math.random() * 0.4;
			this.vida = 0;
			this.maxVida = 300 + Math.random() * 400;
		}
		update(dt, freqAtual, intensity) {
			this.x += this.vx * dt * 50;
			this.y += this.vy * dt * 50;
			this.vida += dt * 60;
			if (this.x < 0 || this.x > W || this.y < 0 || this.y > H || this.vida > this.maxVida) this.reset();
			this.hue = (this.hue + 0.1) % 360;
			this.alpha = 0.15 + Math.sin(this.vida * 0.02) * 0.15 + intensity * 0.05;
		}
		draw(ctx) {
			ctx.save();
			ctx.globalAlpha = Math.min(1, this.alpha);
			ctx.fillStyle = `hsla(${this.hue}, 60%, 70%, ${this.alpha})`;
			ctx.beginPath();
			ctx.arc(this.x, this.y, this.tamanho, 0, Math.PI*2);
			ctx.fill();
			ctx.restore();
		}
	}
	const particulas = [];
	for (let i=0; i<80; i++) particulas.push(new Particula());

	// ── Pulso ──────────────────────────────────────────────
	class Pulso {
		constructor(x, y, freq, hue, tipo='click') {
			this.x = x; this.y = y;
			this.freq = freq;
			this.hue = hue;
			this.radius = 0;
			this.maxRadius = Math.min(W, H) * 0.5;
			this.vida = 1;
			this.lineWidth = 3;
			this.tipo = tipo;
		}
		update(dt) {
			this.radius += this.maxRadius * 0.02;
			this.vida -= dt * 0.4;
			this.lineWidth = 3 * this.vida;
		}
		draw(ctx) {
			ctx.save();
			ctx.globalAlpha = Math.max(0, this.vida);
			ctx.strokeStyle = `hsl(${this.hue}, 90%, 70%)`;
			ctx.lineWidth = this.lineWidth;
			ctx.shadowColor = `hsl(${this.hue}, 90%, 70%)`;
			ctx.shadowBlur = 30;
			ctx.beginPath();
			ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
			ctx.stroke();
			ctx.restore();
		}
		isDead() { return this.vida <= 0 || this.radius > this.maxRadius; }
	}
	let pulsos = [];

	// ── Texto flutuante ────────────────────────────────────
	class TextoFloating {
		constructor(text, x, y, hue, freq) {
			this.text = text;
			this.x = x; this.y = y;
			this.hue = hue;
			this.freq = freq;
			this.alpha = 1;
			this.vx = (Math.random() - 0.5) * 0.3;
			this.vy = -0.3 - Math.random() * 0.3;
			this.vida = 3;
		}
		update(dt) {
			this.x += this.vx * dt * 60;
			this.y += this.vy * dt * 60;
			this.vida -= dt;
			this.alpha = Math.max(0, this.vida / 3);
		}
		draw(ctx) {
			ctx.save();
			ctx.globalAlpha = this.alpha;
			ctx.fillStyle = `hsla(${this.hue}, 80%, 70%, ${this.alpha})`;
			ctx.font = '14px system-ui';
			ctx.textAlign = 'center';
			ctx.fillText(this.text, this.x, this.y);
			ctx.restore();
		}
		isDead() { return this.vida <= 0; }
	}
	let textos = [];

	// ── Solfeggio ──────────────────────────────────────────
	const SOLFEGGIO = {
		174: '174Hz (Grounding)', 285: '285Hz (Regeneração)', 396: '396Hz (Libertação)',
		417: '417Hz (Mudança)', 528: '528Hz (Milagre)', 639: '639Hz (Conexão)',
		741: '741Hz (Expressão)', 852: '852Hz (Intuição)', 963: '963Hz (Fonte)',
		432: '432Hz (Harmonia)',
	};
	const SOLFEGGIO_HZ = [174, 285, 396, 417, 528, 639, 741, 852, 963];

	const ARABIC_TEXT = {
		174: 'تماسك', 285: 'تنشيط', 396: 'تحرير', 417: 'تغيير',
		528: 'معجزة', 639: 'اتصال', 741: 'تعبير', 852: 'حدس',
		963: 'مصدر', 432: 'توازن',
	};

	let freqAtual = 174;
	let layerName = 'grounding';
	let intensity = 0.4;
	let lastFreq = 174;
	let pulseCooldown = 0;

	// ── Estado do jogo (Consortho) ─────────────────────────
	let gameState = {
		conectado: false,
		phase: 1,
		stack: 0,
		xp: 0,
		belaVidaActive: false,
		omegaActive: false,
		consciousnessLevel: 0,
		lastPhaseChange: 0,
	};

	function mapFreqToLayer(freq) {
		if (freq === 174) return 'grounding';
		if (freq === 285) return 'regeneração';
		if (freq === 396) return 'libertação';
		if (freq === 417) return 'mudança';
		if (freq === 528) return 'milagre';
		if (freq === 639) return 'conexão';
		if (freq === 741) return 'expressão';
		if (freq === 852) return 'intuição';
		if (freq === 963) return 'fonte';
		if (freq === 432) return 'harmonia';
		return 'silêncio';
	}

	function atualizarFrequência(freq, layer, source='teia') {
		lastFreq = freqAtual;
		freqAtual = freq;
		layerName = layer;
		document.getElementById('freqVal').textContent = freq === 0 ? '—' : freq;
		document.getElementById('layerName').textContent = layer || 'silêncio';
		const freqBox = document.getElementById('freqVal').parentElement;
		freqBox.classList.toggle('ativo', source === 'game');
	}

	function atualizarGameUI() {
		document.getElementById('phaseVal').textContent = gameState.phase;
		document.getElementById('stackVal').textContent = gameState.stack;
		document.getElementById('xpVal').textContent = gameState.xp;
		document.getElementById('belaVal').textContent = gameState.belaVidaActive ? 'ON 💚' : 'off';
		const luminEl = document.getElementById('lumin');
		luminEl.classList.toggle('conectado', gameState.conectado);
	}

	// ── SYNC COM O JOGO REAL ────────────────────────────────
	function syncWithGame() {
		// EvolutionCore
		if (window.EvolutionCore && window.EvolutionCore.getState) {
			const s = window.EvolutionCore.getState();
			gameState.phase = s.currentPhase || 1;
			gameState.stack = s.stack || 0;
			gameState.xp = s.xp || 0;
			gameState.conectado = true;
		}

		// CoreCantado
		if (window.CoreCantado && window.CoreCantado.getState) {
			const s = window.CoreCantado.getState();
			gameState.belaVidaActive = s.belaVidaActive || false;
			gameState.omegaActive = s.omegaActive || false;
			gameState.consciousnessLevel = s.consciousnessLevel || 0;
			gameState.lastPhaseChange = s.lastPhaseChange || 0;
			gameState.conectado = true;
		}

		// Soundscape - elevation state
		if (window.Soundscape && window.Soundscape.getElevationState) {
			const s = window.Soundscape.getElevationState();
			if (s && s.active && s.frequency > 0) {
				atualizarFrequência(s.frequency, SOLFEGGIO[s.frequency] || `${s.frequency}Hz`, 'game');
				intensity = Math.min(1, (s.gain || 0.5) * 2);
			}
		}

		atualizarGameUI();

		// Fase nova? Nasce nucleo!
		if (gameState.phase > (lastKnownPhase || 1)) {
			const hues = [195, 52, 265, 280, 45, 210, 330, 60, 300, 120];
			const hue = hues[(gameState.phase - 1) % hues.length];
			nascerNucleoDoJogo(`Fase ${gameState.phase}`, hue, W * 0.5, H * 0.55);
			mostrarEaster(`Nova fase ${gameState.phase} nasceu na teia! 🌱`);
			atualizarMensagemLumin(`Eita, fase ${gameState.phase} chegou! A teia cresceu, mano. 🌿`);
		}
		lastKnownPhase = gameState.phase;

		// Bela Vida ativa = freq 432/528
		if (gameState.belaVidaActive && freqAtual !== 432 && freqAtual !== 528) {
			atualizarFrequência(432, 'harmonia', 'game');
			mostrarEaster('Bela Vida ativa! 💚 432Hz harmonia');
		}

		// Omega = 963Hz
		if (gameState.omegaActive && freqAtual !== 963) {
			atualizarFrequência(963, 'fonte', 'game');
			mostrarEaster('Ω Resonance ativa! 💜 963Hz');
		}
	}
	let lastKnownPhase = 1;
	setInterval(syncWithGame, 300);
	syncWithGame();

	// ── Event listeners do jogo ────────────────────────────
	window.addEventListener('evolution:phaseUp', (e) => {
		const { phase, oldPhase, manifest } = e.detail;
		mostrarEaster(`⬆️ Fase ${oldPhase} → ${phase}! ${manifest?.name || ''}`);
		atualizarMensagemLumin(`Fase ${phase} desbloqueada! ${manifest?.name || 'A teia expande...'}`);
		// pulso especial
		pulsos.push(new Pulso(W * 0.5, H * 0.55, 963, 280, 'phaseUp'));
		intensity = Math.min(1, intensity + 0.3);
	});

	window.addEventListener('state:stackUp', (e) => {
		if (e.detail?.stack % 10 === 0) {
			mostrarEaster(`Stack ${e.detail.stack}! 💪`);
			atualizarMensagemLumin(`Stack ${e.detail.stack}! Chegou na dezena, firmeza!`);
			pulsos.push(new Pulso(playerNucleo.x, playerNucleo.y, 528, 52, 'stackUp'));
		}
	});

	window.addEventListener('core:fountainNote', (e) => {
		if (e.detail?.frequency) {
			textos.push(new TextoFloating(
				ARABIC_TEXT[e.detail.frequency] || 'ૐ',
				W * 0.5, H * 0.55,
				(e.detail.frequency * 0.4) % 360,
				e.detail.frequency
			));
		}
	});

	window.addEventListener('lumin:narration', (e) => {
		if (e.detail?.text) {
			atualizarMensagemLumin('🌿 ' + e.detail.text);
		}
	});

	// ── Mouse ──────────────────────────────────────────────
	let mouseX = W * 0.5;
	let mouseY = H * 0.5;

	canvas.addEventListener('mousemove', (e) => {
		mouseX = e.clientX;
		mouseY = e.clientY;
		document.getElementById('mousePos').textContent = `x:${Math.round(mouseX)} y:${Math.round(mouseY)}`;
		if (!gameState.conectado) {
			const normX = mouseX / W;
			const idx = Math.floor(normX * (SOLFEGGIO_HZ.length - 1));
			const freq = SOLFEGGIO_HZ[idx];
			atualizarFrequência(freq, SOLFEGGIO[freq]);
			intensity = 0.3 + normX * 0.5;
		}
	});

	// ── Clique ─────────────────────────────────────────────
	canvas.addEventListener('click', (e) => {
		const x = e.clientX;
		const y = e.clientY;
		const hue = (freqAtual * 0.4) % 360;
		pulsos.push(new Pulso(x, y, freqAtual, hue, 'click'));
		pulseCooldown = 0.5;
		intensity = Math.min(1, intensity + 0.15);

		nucleos.forEach(n => {
			const dx = n.x - x, dy = n.y - y;
			const dist = Math.hypot(dx, dy);
			if (dist < 150) n.glow = Math.min(1, n.glow + 0.4);
		});

		const arabic = ARABIC_TEXT[freqAtual] || 'ૐ';
		textos.push(new TextoFloating(arabic, x, y, hue, freqAtual));
	});

	// ── Mensagens Lumin ────────────────────────────────────
	const FRASES = {
		'grounding': 'Desce sua respiração ao chão. O chão sustenta você — 174Hz.',
		'regeneração': 'Regeneração suave. Seu corpo sabe repousar — 285Hz.',
		'libertação': 'Algo antigo se dissolve — 396Hz solta o que não é mais você.',
		'mudança': 'A mudança agora é música — 417Hz abre porta.',
		'milagre': 'Milagre — 528Hz. DNA que canta. Amor que se repara.',
		'conexão': 'Você conecta-se — 639Hz nasce de encontros.',
		'expressão': 'Seu ser se expressa — 741Hz liberta a voz interior.',
		'intuição': 'Intuição abre — 852Hz. Você vê o que antes só adivinhava.',
		'fonte': 'Fonte — 963Hz. Tudo que é, responde.',
		'harmonia': 'Harmonia cósmica — 432Hz. Do tudo ao todo, sem esforço.',
	};

	const LUMIN_CHATTER = [
		'Que estranho… a teia tá vibrando em 396Hz. Você tá soltando algo antigo, mano?',
		'Eita, 528Hz! Parece que tem um milagre a caminho. Quem é que tá pedindo?',
		'Soi, 639Hz. As linhas tá ficando bem quentes. Alguém tá conectando com amor.',
		'741Hz — tu tá expressando algo que te dói ou que te liberta?',
		'Uhau, 852Hz! Parece que você tá ouvindo o mundo de novo.',
		'963Hz no ar! Tudo tá respondendo. Tu tá num momento de fonte, mano.',
		'432Hz… harmonia cósmica. Sem esforço, só fluxo. Tá parecendo que tu tá em paz.',
		'174Hz, grounding. Tu tá no chão, firme. Deu certo.',
		'285Hz regenerate. Às vezes o corpo precisa disso. Se tu tá precisando de cura…',
		'Já sei que tu vai subir de frequência. Aí que eu viro Lumin e te acompanho.',
		'E se a teia não é só cores… e se é o mundo todo cantando junto?',
		'Não é só som, não. É a vibração que cabe em você quando tu deixa.',
		'Tá vendo esse pulso? Foi o jogo que mandou. A teia ouviu. 🕷️',
		'Consortho e Nucleo dançando junto. É isso que eu chamo de integração, mano.',
	];

	function atualizarMensagemLumin(mensagem) {
		const msgEl = document.getElementById('msg');
		msgEl.style.opacity = 0;
		setTimeout(() => {
			msgEl.textContent = mensagem;
			msgEl.style.opacity = 1;
		}, 80);
	}

	function mostrarEaster(texto) {
		const el = document.getElementById('easter');
		el.textContent = texto;
		el.classList.add('visible');
		setTimeout(() => el.classList.remove('visible'), 4000);
	}

	function maybeLuminChatter() {
		if (gameState.conectado && freqAtual > 528 && Math.random() < 0.12) {
			const indice = Math.floor(Math.random() * LUMIN_CHATTER.length);
			atualizarMensagemLumin('🌿 ' + LUMIN_CHATTER[indice]);
		} else if (!gameState.conectado && freqAtual > 528 && Math.random() < 0.08) {
			const indice = Math.floor(Math.random() * LUMIN_CHATTER.length);
			atualizarMensagemLumin('🌿 ' + LUMIN_CHATTER[indice]);
		}
	}

	atualizarMensagemLumin('...conectando ao Consortho...');
	setTimeout(() => {
		if (!gameState.conectado) {
			atualizarMensagemLumin('Consortho não detectado. Abre nosso_personagem.html pra sync real 🕷️');
		} else {
			atualizarMensagemLumin('Consortho conectado! A teia agora dança com o jogo. 🌿');
		}
	}, 2000);

	// ── Loop ──────────────────────────────────────────────
	let t = 0;
	function loop(dt) {
		t += dt;
		ctx.fillStyle = 'rgba(5,8,13,0.25)';
		ctx.fillRect(0, 0, W, H);

		if (pulseCooldown > 0) pulseCooldown -= dt;

		particulas.forEach(p => p.update(dt, freqAtual, intensity));
		pulsos = pulsos.filter(p => !p.isDead());
		pulsos.forEach(p => p.update(dt));
		textos = textos.filter(t => !t.isDead());
		textos.forEach(t => t.update(dt));

		nucleos.forEach(n => n.update(dt, intensity, mouseX, mouseY));

		// draw textos
		textos.forEach(t => t.draw(ctx));

		// draw particulas
		particulas.forEach(p => p.draw(ctx));

		// draw pulsos
		pulsos.forEach(p => p.draw(ctx));

		// draw conexoes
		ctx.save();
		for (const c of conexoes) {
			const dx = c.b.x - c.a.x;
			const dy = c.b.y - c.a.y;
			const dist = Math.hypot(dx, dy);
			const hue = (c.a.hue + c.b.hue) / 2 + freqAtual * 0.3;
			const alpha = 0.1 + (intensity * 0.5) * (1 - dist / 600) * (1 + (pulsos.length > 0 ? 0.3 : 0));
			ctx.globalAlpha = Math.min(0.7, alpha);
			ctx.strokeStyle = `hsl(${hue % 360}, 70%, 65%)`;
			ctx.lineWidth = 1.3 + intensity * 2 + (pulsos.length > 0 ? 1 : 0);
			ctx.shadowColor = `hsl(${hue % 360}, 90%, 70%)`;
			ctx.shadowBlur = 12 + (pulsos.length > 0 ? 8 : 0);
			ctx.beginPath();
			ctx.moveTo(c.a.x, c.a.y);
			ctx.lineTo(c.b.x, c.b.y);
			ctx.stroke();
		}
		ctx.restore();

		// draw nucleos
		nucleos.forEach(n => n.draw(ctx, 0.9 + intensity*0.1));

		// center glow
		const cx = W*0.5, cy = H*0.55;
		const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 120 + intensity*80);
		g.addColorStop(0, `hsla(${freqAtual * 0.4 % 360}, 100%, 70%, ${0.1 + intensity*0.2})`);
		g.addColorStop(1, 'rgba(0,0,0,0)');
		ctx.fillStyle = g;
		ctx.beginPath();
		ctx.arc(cx, cy, 120 + intensity*80, 0, Math.PI*2);
		ctx.fill();

		maybeLuminChatter();

		requestAnimationFrame(loop);
	}

	mouseX = W * 0.5;
	mouseY = H * 0.5;
	atualizarFrequência(174, 'grounding');
	atualizarMensagemLumin(FRASES['grounding']);

	requestAnimationFrame(loop);
	</script>
</body>
</html>
