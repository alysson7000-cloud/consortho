<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consortho Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 0; border-bottom: 1px solid #1a1a2e;
      margin-bottom: 20px;
    }
    h1 { 
      font-size: 1.5rem; 
      background: linear-gradient(90deg, #ff6b35, #f7931e, #ffd700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .status-badge {
      padding: 6px 12px; border-radius: 4px; font-size: 0.75rem;
      font-weight: bold; text-transform: uppercase;
    }
    .status-online { background: #0f3460; color: #00ff88; border: 1px solid #00ff88; }
    .status-offline { background: #340f0f; color: #ff4444; border: 1px solid #ff4444; }
    .status-cron { background: #342a0f; color: #ffaa00; border: 1px solid #ffaa00; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
    .card {
      background: #11111a; border: 1px solid #1a1a2e;
      border-radius: 8px; padding: 20px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,107,53,0.15); }
    .card h2 { font-size: 0.85rem; color: #888; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 16px; }
    
    .resource-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1a1a2e; }
    .resource-row:last-child { border-bottom: none; }
    .resource-name { display: flex; align-items: center; gap: 8px; }
    .resource-emoji { font-size: 1.2rem; }
    .resource-value { font-weight: bold; color: #ffd700; font-size: 1.1rem; }
    
    .agent-list { display: flex; flex-direction: column; gap: 8px; }
    .agent-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 12px; background: #0a0a0f; border-radius: 6px;
      border: 1px solid #1a1a2e;
    }
    .agent-info { display: flex; align-items: center; gap: 10px; }
    .agent-name { font-weight: 500; }
    .agent-meta { font-size: 0.7rem; color: #666; }
    
    .cycle-display {
      text-align: center; padding: 20px;
      background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
      border-radius: 8px; margin-bottom: 20px;
    }
    .cycle-number { font-size: 3rem; font-weight: bold; color: #00ff88; line-height: 1; }
    .cycle-label { font-size: 0.75rem; color: #888; text-transform: uppercase; margin-top: 4px; }
    
    .last-message {
      background: #0a0a0f; border-left: 3px solid #ff6b35;
      padding: 12px; border-radius: 0 8px 8px 0; margin-top: 12px;
      font-style: italic; color: #aaa;
    }
    
    .refresh-indicator {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.7rem; color: #666;
    }
    .pulse { width: 8px; height: 8px; background: #00ff88; border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    
    .ki-bar { height: 6px; background: #1a1a2e; border-radius: 3px; overflow: hidden; margin-top: 8px; }
    .ki-fill { height: 100%; background: linear-gradient(90deg, #ff6b35, #f7931e, #ffd700); border-radius: 3px; transition: width 0.5s; }
    
    footer { text-align: center; padding: 20px; color: #444; font-size: 0.75rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Consortho Dashboard</h1>
      <div class="refresh-indicator">
        <span id="lastUpdate">Carregando...</span>
        <div class="pulse"></div>
      </div>
    </header>
    
    <div class="cycle-display">
      <div class="cycle-number" id="cycleNumber">—</div>
      <div class="cycle-label">Ciclo Atual</div>
    </div>
    
    <div class="grid">
      <div class="card">
        <h2>Recursos</h2>
        <div class="resource-row">
          <div class="resource-name"><span class="resource-emoji">🪵</span> Madeira</div>
          <div class="resource-value" id="madeira">—</div>
        </div>
        <div class="resource-row">
          <div class="resource-name"><span class="resource-emoji">🪨</span> Pedra</div>
          <div class="resource-value" id="pedra">—</div>
        </div>
        <div class="resource-row">
          <div class="resource-name"><span class="resource-emoji">💎</span> Cristal</div>
          <div class="resource-value" id="cristal">—</div>
        </div>
      </div>
      
      <div class="card">
        <h2>Estatísticas</h2>
        <div class="resource-row">
          <div class="resource-name">Elementos</div>
          <div class="resource-value" id="elementos">—</div>
        </div>
        <div class="resource-row">
          <div class="resource-name">Construções</div>
          <div class="resource-value" id="construcoes">—</div>
        </div>
        <div class="resource-row">
          <div class="resource-name">Players Online</div>
          <div class="resource-value" id="players">—</div>
        </div>
      </div>
      
      <div class="card">
        <h2>Lumin</h2>
        <div class="resource-row">
          <div class="resource-name">Ki</div>
          <div class="resource-value" id="luminKi">—</div>
        </div>
        <div class="ki-bar"><div class="ki-fill" id="kiFill" style="width: 0%"></div></div>
        <div class="resource-row" style="margin-top: 8px; padding-top: 8px; border-top: 1px solid #1a1a2e;">
          <div class="resource-name">Forma</div>
          <div class="resource-value" id="luminForma">—</div>
        </div>
        <div class="resource-row">
          <div class="resource-name">Nível</div>
          <div class="resource-value" id="luminNivel">—</div>
        </div>
      </div>
    </div>
    
    <div class="card" style="margin-top: 16px;">
      <h2>Agents</h2>
      <div class="agent-list" id="agentList">Carregando...</div>
    </div>
    
    <div class="card" style="margin-top: 16px;">
      <h2>Última da Gang</h2>
      <div class="last-message" id="lastGangMsg">Carregando...</div>
    </div>
    
    <footer>
      Consortho • Sistema Autônomo Multi-Agent • <span id="uptime">—</span>
    </footer>
  </div>

  <script>
    const API = 'http://localhost:9877/api/resumo';
    const LUMIN_API = 'http://localhost:9877/api/lumin';
    let startTime = Date.now();
    
    async function fetchData() {
      try {
        const [resumo, lumin] = await Promise.all([
          fetch(API).then(r => r.json()).catch(() => null),
          fetch(LUMIN_API).then(r => r.json()).catch(() => null)
        ]);
        updateUI(resumo, lumin);
      } catch (e) {
        console.error('Erro ao buscar dados:', e);
      }
    }
    
    function updateUI(resumo, lumin) {
      if (!resumo) return;
      
      document.getElementById('cycleNumber').textContent = resumo.ciclos?.toLocaleString() || '—';
      document.getElementById('madeira').textContent = resumo.recursos?.madeira?.toLocaleString() || '—';
      document.getElementById('pedra').textContent = resumo.recursos?.pedra?.toLocaleString() || '—';
      document.getElementById('cristal').textContent = resumo.recursos?.cristal?.toLocaleString() || '—';
      document.getElementById('elementos').textContent = resumo.elementos?.toLocaleString() || '—';
      document.getElementById('construcoes').textContent = resumo.construcoes?.toLocaleString() || '—';
      document.getElementById('players').textContent = resumo.playersOnline || '—';
      document.getElementById('lastUpdate').textContent = `Atualizado: ${new Date().toLocaleTimeString('pt-BR')}`;
      
      if (resumo.ultimaMensagemGang) {
        document.getElementById('lastGangMsg').innerHTML = 
          `"${resumo.ultimaMensagemGang.texto}" <span style="color:#666;font-size:0.75rem;">(${resumo.ultimaMensagemGang.hora})</span>`;
      }
      
      if (lumin) {
        document.getElementById('luminKi').textContent = lumin.ki?.toLocaleString() || '—';
        document.getElementById('luminForma').textContent = lumin.forma || '—';
        document.getElementById('luminNivel').textContent = lumin.nivel || '—';
        const kiPercent = Math.min(100, (lumin.ki || 0) / 100000 * 100);
        document.getElementById('kiFill').style.width = `${kiPercent}%`;
      }
      
      // Agents status
      const agents = [
        { name: 'consortho', type: 'core', status: 'online' },
        { name: 'lumin-agent', type: 'core', status: 'online' },
        { name: 'guardian', type: 'core', status: 'online' },
        { name: 'consente', type: 'core', status: 'online' },
        { name: 'notificador', type: 'core', status: 'online' },
        { name: 'radio-estudio', type: 'cron', status: 'cron' },
        { name: 'telegram-bot', type: 'cron', status: 'cron' },
        { name: 'jardim-monitor', type: 'cron', status: 'cron' },
        { name: 'poe-construtor', type: 'cron', status: 'cron' },
        { name: 'colheita', type: 'cron', status: 'cron' },
        { name: 'gang-visitas', type: 'cron', status: 'cron' },
      ];
      
      document.getElementById('agentList').innerHTML = agents.map(a => `
        <div class="agent-item">
          <div class="agent-info">
            <span class="status-badge status-${a.status}">${a.status}</span>
            <span class="agent-name">${a.name}</span>
            <span class="agent-meta">${a.type === 'core' ? 'Contínuo' : 'Cron'}</span>
          </div>
        </div>
      `).join('');
      
      // Uptime
      const uptime = Date.now() - startTime;
      const h = Math.floor(uptime / 3600000);
      const m = Math.floor((uptime % 3600000) / 60000);
      const s = Math.floor((uptime % 60000) / 1000);
      document.getElementById('uptime').textContent = `Uptime dashboard: ${h}h ${m}m ${s}s`;
    }
    
    fetchData();
    setInterval(fetchData, 5000);
  </script>
</body>
</html>
