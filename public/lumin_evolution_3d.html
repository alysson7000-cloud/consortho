<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💎 LUMIN EVOLUTION 3D 💎</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: #050510; color: #e8e8f0; overflow: hidden; }
    #canvas3d { width: 100%; height: 100vh; display: block; }
    .ui-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 10; }
    .ui-panel { pointer-events: auto; background: rgba(10,10,25,0.95); border: 1px solid rgba(0,255,136,0.3); border-radius: 16px; backdrop-filter: blur(20px); padding: 20px; color: #e8e8f0; }
    .top-bar { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; z-index: 100; }
    .stat-card { background: rgba(10,10,25,0.95); border: 1px solid rgba(0,255,136,0.3); border-radius: 12px; padding: 12px 20px; display: flex; align-items: center; gap: 10px; min-width: 160px; backdrop-filter: blur(10px); }
    .stat-icon { font-size: 1.3rem; }
    .stat-info { display: flex; flex-direction: column; }
    .stat-label { font-size: 0.7rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    .stat-value { font-weight: 700; font-size: 1.1rem; color: #fff; }
    .stat-value.ki { color: #ffcc00; }
    .stat-value.form { color: #ff33aa; }
    .stat-value.level { color: #00ccff; }
    .side-panel { position: fixed; right: 20px; top: 100px; bottom: 20px; width: 320px; background: rgba(10,10,25,0.95); border: 1px solid rgba(0,255,136,0.3); border-radius: 16px; backdrop-filter: blur(20px); padding: 20px; overflow-y: auto; z-index: 50; display: flex; flex-direction: column; gap: 20px; }
    .panel-title { display: flex; align-items: center; gap: 10px; font-size: 1.1rem; font-weight: 700; color: #00ff88; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid rgba(0,255,136,0.2); }
    .control-group { margin-bottom: 20px; }
    .control-label { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: block; }
    .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, rgba(0,255,136,0.2), rgba(0,204,255,0.2)); border: 1px solid rgba(0,255,136,0.5); border-radius: 12px; color: #00ff88; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: all 0.3s; text-transform: uppercase; letter-spacing: 1px; }
    .btn:hover { background: linear-gradient(135deg, rgba(0,255,136,0.4), rgba(0,204,255,0.4)); transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,255,136,0.3); }
    .btn:active { transform: translateY(0); }
    .btn.sandevistan { background: linear-gradient(135deg, rgba(255,51,170,0.2), rgba(255,204,0,0.2)); border-color: rgba(255,51,170,0.5); color: #ff33aa; }
    .btn.fusion { background: linear-gradient(135deg, rgba(255,204,0,0.2), rgba(0,204,255,0.2)); border-color: rgba(255,204,0,0.5); color: #ffcc00; }
    .btn.sync { background: linear-gradient(135deg, rgba(0,204,255,0.2), rgba(0,255,136,0.2)); border-color: rgba(0,204,255,0.5); color: #00ccff; }
    .stat-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .stat-label { color: #888; font-size: 0.9rem; }
    .stat-value { font-weight: 700; font-size: 1.1rem; }
    .stat-value.ki { color: #ffcc00; }
    .stat-value.form { color: #ff33aa; }
    .stat-value.level { color: #00ccff; }
    .progress-bar { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; margin-top: 8px; }
    .progress-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
    .progress-fill.ki { background: linear-gradient(90deg, #ffcc00, #ff6600); }
    .log-panel { background: rgba(0,0,0,0.5); border-radius: 12px; padding: 15px; max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 0.75rem; line-height: 1.6; }
    .log-entry { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; gap: 8px; }
    .log-time { color: #666; min-width: 55px; }
    .log-type.system { color: #00ccff; }
    .log-type.evolution { color: #ff33aa; }
    .log-type.sandevistan { color: #ffcc00; }
    .log-type.fusion { color: #ffcc00; }
    .log-text { color: #ccc; flex: 1; }
    .control-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 1000px) { .side-panel { display: none; } }
  </style>
</head>
<body>
  <canvas id="canvas3d"></canvas>
  <div class="ui-overlay">
    <div class="top-bar">
      <div class="stat-card"><span class="stat-icon">💎</span><div class="stat-info"><span class="stat-label">Ciclo</div><div class="stat-value" id="cycleDisplay">14696</div></div></div>
      <div class="stat-card"><span class="stat-icon">💫</span><div class="stat-info"><div class="stat-label">Ki</div><div class="stat-value ki" id="kiDisplay">95,000</div></div></div>
      <div class="stat-card"><span class="stat-icon">💫</span><div class="stat-info"><div class="stat-label">Forma</div><div class="stat-value form" id="formDisplay">Essência Pura</div></div></div>
      <div class="stat-card"><span class="stat-icon">⚡</span><div class="stat-info"><div class="stat-label">Sandevistan</div><div class="stat-value" id="sandevistanDisplay">Nv.3 Pronto</div></div></div>
    </div>
    <div class="side-panel">
      <div class="panel-title"><span>💫</span>Estado do Lumin</div>
      <div class="stat-row"><span class="stat-label">Ki Atual</span><span class="stat-value ki" id="kiDisplay2">95,000</div></div>
      <div class="stat-row"><span class="stat-label">Forma Atual</span><span class="stat-value form" id="formDisplay2">Essência Pura</div></div>
      <div class="stat-row"><span class="stat-label">Nível</span><span class="stat-value level" id="levelDisplay2">1</div></div>
      <div class="stat-row"><span class="stat-label">XP</span><span class="stat-value" id="xpDisplay">0 / 10,000</div></div>
      <div style="height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-top: 8px;"><div class="progress-fill ki" id="xpProgress" style="width: 0%"></div></div>
      <div class="control-group">
        <div class="control-label">Forma Secreta</div>
        <select class="form-select" id="secretFormSelect" style="width:100%;padding:12px;background:rgba(0,0,0,0.5);border:1px solid rgba(0,255,136,0.3);border-radius:10px;color:#fff;font-size:0.95rem;">
          <option value="">Nenhuma desbloqueada</option>
          <option value="Amante Eterno" style="color:#ff33aa;">🔒 Amante Eterno</option>
          <option value="Avatar do Caos" style="color:#ff6b35;">🔒 Avatar do Caos</option>
          <option value="Tecelão do Tempo" style="color:#00ccff;">🔒 Tecelão do Tempo</option>
          <option value="Mito Encarnado" style="color:#ffcc00;">🔒 Mito Encarnado</option>
          <option value="ÔMEGA PRIME" style="color:#fff;">🔒 ÔMEGA PRIME</option>
        </select>
      </div>
      <div class="control-btns">
        <button class="btn" onclick="triggerEvolution()">⚡ Evoluir</button>
        <button class="btn sandevistan" onclick="triggerSandevistan()">⚡⚡⚡ Sandevistan</button>
      </div>
      <div class="control-group">
        <button class="btn fusion" onclick="triggerFusion()">🌟 Fusão Trindade</button>
        <button class="btn fusion" onclick="triggerFusionOmega()">🌟⚡ Fusão Ômega</button>
      </div>
      <div class="control-group">
        <button class="btn sync" onclick="syncWithServer()">🔄 Sincronizar Servidor</button>
      </div>
      <div style="margin-top: 20px;">
        <div class="control-label">Sandevistan Nv. <span id="sandevistanLevel">3</span></div>
        <div style="display:flex;gap:5px;margin-top:5px;">
          <button class="btn sandevistan" style="flex:1" onclick="activateSandevistan(1)">Nv.1</button>
          <button class="btn sandevistan" style="flex:1" onclick="activateSandevistan(2)">Nv.2</button>
          <button class="btn sandevistan" style="flex:1" onclick="activateSandevistan(3)" disabled>Nv.3 ✓</button>
        </div>
        <div style="margin-top:5px;display:flex;gap:5px;">
          <button class="btn sandevistan" style="flex:1" disabled>Nv.4</button>
          <button class="btn sandevistan" style="flex:1" disabled>Nv.5</button>
        </div>
        <div style="margin-top:5px;display:flex;gap:5px;">
          <button class="btn sandevistan" style="flex:1" disabled>Nv.6</button>
          <button class="btn sandevistan" style="flex:1" disabled>Nv.7</button>
        </div>
      </div>
      <div class="control-group">
        <button class="btn fusion" style="width:100%" onclick="triggerFusion()">🌟 Fusão Trindade</button>
        <button class="btn fusion" style="width:100%;margin-top:10px" onclick="triggerFusionOmega()">🌟⚡ Fusão Ômega</button>
      </div>
      <div class="stat-row"><span class="stat-label">Fusões</span><span class="stat-value" id="fusionCount">0</div></div>
      <div class="control-group">
        <div class="control-label">Logs do Sistema</div>
        <div class="log-panel" id="logContainer"></div>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';

    // ===== DATA =====
    const forms = [
      { id: 0, name: 'Essência Pura', tier: 0, color: '#00ff88', desc: 'Forma base do Lumin', unlocked: true, secret: false },
      { id: 1, name: 'Guardião da Chama', tier: 1, color: '#ff6b35', desc: 'Protege a chama da criação', unlocked: true, secret: false },
      { id: 2, name: 'Arquiteto', tier: 1, color: '#ff6b35', desc: 'Construtor de realidades', unlocked: true, secret: false },
      { id: 3, name: 'Sábio', tier: 2, color: '#00ccff', desc: 'Sabedoria ancestral', unlocked: false, secret: false },
      { id: 4, name: 'Guerreiro', tier: 2, color: '#ff6b35', desc: 'Força indomável', unlocked: false, secret: false },
      { id: 5, name: 'Artista', tier: 2, color: '#ff33aa', desc: 'Criador de beleza', unlocked: false, secret: false },
      { id: 6, name: 'Curador', tier: 2, color: '#00ff88', desc: 'Restaura o que foi perdido', unlocked: false, secret: false },
      { id: 7, name: 'Explorador', tier: 3, color: '#00ccff', desc: 'Viajante de mundos', unlocked: false, secret: false },
      { id: 8, name: 'Mestre', tier: 3, color: '#ffcc00', desc: 'Mestre de todas as artes', unlocked: false, secret: false },
      { id: 8, name: 'LUMIN OMEGA', tier: 4, color: '#ffcc00', desc: 'Forma suprema', unlocked: false, secret: false },
      // Secret forms
      { id: 9, name: 'Amante Eterno', tier: 5, color: '#ff33aa', desc: 'Amor infinito', secret: true, unlocked: false },
      { id: 10, name: 'Avatar do Caos', tier: 5, color: '#ff6b35', desc: 'Caos criativo', secret: true, unlocked: false },
      { id: 11, name: 'Tecelão do Tempo', tier: 5, color: '#00ccff', desc: 'Mestre do tempo', secret: true, unlocked: false },
      { id: 12, name: 'Mito Encarnado', tier: 5, color: '#ffcc00', desc: 'Mito vivo', secret: true, unlocked: false },
      { id: 13, name: 'ÔMEGA PRIME', tier: 6, color: '#fff', desc: 'Além de tudo', secret: true, unlocked: false }
    ];

    const connections = [
      [0,1],[0,2],[1,3],[1,4],[2,4],[2,5],[3,6],[4,7],[5,6],[5,7],[6,8],[7,8],[8,13],[0,9],[0,10],[8,9],[8,10],[8,11],[8,12],[13,12]
    ];

    // ===== STATE =====
    let state = {
      ki: 95000,
      form: 0,
      level: 1,
      exp: 0,
      sandevistanLevel: 3,
      sandevistanActive: false,
      fusionCount: 0,
      unlockedForms: [0,1,2],
      sandevistanLevel: 3,
      fusions: []
    };

    // ===== THREE.JS SETUP =====
    const canvas = document.createElement('canvas');
    canvas.id = 'three-canvas';
    canvas.style.position = 'fixed';
    canvas.style.top = '0';
    canvas.style.left = '0';
    canvas.style.width = '100%';
    canvas.style.height = '100%';
    canvas.style.zIndex = '0';
    document.body.insertBefore(canvas, document.body.firstChild);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050510);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 120);

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enablePan = true;
    controls.minDistance = 30;
    controls.maxDistance = 300;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.2;

    // Post-processing
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.8, 0.4, 0.6);
    bloomPass.threshold = 0.3;
    bloomPass.strength = 1.2;
    bloomPass.radius = 0.8;
    composer.addPass(bloomPass);
    const fxaaPass = new ShaderPass(FXAAShader);
    fxaaPass.material.uniforms['resolution'].value.set(1/window.innerWidth, 1/window.innerHeight);
    composer.addPass(fxaaPass);

    // ===== SHADERS =====
    const particleVertexShader = `
      attribute float size;
      attribute vec3 customColor;
      varying vec3 vColor;
      varying float vSize;
      void main() {
        vColor = customColor;
        vSize = size;
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = size * (300.0 / -mvPosition.z);
        gl_Position = projectionMatrix * mvPosition;
      }
    `;

    const particleFragmentShader = `
      uniform float uTime;
      varying vec3 vColor;
      varying float vSize;
      void main() {
        float dist = length(gl_PointCoord - vec2(0.5));
        float alpha = 1.0 - smoothstep(0.0, 0.5, dist);
        float pulse = sin(vSize * 10.0 + uTime * 3.0) * 0.3 + 0.7;
        gl_FragColor = vec4(vColor, alpha * pulse);
      }
    `;

    // ===== CREATE FORM NODES =====
    const formObjects = [];
    const formMeshes = [];
    const formLabels = [];
    const connectionLines = [];
    const particleSystems = [];

    // Tier positions in 3D space
    const tierPositions = {
      0: { x: 0, y: 0, z: 0, radius: 0 },
      1: { y: 25, radius: 30 },
      2: { y: 50, radius: 50 },
      3: { y: 75, radius: 60 },
      4: { y: 95, radius: 40 },
      5: { y: 50, radius: 80 },
      6: { y: 115, radius: 20 }
    };

    function getFormPosition(form) {
      const tier = form.tier;
      const pos = tierPositions[tier];
      if (tier === 0) return new THREE.Vector3(0, 0, 0);
      if (tier === 1) {
        const angle = form.id === 1 ? -Math.PI/4 : Math.PI/4;
        return new THREE.Vector3(Math.cos(angle) * pos.radius, pos.y, Math.sin(angle) * pos.radius);
      }
      if (tier === 2) {
        const angles = {3: -Math.PI/2, 4: -Math.PI/6, 5: Math.PI/6, 6: Math.PI/2};
        const angle = angles[form.id] || 0;
        return new THREE.Vector3(Math.cos(angle) * pos.radius, pos.y, Math.sin(angle) * pos.radius);
      }
      if (tier === 3) {
        const angle = form.id === 7 ? -Math.PI/4 : Math.PI/4;
        return new THREE.Vector3(Math.cos(angle) * pos.radius, pos.y, Math.sin(angle) * pos.radius);
      }
      if (tier === 4) return new THREE.Vector3(0, pos.y, 0);
      if (tier === 5) {
        const angles = {9: -Math.PI/3, 10: Math.PI/3, 11: 0, 12: Math.PI};
        const angle = angles[form.id] || 0;
        return new THREE.Vector3(Math.cos(angle) * pos.radius, pos.y, Math.sin(angle) * pos.radius);
      }
      if (tier === 6) return new THREE.Vector3(0, pos.y, 0);
      return new THREE.Vector3(0, 0, 0);
    }

    // Create node geometry
    const nodeGeometry = new THREE.SphereGeometry(1, 32, 32);
    const ringGeometry = new THREE.RingGeometry(1.2, 1.5, 32);
    const glowGeometry = new THREE.SphereGeometry(1, 16, 16);

    forms.forEach((form, idx) => {
      const position = getFormPosition(form);
      const unlocked = form.unlocked || form.id <= 2;
      const isCurrent = form.id === 0;
      const isSecret = form.secret && !form.unlocked;

      // Main node
      const material = new THREE.MeshPhysicalMaterial({
        color: new THREE.Color(form.color),
        metalness: 0.3,
        roughness: 0.2,
        transparent: true,
        opacity: form.secret && !form.unlocked ? 0.3 : 1.0,
        emissive: new THREE.Color(form.color),
        emissiveIntensity: isCurrent ? 1.0 : (unlocked ? 0.3 : 0.1),
        clearcoat: 1.0,
        clearcoatRoughness: 0.1
      });

      const mesh = new THREE.Mesh(nodeGeometry.clone(), material);
      mesh.scale.setScalar(isCurrent ? 3.5 : (form.secret ? 1.5 : 2.5));
      mesh.position.copy(position);
      mesh.userData = { formId: form.id, form };
      scene.add(mesh);
      formMeshes.push(mesh);

      // Glow sphere
      const glowMaterial = new THREE.MeshBasicMaterial({
        color: new THREE.Color(form.color),
        transparent: true,
        opacity: isCurrent ? 0.4 : 0.15,
        side: THREE.BackSide
      });
      const glowMesh = new THREE.Mesh(glowGeometry.clone(), glowMaterial);
      glowMesh.scale.setScalar(isCurrent ? 5 : (form.secret ? 2 : 3));
      glowMesh.position.copy(position);
      scene.add(glowMesh);

      // Ring for current form
      let ringMesh = null;
      if (isCurrent) {
        const ringMaterial = new THREE.MeshBasicMaterial({
          color: new THREE.Color(form.color),
          transparent: true,
          opacity: 0.3,
          side: THREE.DoubleSide
        });
        ringMesh = new THREE.Mesh(ringGeometry.clone(), ringMaterial);
        ringMesh.scale.setScalar(4);
        ringMesh.position.copy(position);
        ringMesh.rotation.x = -Math.PI / 2;
        scene.add(ringMesh);
      }

      // Connection lines
      connections.forEach(([a, b]) => {
        if (a === form.id || b === form.id) {
          const otherForm = forms[a === form.id ? b : a];
          if (otherForm.unlocked || otherForm.id <= 2) {
            const otherPos = getFormPosition(otherForm);
            const points = [];
            const midY = (position.y + otherPos.y) / 2 + 10;
            points.push(new THREE.Vector3(position.x, position.y, position.z));
            points.push(new THREE.Vector3((position.x + otherPos.x)/2, midY, (position.z + otherPos.z)/2));
            points.push(new THREE.Vector3(otherPos.x, otherPos.y, otherPos.z));
            const curve = new THREE.CatmullRomCurve3(points);
            const lineGeometry = new THREE.TubeGeometry(curve, 20, 0.15, 8, false);
            const lineMaterial = new THREE.MeshBasicMaterial({
              color: new THREE.Color(form.color),
              transparent: true,
              opacity: 0.3
            });
            const lineMesh = new THREE.Mesh(lineGeometry, lineMaterial);
            scene.add(lineMesh);
            connectionLines.push(lineMesh);
          }
        });
      });

      // Particle system for each node
      const particleCount = isCurrent ? 200 : 50;
      const particles = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);
      const colors = new Float32Array(particleCount * 3);
      const sizes = new Float32Array(particleCount);

      const color = new THREE.Color(form.color);
      for (let i = 0; i < particleCount; i++) {
        const radius = isCurrent ? 5 : 3;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const r = radius * Math.cbrt(Math.random());
        positions[i*3] = position.x + r * Math.sin(phi) * Math.cos(theta);
        positions[i*3+1] = position.y + r * Math.sin(phi) * Math.sin(theta);
        positions[i*3+2] = position.z + r * Math.cos(phi);
        colors[i*3] = color.r;
        colors[i*3+1] = color.g;
        colors[i*3+2] = color.b;
        sizes[i] = Math.random() * 2 + 0.5;
      }

      particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      particles.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      particles.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

      const particleMaterial = new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 }, uPosition: { value: position } },
        vertexShader: particleVertexShader,
        fragmentShader: particleFragmentShader,
        transparent: true,
        vertexColors: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const particleSystem = new THREE.Points(particles, particleMaterial);
      particleSystem.userData = { basePosition: position.clone(), formId: form.id };
      scene.add(particleSystem);
      particleSystems.push(particleSystem);

      // Store references
      formObjects.push({
        form,
        mesh,
        glowMesh,
        ringMesh,
        particles: particleSystem,
        position,
        unlocked: form.unlocked,
        isSecret: form.secret
      });
    });

    // Particle system for background
    const bgParticles = new THREE.BufferGeometry();
    const bgCount = 2000;
    const bgPositions = new Float32Array(bgCount * 3);
    const bgColors = new Float32Array(bgCount * 3);
    const bgSizes = new Float32Array(bgCount);

    for (let i = 0; i < bgCount; i++) {
      const r = 50 + Math.random() * 100;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      bgPositions[i*3] = r * Math.sin(phi) * Math.cos(theta);
      bgPositions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
      bgPositions[i*3+2] = r * Math.cos(phi);
      const colorChoice = Math.random();
      if (colorChoice < 0.4) { bgColors[i*3]=0; bgColors[i*3+1]=1; bgColors[i*3+2]=0.53; }
