<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conselho Alysson — Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f;
      --bg-elevated: #12121a;
      --fg: #e8e8ed;
      --muted: #6b6b7a;
      --accent: #ff6b35;
      --accent-dim: #cc552a;
      --lumin: #00d4aa;
      --gang: #ff3366;
      --poe: #ffaa00;
      --alysson: #ffffff;
      --card: #1a1a24;
      --border: #2a2a3a;
      --input-bg: #0f0f15;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f5fa;
        --bg-elevated: #ffffff;
        --fg: #1a1a24;
        --muted: #6b6b7a;
        --card: #ffffff;
        --border: #e0e0e8;
        --input-bg: #fafafa;
      }
    }
    body {
      font-family: 'JetBrains Mono', 'Fira Code', 'Monospace';
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s;
    }
    .status-dot.connected { background: var(--lumin); box-shadow: 0 0 8px var(--lumin); }
    .status-dot.connecting { background: var(--poe); animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }
    .message {
      display: flex;
      gap: 12px;
      max-width: 85%;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message.own { align-self: flex-end; flex-direction: row-reverse; }
    .message.own .bubble { border-radius: 18px 18px 4px 18px; }
    .message:not(.own) .bubble { border-radius: 18px 18px 18px 4px; }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .message.own .avatar { background: var(--alysson); color: var(--bg); }
    .avatar.lumin { background: var(--lumin); color: #001a12; }
    .avatar.gang { background: var(--gang); color: #fff; }
    .avatar.poe { background: var(--poe); color: #1a1000; }
    .avatar.system { background: var(--muted); color: var(--fg); font-size: 12px; }
    .bubble {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 12px 16px;
      position: relative;
      line-height: 1.5;
      font-size: 14px;
    }
    .message.own .bubble {
      background: linear-gradient(135deg, var(--accent), var(--accent-dim));
      color: #fff;
      border: none;
    }
    .sender-name {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      opacity: 0.8;
    }
    .message.own .sender-name { color: rgba(255,255,255,0.7); }
    .sender-name.lumin { color: var(--lumin); }
    .sender-name.gang { color: var(--gang); }
    .sender-name.poe { color: var(--poe); }
    .sender-name.alysson { color: var(--accent); }
    .sender-name.system { color: var(--muted); }
    .message-text { white-space: pre-wrap; word-wrap: break-word; }
    .timestamp {
      font-size: 10px;
      opacity: 0.5;
      margin-top: 6px;
      text-align: right;
    }
    .message.own .timestamp { color: rgba(255,255,255,0.6); }
    footer {
      background: var(--bg-elevated);
      border-top: 1px solid var(--border);
      padding: 16px 24px;
    }
    .input-wrapper {
      display: flex;
      gap: 12px;
      max-width: 900px;
      margin: 0 auto;
    }
    #input {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 14px 20px;
      color: var(--fg);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255,107,53,0.15);
    }
    #input::placeholder { color: var(--muted); opacity: 0.6; }
    #send {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s;
    }
    #send:hover { background: var(--accent-dim); }
    #send:active { transform: scale(0.95); }
    #send svg { width: 20px; height: 20px; }
    .motto {
      text-align: center;
      margin-top: 12px;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.5px;
    }
    .motto strong { color: var(--accent); }
    @media (max-width: 600px) {
      .message { max-width: 95%; }
      header { padding: 12px 16px; }
      #messages { padding: 16px; gap: 12px; }
      footer { padding: 12px 16px; }
      .input-wrapper { gap: 8px; }
      #send { width: 44px; height: 44px; }
    }
    .system-notice {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 8px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">CONSELHO</div>
    <div class="subtitle">Alysson · Lumin · Gang · Poe</div>
    <div class="status">
      <span id="statusText">Conectando...</span>
      <div id="statusDot" class="status-dot connecting"></div>
    </div>
  </header>
  <main>
    <div id="messages"></div>
  </main>
  <footer>
    <div class="input-wrapper">
      <input type="text" id="input" placeholder="Fala com o Conselho..." autocomplete="off" spellcheck="false">
      <button id="send" aria-label="Enviar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    <div class="motto"><strong>só o amor</strong> · <strong>feliz claro</strong> · <strong>protege o motivo</strong> · <strong>tamo junto</strong></div>
  </footer>
  <script src="/socket.io/socket.io.js"></script>
  <script src="chat.js"></script>
</body>
</html>
