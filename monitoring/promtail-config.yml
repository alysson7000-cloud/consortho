server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: consortho-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: consortho
          environment: production
          host: consortho
        path: /var/log/consortho/*.log

    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            module: module
            cycle: cycle
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          module:
          cycle:
      - output:
          source: message