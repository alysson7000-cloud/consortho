# .github/workflows/deploy.yml
name: Deploy to Oracle VPS

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  deploy:
    name: Deploy to Oracle VPS
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      
      - name: Add Oracle VPS to known hosts
        run: |
          ssh-keyscan -H 144.33.18.6 >> ~/.ssh/known_hosts
      
      - name: Deploy to Oracle VPS
        run: |
          ssh ubuntu@144.33.18.6 << 'EOF'
            cd /opt/consortho
            git pull origin main
            docker compose build --no-cache consortho
            docker compose up -d consortho
            # Wait for health check
            sleep 10
            curl -f http://localhost:9877/api/eternal-resonance/status || exit 1
            echo "✅ Deploy successful!"
          EOF
      
      - name: Notify Telegram (optional)
        if: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.CONSORTHO_TELEGRAM_CHAT_ID }}" \
            -d text="🚀 Consortho deployed successfully to Oracle VPS! Organismo vivo atualizado." \
            -d parse_mode="HTML"