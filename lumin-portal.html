<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<title>LUMIN PORTAL — Núcleo do Jogo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  overflow: hidden;
  font-family: 'Orbitron', sans-serif;
  color: rgba(255,255,255,0.9);
  user-select: none;
  -webkit-user-select: none;
}
#bg-canvas { display: block; position: fixed; top: 0; left: 0; }
#content {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 10; pointer-events: none;
}
h1 {
  font-size: clamp(28px, 6vw, 64px); font-weight: 900;
  color: #0ff; text-shadow: 0 0 30px rgba(0,255,255,0.6), 0 0 60px rgba(0,255,255,0.3);
  letter-spacing: 4px; margin-bottom: 10px;
}
.subtitle {
  font-size: clamp(12px, 2vw, 18px); color: rgba(255,255,255,0.5);
  letter-spacing: 3px; margin-bottom: 40px; text-align: center;
}
.games {
  display: flex; flex-wrap: wrap; gap: 20px; justify-content: center;
  pointer-events: auto;
}
.game-card {
  background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);
  border: 1px solid rgba(0,255,255,0.2);
  border-radius: 16px; padding: 24px 32px;
  text-decoration: none; color: #fff;
  min-width: 180px; text-align: center;
  transition: all 0.3s; cursor: pointer;
  box-shadow: 0 0 20px rgba(0,255,255,0.1);
}
.game-card:hover {
  border-color: #0ff;
  box-shadow: 0 0 40px rgba(0,255,255,0.3);
  transform: translateY(-4px) scale(1.03);
}
.game-card h2 {
  font-size: clamp(14px, 2vw, 20px); font-weight: 700;
  margin-bottom: 8px; letter-spacing: 2px;
}
.game-card .desc {
  font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 1px;
  line-height: 1.5;
}
.game-card .icon {
  font-size: 40px; margin-bottom: 10px;
}
.footer {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  font-size: 11px; color: rgba(255,255,255,0.2); letter-spacing: 2px;
}
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div id="content">
  <h1>✦ LUMIN PORTAL ✦</h1>
  <p class="subtitle">SELECIONE UMA EXPERIÊNCIA</p>
  <div class="games">
    <a href="/lumin-aaa-game.html" class="game-card">
      <div class="icon">⚡</div>
      <h2>LUMIN AAA</h2>
      <p class="desc">Ação espacial · Power-ups · Combos<br>WASD + Mouse</p>
    </a>
    <a href="/lumin-cloud-game.html" class="game-card">
      <div class="icon">☁️</div>
      <h2>LUMIN CLOUD</h2>
      <p class="desc">Colete · Evite · Power-ups<br>WASD + Clique</p>
    </a>
    <a href="/lumin-galaxy-infinite.html" class="game-card">
      <div class="icon">🌌</div>
      <h2>GALÁXIA INFINITA</h2>
      <p class="desc">Exploração cósmica · Sistemas estelares<br>WASD + Scroll</p>
    </a>
  </div>
</div>
<div class="footer">LUMIN CLOUD v0.9.1</div>
<script>
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let W, H, DPR;
function resize() {
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize); resize();

const stars = [];
for (let i = 0; i < 400; i++) {
  stars.push({
    x: Math.random() * W, y: Math.random() * H,
    r: Math.random() * 1.5 + 0.3,
    a: Math.random() * 0.8 + 0.2,
    twinkle: Math.random() * Math.PI * 2,
    speed: Math.random() * 0.2 + 0.05
  });
}

let t = 0;
function render() {
  t += 0.01;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  // Nebula glow
  const ng = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.6);
  ng.addColorStop(0, 'rgba(0,255,255,0.03)');
  ng.addColorStop(0.5, 'rgba(100,0,255,0.02)');
  ng.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = ng;
  ctx.fillRect(0, 0, W, H);

  stars.forEach(s => {
    s.twinkle += 0.02;
    const alpha = s.a * (0.6 + 0.4 * Math.sin(s.twinkle));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fill();
  });

  // Connection lines between nearby stars
  ctx.strokeStyle = 'rgba(0,255,255,0.04)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i < stars.length; i += 3) {
    for (let j = i + 1; j < stars.length && j < i + 8; j++) {
      const dx = stars[i].x - stars[j].x;
      const dy = stars[i].y - stars[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 120) {
        ctx.beginPath();
        ctx.moveTo(stars[i].x, stars[i].y);
        ctx.lineTo(stars[j].x, stars[j].y);
        ctx.stroke();
      }
    }
  }

  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
