<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUMIN CLOUD — Portal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000; overflow: hidden;
    font-family: 'Orbitron', sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  #bg-canvas { display: block; position: fixed; top: 0; left: 0; }
  #portal {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 10; text-align: center; pointer-events: none;
  }
  #portal h1 {
    font-size: 52px; font-weight: 900; color: #0ff;
    text-shadow: 0 0 30px rgba(0,255,255,0.6), 0 0 60px rgba(0,255,255,0.3);
    letter-spacing: 4px; margin-bottom: 10px;
  }
  #portal .sub {
    font-size: 14px; color: rgba(255,255,255,0.4); letter-spacing: 3px;
    margin-bottom: 40px;
  }
  #portal .games {
    display: flex; gap: 20px; justify-content: center; pointer-events: auto;
    flex-wrap: wrap;
  }
  .game-card {
    background: rgba(0,255,255,0.05); border: 1px solid rgba(0,255,255,0.2);
    border-radius: 12px; padding: 24px 32px; min-width: 180px;
    transition: all 0.3s; cursor: pointer;
    backdrop-filter: blur(8px); text-decoration: none;
    color: inherit;
  }
  .game-card:hover {
    background: rgba(0,255,255,0.12); border-color: rgba(0,255,255,0.5);
    transform: translateY(-4px); box-shadow: 0 0 30px rgba(0,255,255,0.2);
  }
  .game-card .icon { font-size: 36px; margin-bottom: 10px; }
  .game-card .name { font-size: 16px; font-weight: 700; color: #fff; letter-spacing: 2px; }
  .game-card .desc { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 6px; letter-spacing: 1px; }
  #cloud-nav {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.25); font-size: 11px; letter-spacing: 1px;
    background: rgba(0,0,0,0.5); padding: 6px 14px; border-radius: 16px;
    backdrop-filter: blur(8px); pointer-events: auto; z-index: 30;
    text-decoration: none; border: 1px solid rgba(0,255,255,0.1);
    transition: all 0.2s;
  }
  #cloud-nav:hover { color: #0ff; border-color: rgba(0,255,255,0.3); }
  #scanlines {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 50;
    background: repeating-linear-gradient(
      0deg, rgba(0,0,0,0.03) 0px, rgba(0,0,0,0.03) 1px,
      transparent 1px, transparent 3px
    );
  }
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div id="portal">
  <h1>⚡ LUMIN CLOUD</h1>
  <div class="sub">ESCOLHA SUA EXPERIÊNCIA</div>
  <div class="games">
    <a href="/lumin-aaa-game.html" class="game-card">
      <div class="icon">⚔️</div>
      <div class="name">LUMIN AAA</div>
      <div class="desc">Ação · Tiros · Combos</div>
    </a>
    <a href="/lumin-cloud-game.html" class="game-card">
      <div class="icon">☁️</div>
      <div class="name">LUMIN CLOUD</div>
      <div class="desc">Colete · Evite · Power-ups</div>
    </a>
    <a href="/lumin-galaxy-infinite.html" class="game-card">
      <div class="icon">🌌</div>
      <div class="name">GALÁXIA INFINITA</div>
      <div class="desc">Exploração · Harmonize · Descubra</div>
    </a>
  </div>
</div>
<div id="scanlines"></div>
<a href="/lumin-cloud-game.html" id="cloud-nav">▲ LUMIN CLOUD</a>
<script>
'use strict';
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d', { alpha: false });
let W, H, DPR;
function resize() {
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize); resize();
const stars = [];
for (let i = 0; i < 200; i++) {
  stars.push({
    x: Math.random() * W, y: Math.random() * H,
    r: Math.random() * 1.5 + 0.2, a: Math.random() * 0.8 + 0.2,
    speed: Math.random() * 0.3 + 0.1, twinkle: Math.random() * Math.PI * 2
  });
}
const blobs = [];
for (let i = 0; i < 3; i++) {
  blobs.push({
    x: Math.random() * W, y: Math.random() * H,
    r: 100 + Math.random() * 200, hue: Math.random() * 360,
    phase: Math.random() * Math.PI * 2
  });
}
function render() {
  const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.7);
  grad.addColorStop(0, '#0a0020'); grad.addColorStop(0.5, '#050010'); grad.addColorStop(1, '#000005');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  blobs.forEach(b => {
    const grd = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
    grd.addColorStop(0, `hsla(${b.hue}, 60%, 30%, ${0.06 + 0.03 * Math.sin(performance.now() * 0.0005 + b.phase)})`);
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
  });
  stars.forEach(s => {
    s.twinkle += 0.02;
    const alpha = s.a * (0.6 + 0.4 * Math.sin(s.twinkle));
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`; ctx.fill();
  });
  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
