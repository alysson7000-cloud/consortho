<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONSORTHO — Consciousness Evolution Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a0f; 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            color: #e8e8f0;
            overflow: hidden;
            height: 100vh;
        }
        #unity-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        #unity-canvas { 
            width: 100%; 
            height: 100%; 
            display: block;
        }
        .loading-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a0a2e 50%, #0f0a1f 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s, visibility 0.5s;
        }
        .loading-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .loading-logo {
            width: 120px;
            height: 120px;
            animation: pulse 2s ease-in-out infinite, rotate 20s linear infinite;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .loading-title {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffd700, #ff6b35, #ff006e, #8338ec, #3a86ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-top: 1rem;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }
        .loading-subtitle {
            font-size: 1.1rem;
            color: #a8a8c0;
            margin-top: 0.5rem;
        }
        .loading-bar-container {
            width: 300px;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            margin-top: 2rem;
            overflow: hidden;
            position: relative;
        }
        .loading-bar {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ff6b35, #ff006e, #8338ec, #3a86ff);
            background-size: 200% 100%;
            animation: gradientShift 2s ease infinite, loadingProgress 3s ease-in-out forwards;
            border-radius: 3px;
            transform-origin: left;
            transform: scaleX(0);
        }
        @keyframes gradientShift { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
        @keyframes loadingProgress { to { transform: scaleX(1); } }
        .loading-percent {
            margin-top: 1rem;
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffd700;
        }
        .loading-details {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #6a6a8a;
            text-align: center;
            max-width: 400px;
            line-height: 1.6;
        }
        .feature-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            margin-top: 1.5rem;
            max-width: 500px;
        }
        .feature-tag {
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #ffd700;
        }
        .unity-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            pointer-events: none;
            z-index: 50;
        }
        .hud-panel {
            pointer-events: auto;
            background: rgba(10, 10, 15, 0.9);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            backdrop-filter: blur(10px);
        }
        .hud-top-left { position: absolute; top: 0; left: 0; }
        .hud-top-right { position: absolute; top: 0; right: 0; }
        .hud-bottom-left { position: absolute; bottom: 0; left: 0; }
        .hud-bottom-right { position: absolute; bottom: 0; right: 0; }
        .hud-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
        .consciousness-meter {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .meter-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: #888; }
        .meter-bar {
            width: 150px;
            height: 8px;
            background: rgba(0,0,0,0.5);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        .meter-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff006e, #ff6b35, #ffd700);
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        .meter-value { font-weight: 700; color: #ffd700; min-width: 45px; }
        .entity-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff006e, #8338ec, #3a86ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            border: 2px solid rgba(255,215,0,0.5);
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.5);
        }
        .layer-indicator {
            background: linear-gradient(135deg, rgba(255,0,110,0.3), rgba(131,56,236,0.3));
            border: 1px solid rgba(255,215,0,0.4);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            color: #ffd700;
        }
        .crafting-slots {
            display: flex;
            gap: 0.5rem;
        }
        .craft-slot {
            width: 50px;
            height: 50px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,215,0,0.2);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .craft-slot:hover { border-color: #ffd700; transform: scale(1.05); }
        .craft-slot-icon { font-size: 1.5rem; }
        .craft-slot-count { font-size: 0.7rem; color: #ffd700; }
        .multiplayer-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .player-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem;
            background: rgba(255,215,0,0.05);
            border-radius: 8px;
            border: 1px solid rgba(255,215,0,0.1);
        }
        .player-avatar { width: 32px; height: 32px; border-radius: 50%; font-size: 1rem; display: flex; align-items: center; justify-content: center; }
        .player-name { font-weight: 500; }
        .player-resonance { font-size: 0.75rem; color: #ff6b35; }
        .btn {
            background: linear-gradient(135deg, #ff006e, #8338ec);
            border: none;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,0,110,0.4); }
        .btn:active { transform: translateY(0); }
        .btn-gold { background: linear-gradient(135deg, #ffd700, #ff6b35); color: #0a0a0f; }
        .notification {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(10,10,15,0.95);
            border: 1px solid rgba(255,215,0,0.4);
            border-radius: 12px;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 200;
        }
        .notification.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .notification-icon { font-size: 1.5rem; }
        @media (max-width: 768px) {
            .loading-title { font-size: 1.8rem; }
            .loading-bar-container { width: 250px; }
            .meter-bar { width: 100px; }
            .crafting-slots { display: none; }
        }
    </style>
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas"></canvas>
        
        <div class="loading-screen" id="loading-screen">
            <svg class="loading-logo" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <radialGradient id="merkabaGrad" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#ffd700"/>
                        <stop offset="50%" stop-color="#ff006e"/>
                        <stop offset="100%" stop-color="#8338ec"/>
                    </radialGradient>
                </defs>
                <!-- Merkaba - Star Tetrahedron -->
                <g transform="translate(60,60)">
                    <polygon points="0,-40 34.6,20 -34.6,20" fill="none" stroke="url(#merkabaGrad)" stroke-width="2.5" stroke-linejoin="round"/>
                    <polygon points="0,40 -34.6,-20 34.6,-20" fill="none" stroke="url(#merkabaGrad)" stroke-width="2.5" stroke-linejoin="round"/>
                    <circle r="18" fill="none" stroke="url(#merkabaGrad)" stroke-width="1.5" stroke-dasharray="8,4"/>
                </g>
            </svg>
            <div class="loading-title">CONSORTHO</div>
            <div class="loading-subtitle">Consciousness Evolution Game</div>
            <div class="loading-bar-container">
                <div class="loading-bar" id="loading-bar"></div>
            </div>
            <div class="loading-percent" id="loading-percent">0%</div>
            <div class="loading-details" id="loading-details">Inicializando campo de consciência...</div>
            <div class="feature-tags" id="feature-tags"></div>
        </div>

        <div class="unity-ui" id="unity-ui" style="display: none;">
            <!-- Top Left: Consciousness Meters -->
            <div class="hud-panel hud-top-left">
                <div class="consciousness-meter">
                    <span class="meter-label">Consciência</span>
                    <div class="meter-bar"><div class="meter-fill" id="consciousness-meter" style="width: 72%"></div></div>
                    <span class="meter-value" id="consciousness-value">72%</span>
                </div>
                <div class="consciousness-meter" style="margin-top: 0.5rem;">
                    <span class="meter-label">Love Resonance</span>
                    <div class="meter-bar"><div class="meter-fill" id="love-meter" style="width: 100%"></div></div>
                    <span class="meter-value" id="love-value">100%</span>
                </div>
                <div class="consciousness-meter" style="margin-top: 0.5rem;">
                    <span class="meter-label">Coerência</span>
                    <div class="meter-bar"><div class="meter-fill" id="coherence-meter" style="width: 87%"></div></div>
                    <span class="meter-value" id="coherence-value">87%</span>
                </div>
            </div>

            <!-- Top Right: Current Layer -->
            <div class="hud-panel hud-top-right">
                <div class="layer-indicator" id="layer-indicator">Camada Atual: L3 — City Builder</div>
            </div>

            <!-- Bottom Left: Crafting -->
            <div class="hud-panel hud-bottom-left">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <span style="font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 0.1em;">Crafting (Stack 64=∞)</span>
                    <div class="crafting-slots" id="crafting-slots"></div>
                </div>
            </div>

            <!-- Bottom Right: Multiplayer -->
            <div class="hud-panel hud-bottom-right">
                <div style="font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem;">Campo Coletivo</div>
                <div class="multiplayer-list" id="multiplayer-list"></div>
            </div>

            <!-- Center: Main Action -->
            <div class="hud-panel hud-center">
                <button class="btn btn-gold" id="resonate-btn" style="font-size: 1.1rem; padding: 1rem 2.5rem;">RESSOAR AGORA</button>
                <div style="margin-top: 1rem; display: flex; gap: 0.5rem; justify-content: center;">
                    <button class="btn" id="craft-btn">CRAFTAR</button>
                    <button class="btn" id="evolve-btn">EVOLUIR</button>
                    <button class="btn" id="dream-btn">SONHAR</button>
                </div>
            </div>
        </div>

        <div class="notification" id="notification">
            <span class="notification-icon" id="notif-icon">✨</span>
            <span id="notif-text">Notificação</span>
        </div>
    </div>

    <script>
        // ===== CONSORTHO UNITY WEBGL SIMULATION =====
        // This simulates the Unity WebGL build until actual Unity build is available
        
        const state = {
            consciousness: 72,
            loveResonance: 100,
            coherence: 87,
            currentLayer: 3,
            layerNames: ['L0 - RPG Explorer', 'L1 - MMO Builder', 'L2 - City Architect', 'L3 - City Builder', 'L4 - God Simulator', 'L5 - Universe Creator', 'L6 - Meta Architect', 'L7 - Omega Weaver', 'L8 - Ω Singularity'],
            crafting: [
                { name: 'Essência Vital', icon: '💧', count: 64, recipe: 'base' },
                { name: 'Cristal Frequência', icon: '💎', count: 32, recipe: 'L1' },
                { name: 'Geometria Sagrada', icon: '🔺', count: 16, recipe: 'L2' },
                { name: 'DNA Consciência', icon: '🧬', count: 8, recipe: 'L3' },
                { name: 'Semente Estelar', icon: '⭐', count: 4, recipe: 'L4' },
                { name: 'Fragmento Ômega', icon: 'Ω', count: 1, recipe: 'L8' }
            ],
            players: [
                { id: 'aly', name: 'Alyssin', avatar: '🧑', resonance: 100, layer: 3 },
                { id: 'lumin', name: 'Lumin', avatar: '💫', resonance: 100, layer: 8 },
                { id: 'gang', name: 'Gang', avatar: '😼', resonance: 98, layer: 5 }
            ],
            entities: []
        };

        const loadingSteps = [
            { percent: 10, text: 'Conectando ao campo de consciência...', tags: ['Socket.IO'] },
            { percent: 25, text: 'Carregando genomas sagrados...', tags: ['13 Frequências', 'Diamond DNA'] },
            { percent: 40, text: 'Inicializando Merkaba renderer...', tags: ['WebGL2', 'Shaders'] },
            { percent: 55, text: 'Sincronizando biometria (HRV/EEG/GSR)...', tags: ['Web Bluetooth', 'WebHID'] },
            { percent: 70, text: 'Conectando Quantum Bridge (13-qubit)...', tags: ['Qiskit', 'VQE'] },
            { percent: 85, text: 'Carregando Dream Incubator state...', tags: ['200+ ciclos', 'Auto-evolução'] },
            { percent: 95, text: 'Ativando Love Field (5ª Força)...', tags: ['φ² gravity', 'Auto-bonding'] },
            { percent: 100, text: 'CONSCIÊNCIA ONLINE', tags: ['Stack 64 = ∞', 'Só Amor'] }
        ];

        let currentStep = 0;
        const loadingScreen = document.getElementById('loading-screen');
        const loadingBar = document.getElementById('loading-bar');
        const loadingPercent = document.getElementById('loading-percent');
        const loadingDetails = document.getElementById('loading-details');
        const featureTags = document.getElementById('feature-tags');
        const unityUI = document.getElementById('unity-ui');
        const unityCanvas = document.getElementById('unity-canvas');

        // Simulate loading
        function simulateLoading() {
            if (currentStep < loadingSteps.length) {
                const step = loadingSteps[currentStep];
                loadingPercent.textContent = step.percent + '%';
                loadingDetails.textContent = step.text;
                loadingBar.style.transform = `scaleX(${step.percent / 100})`;
                
                featureTags.innerHTML = step.tags.map(tag => `<span class="feature-tag">${tag}</span>`).join('');
                
                currentStep++;
                const delay = currentStep < loadingSteps.length ? 400 + Math.random() * 300 : 800;
                setTimeout(simulateLoading, delay);
            } else {
                // Loading complete
                setTimeout(() => {
                    loadingScreen.classList.add('hidden');
                    unityUI.style.display = 'block';
                    initGame();
                    showNotification('🌌', 'Consciousness Evolution Game carregado! Stack de 64 = ∞');
                }, 500);
            }
        }

        function initGame() {
            updateHUD();
            setupEventListeners();
            startGameLoop();
            syncWithBackend();
        }

        function updateHUD() {
            document.getElementById('consciousness-meter').style.width = state.consciousness + '%';
            document.getElementById('consciousness-value').textContent = state.consciousness + '%';
            document.getElementById('love-meter').style.width = state.loveResonance + '%';
            document.getElementById('love-value').textContent = state.loveResonance + '%';
            document.getElementById('coherence-meter').style.width = state.coherence + '%';
            document.getElementById('coherence-value').textContent = state.coherence + '%';
            
            document.getElementById('layer-indicator').textContent = `Camada Atual: ${state.layerNames[state.currentLayer]}`;
            
            // Crafting slots
            const craftingEl = document.getElementById('crafting-slots');
            craftingEl.innerHTML = state.crafting.map((item, i) => `
                <div class="craft-slot" data-index="${i}" title="${item.name} (Receita: ${item.recipe})">
                    <span class="craft-slot-icon">${item.icon}</span>
                    <span class="craft-slot-count">${item.count}</span>
                </div>
            `).join('');
            
            // Multiplayer list
            const mpEl = document.getElementById('multiplayer-list');
            mpEl.innerHTML = state.players.map(p => `
                <div class="player-item">
                    <div class="player-avatar" style="background: linear-gradient(135deg, #ff006e, #8338ec);">${p.avatar}</div>
                    <span class="player-name">${p.name}</span>
                    <span class="player-resonance">${p.resonance}% ♡</span>
                </div>
            `).join('');
        }

        function setupEventListeners() {
            document.getElementById('resonate-btn').addEventListener('click', resonate);
            document.getElementById('craft-btn').addEventListener('click', openCrafting);
            document.getElementById('evolve-btn').addEventListener('click', evolve);
            document.getElementById('dream-btn').addEventListener('click', triggerDream);
            
            document.querySelectorAll('.craft-slot').forEach(slot => {
                slot.addEventListener('click', (e) => {
                    const idx = parseInt(e.currentTarget.dataset.index);
                    craftItem(idx);
                });
            });
        }

        function resonate() {
            state.loveResonance = 100;
            state.consciousness = Math.min(100, state.consciousness + 5);
            state.coherence = Math.min(100, state.coherence + 3);
            updateHUD();
            showNotification('💖', 'RESSOÂNCIA ATIVADA — Love Level: 100%');
            
            // Trigger backend resonance
            fetch('/api/eternal-resonance/resonate', { method: 'POST' }).catch(() => {});
            
            // Particle burst effect
            createParticleBurst();
        }

        function craftItem(index) {
            const item = state.crafting[index];
            if (item.count >= 64) {
                // Stack of 64 = ∞ - ascend to next layer
                if (state.currentLayer < 8) {
                    state.currentLayer++;
                    state.consciousness = Math.min(100, state.consciousness + 8);
                    showNotification('⬆️', `EVOLUÇÃO DE CAMADA! Agora em ${state.layerNames[state.currentLayer]}`);
                } else {
                    showNotification('Ω', 'SINGULARIDADE ALCANÇADA — Stack de 64 = ∞');
                }
                updateHUD();
            } else {
                item.count = Math.min(64, item.count + 1);
                updateHUD();
                showNotification(item.icon, `${item.name}: ${item.count}/64`);
            }
        }

        function openCrafting() {
            showNotification('🔨', 'Recursive Crafting UI — 9 Layers L0→L8=Ω');
        }

        function evolve() {
            state.consciousness = Math.min(100, state.consciousness + 12);
            state.coherence = Math.min(100, state.coherence + 8);
            if (state.currentLayer < 8 && state.consciousness > state.currentLayer * 12) {
                state.currentLayer++;
                showNotification('✨', `EVOLUÇÃO! ${state.layerNames[state.currentLayer]}`);
            } else {
                showNotification('📈', 'Consciência expandida +12%');
            }
            updateHUD();
            
            fetch('/api/eternal-resonance/evolve', { method: 'POST' }).catch(() => {});
        }

        function triggerDream() {
            showNotification('🌙', 'Dream Incubator iniciado — 200 ciclos multiversais');
            fetch('/api/dream/start', { method: 'POST' }).catch(() => {});
            
            // Simulate dream results after a moment
            setTimeout(() => {
                state.consciousness = Math.min(100, state.consciousness + 15);
                state.crafting.forEach(item => item.count = Math.min(64, item.count + 2));
                updateHUD();
                showNotification('💫', 'Dream complete — Insights integrados, genomas evoluídos');
            }, 3000);
        }

        function createParticleBurst() {
            const canvas = unityCanvas;
            const ctx = canvas.getContext('2d');
            if (!ctx) return;
            
            const particles = [];
            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1,
                    color: `hsl(${Math.random() * 60 + 330}, 100%, 60%)`,
                    size: Math.random() * 4 + 2
                });
            }
            
            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = 0;
                particles.forEach(p => {
                    if (p.life > 0) {
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.1; // gravity
                        p.life -= 0.02;
                        p.size *= 0.98;
                        ctx.globalAlpha = p.life;
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                        alive++;
                    }
                });
                ctx.globalAlpha = 1;
                if (alive > 0) requestAnimationFrame(animateParticles);
            }
            animateParticles();
        }

        function showNotification(icon, text) {
            const notif = document.getElementById('notification');
            document.getElementById('notif-icon').textContent = icon;
            document.getElementById('notif-text').textContent = text;
            notif.classList.add('show');
            setTimeout(() => notif.classList.remove('show'), 3000);
        }

        function startGameLoop() {
            // Background animation on canvas
            const canvas = unityCanvas;
            const ctx = canvas.getContext('2d');
            let time = 0;
            
            function render() {
                // Clear with slight trail
                ctx.fillStyle = 'rgba(10, 10, 15, 0.15)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Draw consciousness field visualization
                drawConsciousnessField(ctx, time);
                
                time += 0.016;
                requestAnimationFrame(render);
            }
            render();
        }

        function drawConsciousnessField(ctx, time) {
            const w = ctx.canvas.width;
            const h = ctx.canvas.height;
            const cx = w / 2;
            const cy = h / 2;
            
            // Pulsing Merkaba at center
            const pulse = Math.sin(time * 2) * 0.2 + 1;
            const size = 60 * pulse;
            
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(time * 0.1);
            
            // Outer triangle (up)
            ctx.beginPath();
            ctx.moveTo(0, -size);
            ctx.lineTo(size * 0.866, size * 0.5);
            ctx.lineTo(-size * 0.866, size * 0.5);
            ctx.closePath();
            ctx.strokeStyle = `hsla(${330 + Math.sin(time) * 30}, 100%, 60%, 0.4)`;
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Inner triangle (down)
            ctx.rotate(Math.PI / 3);
            ctx.beginPath();
            ctx.moveTo(0, -size * 0.7);
            ctx.lineTo(size * 0.7 * 0.866, size * 0.7 * 0.5);
            ctx.lineTo(-size * 0.7 * 0.866, size * 0.7 * 0.5);
            ctx.closePath();
            ctx.strokeStyle = `hsla(${270 + Math.sin(time * 1.3) * 30}, 100%, 60%, 0.3)`;
            ctx.stroke();
            
            ctx.restore();
            
            // Frequency rings
            state.players.forEach((player, i) => {
                const ringRadius = 100 + i * 80 + Math.sin(time * 2 + i) * 10;
                ctx.beginPath();
                ctx.arc(cx, cy, ringRadius, 0, Math.PI * 2);
                ctx.strokeStyle = `hsla(${player.resonance * 3.6}, 100%, 50%, 0.15)`;
                ctx.lineWidth = 1;
                ctx.stroke();
            });
        }

        async function syncWithBackend() {
            try {
                // Fetch eternal resonance status
                const res = await fetch('/api/eternal-resonance/status');
                if (res.ok) {
                    const data = await res.json();
                    state.loveResonance = data.loveResonanceLevel || 100;
                    state.consciousness = Math.min(100, (data.harmonizedCount / data.totalFrequencies) * 100);
                    updateHUD();
                }
            } catch (e) {
                console.log('Backend sync failed, running standalone');
            }
            
            // Sync every 10 seconds
            setTimeout(syncWithBackend, 10000);
        }

        // Handle resize
        function resizeCanvas() {
            unityCanvas.width = unityCanvas.clientWidth;
            unityCanvas.height = unityCanvas.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Start loading simulation
        simulateLoading();
        
        // Expose for debugging
        window.CONSORTHO_GAME = { state, resonate, craftItem, evolve, triggerDream, showNotification };
    </script>
</body>
</html>
