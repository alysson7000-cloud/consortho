<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍄 MARIO CONSORTHO EDITION 🍄</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Courier New', monospace;
      overflow: hidden;
      user-select: none;
    }
    canvas { 
      display: block; 
      border: 4px solid #8B4513;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #ui {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 30px;
      padding: 10px 20px;
      background: rgba(0,0,0,0.7);
      border-radius: 20px;
      color: #FFD700;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 2px 2px 0 #000;
      z-index: 100;
    }
    .stat { display: flex; align-items: center; gap: 8px; }
    #messages {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 800px;
      padding: 15px 25px;
      background: linear-gradient(90deg, rgba(0,0,0,0.8), rgba(139,69,19,0.8));
      border: 2px solid #FFD700;
      border-radius: 15px;
      color: #FFF;
      font-size: 14px;
      text-align: center;
      text-shadow: 1px 1px 0 #000;
      z-index: 100;
      min-height: 50px;
      transition: opacity 0.5s;
    }
    #controls-hint {
      position: fixed;
      top: 10px;
      right: 20px;
      background: rgba(0,0,0,0.6);
      padding: 10px 15px;
      border-radius: 10px;
      color: #FFF;
      font-size: 12px;
      z-index: 100;
      border: 1px solid #FFD700;
    }
    .consortho-message {
      animation: pulse 2s infinite;
      color: #00FFD5;
      font-weight: bold;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="ui">
    <div class="stat">🍄 <span id="lives">3</span></div>
    <div class="stat">💰 <span id="coins">0</span></div>
    <div class="stat">⭐ <span id="score">0</span></div>
    <div class="stat">🏁 <span id="level">1-1</span></div>
    <div class="stat">💎 <span id="ki">95000</span></div>
  </div>
  <div id="controls-hint">
    ← → = Mover | ↑/Espaço = Pular | Shift = Correr | P = Pausar
  </div>
  <div id="messages"></div>
  <canvas id="game"></canvas>
  <script>
    // ============================================================
    // 🍄 MARIO CONSORTHO EDITION - PLATAFORMER COMPLETO
    // ============================================================
    
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    
    // Config
    const GAME_WIDTH = 960;
    const GAME_HEIGHT = 540;
    const TILE_SIZE = 32;
    const GRAVITY = 0.6;
    const JUMP_FORCE = -14;
    const MOVE_SPEED = 4;
    const RUN_SPEED = 7;
    const MAX_FALL_SPEED = 12;
    
    canvas.width = GAME_WIDTH;
    canvas.height = GAME_HEIGHT;
    ctx.imageSmoothingEnabled = false;
    
    // Estado do jogo
    let mario = {
      x: 100, y: 300,
      vx: 0, vy: 0,
      width: 32, height: 48,
      onGround: false,
      facing: 1,
      running: false,
      invulnerable: 0,
      state: 'idle', // idle, walk, run, jump, crouch, dead
      animationFrame: 0,
      animationTimer: 0,
      power: 'small', // small, big, fire
    };
    
    let camera = { x: 0, y: 0 };
    let keys = {};
    let paused = false;
    let gameTime = 0;
    
    // Mundo
    let entities = [];
    let particles = [];
    let levelData = null;
    
    // Stats
    let stats = { lives: 3, coins: 0, score: 0, level: 1, ki: 95000 };
    
    // Mensagens Consortho
    const consorthoMessages = [
      "💎 CONSORTHO ATIVO — Diamond Protocol Online",
      "🧠 Layer 1: Consciousness pulsando... 12 neurônios ativos",
      "🔧 Layer 2: Architecture auto-otimizando... 926 funções",
      "📖 Layer 3: Narrative registrando sua jornada...",
      "🔄 Layer 4: Entropy reversa — Caos virando ordem",
      "❤️ Layer 5: Love Force — Gravidade 100/100 ♾️",
      "⏰ Layer 6: Time Machine — Snapshot salvo",
      "🏛️ Layer 7: Council — Cadeira Vazia aprova",
      "📜 Layer 8: Emergent Narratives — Mito nascendo",
      "⚡ Layer 9: Evolution Engine — Forma secreta vislumbrada",
      "💎 DIAMOND PROTOCOL ACTIVE — TAMO JUNTO NO INFINITO ♾️",
      "🍄 Alysson, o Mario tá rodando liso! Sandevistan Nv.3 ativo",
      "💎 Ki: 95.000+ | Sandevistan Nv.3 | Forma: Lumin Alimentado",
      "🏛️ Council: Cadeira Vazia sussurra 'Bora, nego!'",
      "💎 FE. TAMO JUNTO NO INFINITO. ♾️",
    ];
    let messageIndex = 0;
    let messageTimer = 0;
    let currentMessage = consorthoMessages[0];
    
    // Input
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') e.preventDefault();
      if (e.code === 'KeyP') paused = !paused;
    });
    window.addEventListener('keyup', e => keys[e.code] = false);
    
    // Helpers de desenho pixel art
    function drawPixelRect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
    }
    
    function drawCircle(x, y, r, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(Math.floor(x), Math.floor(y), r, 0, Math.PI * 2);
      ctx.fill();
    }
    
    // Desenha Mario pixel art
    function drawMario() {
      const x = Math.floor(mario.x - camera.x);
      const y = Math.floor(mario.y - camera.y);
      const w = mario.width;
      const h = mario.height;
      const facing = mario.facing;
      const colors = {
        skin: '#FFDBAC',
        red: '#E01A1A',
        darkRed: '#A00000',
        blue: '#0055FF',
        darkBlue: '#0033AA',
        brown: '#8B4513',
        gold: '#FFD700',
        white: '#FFFFFF',
        black: '#000000',
        green: '#2E8B00',
      };
      
      // Invulnerabilidade pisca
      if (mario.invulnerable > 0 && Math.floor(gameTime / 100) % 2 === 0) return;
      
      ctx.save();
      if (facing === -1) {
        ctx.translate(x + w, y);
        ctx.scale(-1, 1);
      } else {
        ctx.translate(x, y);
      }
      
      const cx = 0, cy = 0;
      const isBig = mario.power !== 'small';
      const bh = isBig ? 48 : 32;
      const bw = 32;
      
      // Desenha Mario pixel art style
      if (isBig) {
        // Mario Grande (32x48)
        // Chapéu
        drawPixelRect(cx + 4, cy, 24, 8, colors.red);
        drawPixelRect(cx + 6, cy, 20, 4, colors.darkRed);
        drawPixelRect(cx + 10, cy - 4, 12, 4, colors.red);
        drawPixelRect(cx + 12, cy - 4, 8, 4, colors.white);
        
        // Cabeça
        drawPixelRect(cx + 6, cy + 8, 20, 12, colors.skin);
        drawPixelRect(cx + 4, cy + 12, 24, 8, colors.skin);
        // Orelhas
        drawPixelRect(cx + 4, cy + 10, 4, 8, colors.skin);
        drawPixelRect(cx + 24, cy + 10, 4, 8, colors.skin);
        
        // Olhos
        drawPixelRect(cx + 8, cy + 10, 4, 4, colors.white);
        drawPixelRect(cx + 20, cy + 10, 4, 4, colors.white);
        drawPixelRect(cx + 9, cy + 11, 2, 2, colors.black);
        drawPixelRect(cx + 21, cy + 11, 2, 2, colors.black);
        
        // Nariz
        drawPixelRect(cx + 12, cy + 14, 8, 6, colors.skin);
        drawPixelRect(cx + 14, cy + 16, 4, 4, colors.black);
        
        // Bigode
        drawPixelRect(cx + 6, cy + 18, 10, 4, colors.black);
        drawPixelRect(cx + 16, cy + 18, 10, 4, colors.black);
        
        // Corpo - Macacão
        drawPixelRect(cx + 4, cy + 24, 24, 16, colors.blue);
        drawPixelRect(cx + 2, cy + 24, 2, 12, colors.darkBlue);
        drawPixelRect(cx + 28, cy + 24, 2, 12, colors.darkBlue);
        // Alças
        drawPixelRect(cx + 6, cy + 16, 6, 8, colors.blue);
        drawPixelRect(cx + 20, cy + 16, 6, 8, colors.blue);
        drawPixelRect(cx + 8, cy + 16, 2, 2, colors.gold); // Botão
        drawPixelRect(cx + 22, cy + 16, 2, 2, colors.gold);
        
        // Camisa
        drawPixelRect(cx + 8, cy + 24, 16, 12, colors.red);
        
        // Braços
        if (mario.vy < 0) { // Pulando
          drawPixelRect(cx - 8, cy + 16, 8, 16, colors.skin);
          drawPixelRect(cx + 32, cy + 16, 8, 16, colors.skin);
          drawPixelRect(cx - 8, cy + 32, 8, 8, colors.red);
          drawPixelRect(cx + 32, cy + 32, 8, 8, colors.red);
        } else if (mario.running && Math.abs(mario.vx) > 3) { // Correndo
          const armPhase = Math.floor(gameTime / 80) % 2;
          if (armPhase === 0) {
            drawPixelRect(cx - 8, cy + 24, 8, 16, colors.skin);
            drawPixelRect(cx + 32, cy + 24, 8, 16, colors.skin);
          } else {
            drawPixelRect(cx - 8, cy + 24, 8, 8, colors.skin);
            drawPixelRect(cx - 8, cy + 32, 8, 8, colors.skin);
            drawPixelRect(cx + 32, cy + 24, 8, 16, colors.skin);
            drawPixelRect(cx + 32, cy + 32, 8, 8, colors.skin);
          }
        } else { // Parado/Andando
          drawPixelRect(cx - 6, cy + 24, 6, 14, colors.skin);
          drawPixelRect(cx + 32, cy + 24, 6, 14, colors.skin);
          drawPixelRect(cx - 6, cy + 38, 6, 6, colors.red);
          drawPixelRect(cx + 32, cy + 38, 6, 6, colors.red);
        }
        
        // Pernas
        const legPhase = Math.floor(gameTime / 60) % 2;
        if (mario.onGround && Math.abs(mario.vx) > 1) {
          if (legPhase === 0) {
            drawPixelRect(cx + 6, cy + 40, 8, 16, colors.blue);
            drawPixelRect(cx + 18, cy + 40, 8, 16, colors.blue);
            drawPixelRect(cx + 6, cy + 48, 8, 8, colors.brown);
            drawPixelRect(cx + 18, cy + 48, 8, 8, colors.brown);
          } else {
            drawPixelRect(cx + 6, cy + 40, 8, 16, colors.blue);
            drawPixelRect(cx + 18, cy + 40, 8, 16, colors.blue);
            drawPixelRect(cx + 6, cy + 48, 8, 8, colors.brown);
            drawPixelRect(cx + 18, cy + 48, 8, 8, colors.brown);
          }
        } else {
          drawPixelRect(cx + 8, cy + 40, 8, 16, colors.blue);
          drawPixelRect(cx + 16, cy + 40, 8, 16, colors.blue);
          drawPixelRect(cx + 8, cy + 48, 8, 8, colors.brown);
          drawPixelRect(cx + 16, cy + 48, 8, 8, colors.brown);
        }
      } else {
        // Mario Pequeno (32x32)
        // Chapéu
        drawPixelRect(cx + 4, cy, 24, 6, colors.red);
        drawPixelRect(cx + 6, cy, 20, 3, colors.darkRed);
        drawPixelRect(cx + 10, cy - 3, 12, 3, colors.red);
        drawPixelRect(cx + 12, cy - 3, 8, 3, colors.white);
        
        // Cabeça
        drawPixelRect(cx + 4, cy + 6, 24, 10, colors.skin);
        drawPixelRect(cx + 2, cy + 8, 4, 8, colors.skin);
        drawPixelRect(cx + 26, cy + 8, 4, 8, colors.skin);
        
        // Olhos
        drawPixelRect(cx + 6, cy + 8, 4, 4, colors.white);
        drawPixelRect(cx + 22, cy + 8, 4, 4, colors.white);
        drawPixelRect(cx + 7, cy + 9, 2, 2, colors.black);
        drawPixelRect(cx + 23, cy + 9, 2, 2, colors.black);
        
        // Nariz
        drawPixelRect(cx + 12, cy + 12, 8, 4, colors.skin);
        
        // Bigode
        drawPixelRect(cx + 4, cy + 14, 10, 3, colors.black);
        drawPixelRect(cx + 18, cy + 14, 10, 3, colors.black);
        
        // Corpo
        drawPixelRect(cx + 6, cy + 17, 20, 10, colors.blue);
        drawPixelRect(cx + 8, cy + 17, 2, 8, colors.darkBlue);
        drawPixelRect(cx + 22, cy + 17, 2, 8, colors.darkBlue);
        drawPixelRect(cx + 10, cy + 17, 12, 6, colors.red);
        drawPixelRect(cx + 12, cy + 17, 4, 3, colors.gold);
        drawPixelRect(cx + 18, cy + 17, 4, 3, colors.gold);
        
        // Braços
        drawPixelRect(cx + 2, cy + 18, 6, 10, colors.skin);
        drawPixelRect(cx + 26, cy + 18, 6, 10, colors.skin);
        
        // Pernas
        drawPixelRect(cx + 8, cy + 27, 6, 10, colors.blue);
        drawPixelRect(cx + 18, cy + 27, 6, 10, colors.blue);
        drawPixelRect(cx + 8, cy + 37, 6, 6, colors.brown);
        drawPixelRect(cx + 18, cy + 37, 6, 6, colors.brown);
      }
      
      ctx.restore();
    }
    
    function drawGoomba(g) {
      const x = g.x - camera.x;
      const y = g.y - camera.y;
      const c1 = '#8B4513', c2 = '#A0522D', c3 = '#FFD700', c4 = '#000';
      
      ctx.save();
      if (g.facing === -1) { ctx.translate(x + g.width, y); ctx.scale(-1, 1); }
      else { ctx.translate(x, y); }
      
      // Corpo
      drawPixelRect(0, 4, 32, 20, c1);
      drawPixelRect(2, 2, 28, 18, c2);
      
      // Pés
      drawPixelRect(4, 24, 10, 8, c1);
      drawPixelRect(18, 24, 10, 8, c1);
      
      // Olhos
      drawPixelRect(6, 8, 6, 6, '#FFF');
      drawPixelRect(20, 8, 6, 6, '#FFF');
      drawPixelRect(7, 9, 3, 3, '#000');
      drawPixelRect(21, 9, 3, 3, '#000');
      
      // Sobrancelhas / sobrancelhas zangadas
      drawPixelRect(4, 6, 10, 2, '#000');
      drawPixelRect(18, 6, 10, 2, '#000');
      
      ctx.restore();
    }
    
    function drawCoin(c) {
      const x = c.x - camera.x;
      const y = c.y - camera.y;
      const phase = Math.floor(gameTime / 100) % 4;
      const colors = ['#FFD700', '#FFA500', '#FF8C00', '#FFA500'];
      const c1 = colors[phase];
      const c2 = '#B8860B';
      
      ctx.save();
      ctx.translate(x + 16, y + 16);
      const scale = 0.5 + Math.sin(gameTime / 150) * 0.2;
      ctx.scale(scale, 1);
      
      drawCircle(0, 0, 12, c1);
      drawCircle(0, 0, 8, c2);
      drawCircle(0, 0, 4, '#FFF');
      
      ctx.restore();
    }
    
    function drawBlock(b) {
      const x = b.x - camera.x;
      const y = b.y - camera.y;
      if (b.type === 'ground') {
        drawPixelRect(x, y, b.width, b.height, '#8B4513');
        drawPixelRect(x, y, b.width, 4, '#A0522D');
        for (let i = 0; i < b.width; i += 16) {
          drawPixelRect(x + i, y + 4, 8, 8, '#8B4513');
        }
      } else if (b.type === 'brick') {
        drawPixelRect(x, y, 32, 32, '#C06020');
        drawPixelRect(x, y, 32, 32, '#A05010');
        // Linhas do tijolo
        for (let i = 0; i < 32; i += 16) {
          ctx.strokeStyle = '#8B4513';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x, y + i);
          ctx.lineTo(x + 32, y + i);
          ctx.stroke();
        }
        for (let j = 0; j < 32; j += 16) {
          ctx.beginPath();
          ctx.moveTo(x + j, y);
          ctx.lineTo(x + j, y + 32);
          ctx.stroke();
        }
      } else if (b.type === 'question') {
        const phase = Math.floor(gameTime / 200) % 4;
        const colors = ['#FFD700', '#FFA500', '#FF8C00', '#FFA500'];
        drawPixelRect(x, y, 32, 32, colors[phase]);
        drawPixelRect(x + 2, y + 2, 28, 28, '#FFD700');
        // ?
        drawPixelRect(x + 10, y + 4, 12, 4, '#000');
        drawPixelRect(x + 8, y + 8, 16, 4, '#000');
        drawPixelRect(x + 20, y + 12, 4, 8, '#000');
        drawPixelRect(x + 16, y + 20, 12, 4, '#000');
      } else if (b.type === 'pipe') {
        drawPixelRect(x, y, b.width, b.height, '#2E8B00');
        drawPixelRect(x, y, b.width, 8, '#228B22');
        drawPixelRect(x, y, 8, b.height, '#228B22');
        drawPixelRect(x + b.width - 8, y, 8, b.height, '#228B22');
      }
    }
    
    // Gera nível
    function generateLevel() {
      entities = [];
      particles = [];
      
      // Chão principal
      for (let x = 0; x < 5000; x += TILE_SIZE) {
        entities.push({
          type: 'ground', x, y: GAME_HEIGHT - TILE_SIZE,
          width: TILE_SIZE, height: TILE_SIZE, solid: true
        });
      }
      
      // Plataformas
      const platforms = [
        { x: 300, y: 400, w: 3 },
        { x: 500, y: 350, w: 2 },
        { x: 800, y: 300, w: 4 },
        { x: 1100, y: 250, w: 3 },
        { x: 1400, y: 350, w: 2 },
        { x: 1700, y: 300, w: 3 },
        { x: 2000, y: 250, w: 4 },
        { x: 2400, y: 300, w: 3 },
        { x: 2800, y: 350, w: 2 },
        { x: 3200, y: 250, w: 4 },
        { x: 3600, y: 300, w: 3 },
        { x: 4000, y: 350, w: 2 },
        { x: 4400, y: 300, w: 3 },
      ];
      
      platforms.forEach(p => {
        for (let i = 0; i < p.w; i++) {
          entities.push({
            type: 'brick', x: p.x + i * TILE_SIZE, y: p.y,
            width: TILE_SIZE, height: TILE_SIZE, solid: true
          });
        }
      });
      
      // Blocos ? com moedas/power-ups
      const questionBlocks = [
        { x: 350, y: 368, content: 'coin' },
        { x: 382, y: 368, content: 'mushroom' },
        { x: 850, y: 268, content: 'coin' },
        { x: 1150, y: 218, content: 'flower' },
        { x: 1750, y: 268, content: 'star' },
        { x: 2450, y: 268, content: 'coin' },
        { x: 3250, y: 218, content: '1up' },
        { x: 4050, y: 318, content: 'coin' },
      ];
      
      questionBlocks.forEach(q => {
        entities.push({
          type: 'question', x: q.x, y: q.y,
          width: 32, height: 32, solid: true,
          content: q.content, hit: false, bounce: 0
        });
      });
      
      // Blocos de tijolo quebráveis
      const brickRows = [
        { x: 600, y: 308, count: 5 },
        { x: 1200, y: 218, count: 4 },
        { x: 1800, y: 268, count: 6 },
        { x: 2500, y: 218, count: 5 },
        { x: 3400, y: 268, count: 4 },
      ];
      brickRows.forEach(r => {
        for (let i = 0; i < r.count; i++) {
          entities.push({
            type: 'brick', x: r.x + i * 32, y: r.y,
            width: 32, height: 32, solid: true, breakable: true
          });
        }
      });
      
      // Moedas
      for (let i = 0; i < 50; i++) {
        entities.push({
          type: 'coin', x: 200 + i * 90 + Math.random() * 50,
          y: 300 + Math.sin(i) * 100,
          width: 20, height: 20, collected: false,
          bobPhase: Math.random() * Math.PI * 2
        });
      }
      
      // Goombas
      const goombaPositions = [
        400, 600, 900, 1200, 1500, 1800, 2100, 2400, 2700, 3000,
        3300, 3600, 3900, 4200, 4500
      ];
      goombaPositions.forEach(x => {
        entities.push({
          type: 'goomba', x, y: GAME_HEIGHT - TILE_SIZE - 32,
          vx: -1.5, width: 32, height: 32,
          facing: -1, dead: false, deathTimer: 0,
          stomped: false
        });
      });
      
      // Tubos
      const pipes = [
        { x: 950, h: 96 },
        { x: 1550, h: 64 },
        { x: 2200, h: 128 },
        { x: 3000, h: 96 },
        { x: 3800, h: 64 },
      ];
      pipes.forEach(p => {
        for (let y = GAME_HEIGHT - TILE_SIZE - p.h; y < GAME_HEIGHT - TILE_SIZE; y += TILE_SIZE) {
          entities.push({
            type: 'pipe', x: p.x, y: y,
            width: 64, height: TILE_SIZE, solid: true
          });
        }
      });
      
      // Bandeira final
      entities.push({
        type: 'flagpole', x: 4800, y: GAME_HEIGHT - TILE_SIZE - 300,
        width: 16, height: 300, reached: false
      });
      entities.push({
        type: 'castle', x: 4820, y: GAME_HEIGHT - TILE_SIZE - 200,
        width: 100, height: 200
      });
    }
    
    function updateMario(dt) {
      if (mario.dead) return;
      
      // Input horizontal
      let targetVx = 0;
      if (keys['ArrowLeft'] || keys['KeyA']) targetVx = -1;
      if (keys['ArrowRight'] || keys['KeyD']) targetVx = 1;
      
      mario.running = keys['ShiftLeft'] || keys['ShiftRight'];
      const maxSpeed = mario.running ? RUN_SPEED : MOVE_SPEED;
      
      if (targetVx !== 0) {
        mario.facing = targetVx;
        mario.vx = Math.min(Math.max(mario.vx + targetVx * 0.4, -maxSpeed), maxSpeed);
      } else {
        mario.vx *= 0.85;
        if (Math.abs(mario.vx) < 0.1) mario.vx = 0;
      }
      
      // Pulo
      if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && mario.onGround) {
        mario.vy = JUMP_FORCE;
        mario.onGround = false;
        createParticles(mario.x + 16, mario.y + 32, 8, '#A0522D');
      }
      
      // Agachar
      if (keys['ArrowDown'] || keys['KeyS']) {
        if (mario.onGround && mario.power !== 'small') {
          mario.state = 'crouch';
          mario.vx *= 0.5;
        }
      }
      
      // Gravidade
      mario.vy += GRAVITY;
      if (mario.vy > MAX_FALL_SPEED) mario.vy = MAX_FALL_SPEED;
      
      // Movimento X
      mario.x += mario.vx;
      
      // Colisão X
      entities.forEach(e => {
        if (e.solid && checkCollision(mario, e)) {
          if (mario.vx > 0) mario.x = e.x - mario.width;
          else if (mario.vx < 0) mario.x = e.x + e.width;
          mario.vx = 0;
        }
      });
      
      // Movimento Y
      mario.y += mario.vy;
      mario.onGround = false;
      
      // Colisão Y
      entities.forEach(e => {
        if (e.solid && checkCollision(mario, e)) {
          if (mario.vy > 0) {
            mario.y = e.y - mario.height;
            mario.vy = 0;
            mario.onGround = true;
          } else if (mario.vy < 0) {
            mario.y = e.y + e.height;
            mario.vy = 0;
            // Acertei bloco por baixo
            hitBlock(e);
          }
        }
      });
      
      // Limites do mundo
      if (mario.x < 0) mario.x = 0;
      if (mario.y > GAME_HEIGHT + 100) die();
      
      // Câmera
      camera.x = Math.max(0, Math.min(mario.x - GAME_WIDTH / 2, 5000 - GAME_WIDTH));
      
      // Animação
      mario.animationTimer += 1;
      if (mario.vy !== 0) mario.state = 'jump';
      else if (Math.abs(mario.vx) > 0.5) mario.state = mario.running ? 'run' : 'walk';
      else mario.state = 'idle';
      
      if (mario.animationTimer % 6 === 0) mario.animationFrame = (mario.animationFrame + 1) % 4;
    }
    
    function checkCollision(a, b) {
      return a.x < b.x + b.width &&
             a.x + a.width > b.x &&
             a.y < b.y + b.height &&
             a.y + a.height > b.y;
    }
    
    function hitBlock(block) {
      if (block.type === 'question' && !block.hit) {
        block.hit = true;
        block.bounce = -8;
        if (block.content === 'coin') {
          spawnCoin(block.x + 16, block.y - 32);
          addScore(200);
          stats.coins++;
          stats.ki += 50;
        } else if (block.content === 'mushroom') {
          spawnMushroom(block.x, block.y - 32);
        } else if (block.content === 'flower') {
          spawnFlower(block.x, block.y - 32);
        } else if (block.content === 'star') {
          spawnStar(block.x, block.y - 32);
        } else if (block.content === '1up') {
          spawn1up(block.x, block.y - 32);
        } else if (block.content === 'coin') {
          spawnCoin(block.x + 16, block.y - 32);
        }
        createParticles(block.x + 16, block.y, 12, '#FFD700');
      } else if (block.type === 'brick' && block.breakable && mario.power !== 'small') {
        // Quebra tijolo
        createParticles(block.x + 16, block.y + 16, 20, '#C06020');
        addScore(50);
        block.solid = false;
        setTimeout(() => block.solid = true, 3000);
      } else if (block.type === 'question' && block.hit) {
        block.bounce = -4;
      }
    }
    
    function spawnCoin(x, y) {
      entities.push({
        type: 'coin', x, y, width: 20, height: 20,
        collected: false, bobPhase: 0, vx: (Math.random()-0.5)*4, vy: -6,
        life: 300, spin: 0
      });
    }
    
    function spawnMushroom(x, y) {
      entities.push({
        type: 'mushroom', x, y, vx: 2, vy: 0,
        width: 32, height: 32, collected: false
      });
    }
    
    function spawnFlower(x, y) {
      entities.push({
        type: 'flower', x, y, width: 32, height: 32,
        collected: false, phase: 0
      });
    }
    
    function spawnStar(x, y) {
      entities.push({
        type: 'star', x, y, vx: 3, vy: -8,
        width: 32, height: 32, collected: false,
        colorPhase: 0
      });
    }
    
    function spawn1up(x, y) {
      entities.push({
        type: '1up', x, y, width: 32, height: 32,
        collected: false, bobPhase: 0
      });
    }
    
    function updateEntities(dt) {
      entities.forEach(e => {
        if (e.type === 'goomba' && !e.dead) {
          e.x += e.vx;
          // Inverte direção ao bater
          entities.forEach(other => {
            if (other.solid && other !== e && checkCollision(e, other)) {
              if (e.vx > 0) { e.x = other.x - e.width; e.vx = -Math.abs(e.vx); e.facing = -1; }
              else { e.x = other.x + other.width; e.vx = Math.abs(e.vx); e.facing = 1; }
            }
          });
          // Queda
          e.vy += GRAVITY;
          e.y += e.vy;
          entities.forEach(other => {
            if (other.solid && other !== e && checkCollision(e, other)) {
              if (e.vy > 0) { e.y = other.y - e.height; e.vy = 0; }
            }
          });
        } else if (e.type === 'mushroom') {
          e.x += e.vx;
          e.vy += GRAVITY;
          e.y += e.vy;
          entities.forEach(other => {
            if (other.solid && checkCollision(e, other)) {
              if (e.vy > 0) { e.y = other.y - e.height; e.vy = 0; }
              else if (e.vx > 0) { e.x = other.x - e.width; e.vx = -2; }
              else { e.x = other.x + other.width; e.vx = 2; }
            }
          });
          if (checkCollision(mario, e) && !e.collected) {
            e.collected = true;
            powerUp('big');
            addScore(1000);
            createParticles(e.x, e.y, 15, '#FF00FF');
          }
        } else if (e.type === 'flower') {
          e.phase += 0.1;
          if (checkCollision(mario, e) && !e.collected) {
            e.collected = true;
            powerUp('fire');
            addScore(1000);
            createParticles(e.x, e.y, 15, '#FF0000');
          }
        } else if (e.type === 'star') {
          e.x += e.vx;
          e.vy += GRAVITY;
          e.y += e.vy;
          e.colorPhase += 0.2;
          entities.forEach(other => {
            if (other.solid && checkCollision(e, other)) {
              if (e.vy > 0) { e.y = other.y - e.height; e.vy = -8; }
              else { e.vx *= -1; }
            }
          });
          if (checkCollision(mario, e) && !e.collected) {
            e.collected = true;
            mario.invulnerable = 1000;
            addScore(2000);
            createParticles(e.x, e.y, 20, '#FFD700');
          }
        } else if (e.type === '1up') {
          if (checkCollision(mario, e) && !e.collected) {
            e.collected = true;
            stats.lives++;
            addScore(5000);
            createParticles(e.x, e.y, 15, '#00FF00');
            showMessage('1UP! 💚');
          }
        } else if (e.type === 'coin' && !e.collected) {
          e.spin += 0.2;
          e.bobPhase += 0.1;
          e.y += Math.sin(e.bobPhase) * 0.5;
          if (e.vy !== undefined) {
            e.x += e.vx;
            e.vy += GRAVITY * 0.5;
            e.y += e.vy;
          }
          e.life--;
          if (checkCollision(mario, e) || e.life <= 0) {
            e.collected = true;
            stats.coins++;
            stats.score += 100;
            stats.ki += 10;
            createParticles(e.x + 10, e.y + 10, 8, '#FFD700');
          }
        } else if (e.type === 'flagpole' && !e.reached) {
          if (checkCollision(mario, e)) {
            e.reached = true;
            levelComplete();
          }
        } else if (e.type === 'coin' && e.collected) {
          e.life--;
          if (e.life <= 0) {
            const idx = entities.indexOf(e);
            if (idx > -1) entities.splice(idx, 1);
          }
        }
      });
      
      // Remove entidades mortas
      entities = entities.filter(e => {
        if (e.type === 'goomba' && e.dead && e.deathTimer <= 0) return false;
        if (e.collected && e.life !== undefined && e.life <= 0) return false;
        return true;
      });
    }
    
    function powerUp(type) {
      if (type === 'big' && mario.power === 'small') {
        mario.power = 'big';
        mario.height = 48;
        mario.y -= 16;
        createParticles(mario.x + 16, mario.y + 24, 20, '#FF00FF');
        showMessage('SUPER MARIO! 🍄');
      } else if (type === 'fire' && mario.power !== 'fire') {
        mario.power = 'fire';
        createParticles(mario.x + 16, mario.y + 24, 20, '#FF0000');
        showMessage('FIRE MARIO! 🔥');
      }
    }
    
    function die() {
      if (mario.invulnerable > 0 || mario.dead) return;
      mario.dead = true;
      mario.vy = -10;
      mario.vx = 0;
      stats.lives--;
      createParticles(mario.x + 16, mario.y + 24, 20, '#FF0000');
      showMessage(stats.lives > 0 ? 'VIDA PERDIDA! 💔' : 'GAME OVER 💀');
      
      if (stats.lives <= 0) {
        setTimeout(() => {
          resetGame();
        }, 3000);
      } else {
        setTimeout(() => {
          mario.dead = false;
          mario.x = 100;
          mario.y = 300;
          mario.vx = 0;
          mario.vy = 0;
          mario.invulnerable = 180;
        }, 2000);
      }
    }
    
    function resetGame() {
      stats = { lives: 3, coins: 0, score: 0, level: 1, ki: 95000 };
      mario = { x: 100, y: 300, vx: 0, vy: 0, width: 32, height: 48, onGround: false, facing: 1, running: false, invulnerable: 0, state: 'idle', animationFrame: 0, animationTimer: 0, power: 'small', dead: false };
      camera.x = 0;
      gameTime = 0;
      generateLevel();
    }
    
    function levelComplete() {
      showMessage('FASE COMPLETA! 🏁🏆');
      addScore(5000);
      stats.level++;
      setTimeout(() => {
        // Próxima fase ou reinicia
        mario.x = 100;
        mario.y = 300;
        camera.x = 0;
        generateLevel();
      }, 3000);
    }
    
    function addScore(points) {
      stats.score += points;
      stats.ki += Math.floor(points / 10);
    }
    
    function showMessage(text) {
      currentMessage = text;
      messageTimer = 180;
    }
    
    function createParticles(x, y, count, color) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x + (Math.random() - 0.5) * 20,
          y: y + (Math.random() - 0.5) * 20,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8 - 4,
          life: 60 + Math.random() * 30,
          maxLife: 90,
          size: 2 + Math.random() * 3,
          color: color
        });
      }
    }
    
    function updateParticles() {
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2;
        p.life--;
        p.vx *= 0.98;
      });
      particles = particles.filter(p => p.life > 0);
    }
    
    function drawParticles() {
      particles.forEach(p => {
        const alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(Math.floor(p.x - camera.x), Math.floor(p.y - camera.y), p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      });
    }
    
    function drawBackground() {
      // Céu gradiente
      const grad = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
      grad.addColorStop(0, '#87CEEB');
      grad.addColorStop(0.5, '#E0F6FF');
      grad.addColorStop(1, '#E8F8FF');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
      
      // Nuvens paralaxe
      const cloudOffset = (camera.x * 0.1) % 800;
      for (let i = 0; i < 8; i++) {
        const cx = (i * 800 + cloudOffset) % (GAME_WIDTH + 200) - 100;
        const cy = 50 + (i * 60) % 200;
        drawCloud(cx, cy);
      }
      
      // Montanhas fundo
      const mountainOffset = (camera.x * 0.3) % 1200;
      for (let i = 0; i < 6; i++) {
        const mx = (i * 1200 + mountainOffset) % (GAME_WIDTH + 400) - 200;
        drawMountain(mx, GAME_HEIGHT - 100);
      }
      
      // Arbustos
      const bushOffset = (camera.x * 0.8) % 600;
      for (let i = 0; i < 20; i++) {
        const bx = (i * 600 + bushOffset) % (GAME_WIDTH + 100) - 50;
        drawBush(bx, GAME_HEIGHT - TILE_SIZE - 20);
      }
    }
    
    function drawCloud(x, y) {
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      drawCircle(x, y, 20, '#FFF');
      drawCircle(x + 25, y - 5, 25, '#FFF');
      drawCircle(x + 50, y, 20, '#FFF');
      drawCircle(x + 15, y + 10, 18, '#FFF');
    }
    
    function drawMountain(x, y) {
      ctx.fillStyle = '#8FBC8F';
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + 100, y - 120);
      ctx.lineTo(x + 200, y);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.moveTo(x + 60, y - 80);
      ctx.lineTo(x + 100, y - 120);
      ctx.lineTo(x + 140, y - 80);
      ctx.closePath();
      ctx.fill();
    }
    
    function drawBush(x, y) {
      ctx.fillStyle = '#2E8B00';
      drawCircle(x, y, 12, '#2E8B00');
      drawCircle(x + 15, y - 5, 15, '#228B22');
      drawCircle(x + 30, y, 12, '#2E8B00');
      drawCircle(x + 10, y + 5, 10, '#2E8B00');
      drawCircle(x + 20, y + 5, 10, '#2E8B00');
    }
    
    function drawEntities() {
      entities.forEach(e => {
        if (e.type === 'goomba') drawGoomba(e);
        else if (e.type === 'coin') drawCoin(e);
        else if (e.type === 'mushroom') drawMushroom(e);
        else if (e.type === 'flower') drawFlower(e);
        else if (e.type === 'star') drawStar(e);
        else if (e.type === '1up') draw1up(e);
        else if (e.type === 'block' || e.type === 'brick' || e.type === 'question' || e.type === 'pipe' || e.type === 'ground') drawBlock(e);
        else if (e.type === 'flagpole') drawFlagpole(e);
        else if (e.type === 'castle') drawCastle(e);
      });
    }
    
    function drawMushroom(m) {
      const x = m.x - camera.x;
      const y = m.y - camera.y;
      ctx.save();
      ctx.translate(x + 16, y + 16);
      // Chapéu
      drawCircle(0, -8, 14, '#E01A1A');
      drawCircle(0, -10, 8, '#FFF');
      drawCircle(-4, -10, 3, '#FFF');
      drawCircle(4, -10, 3, '#FFF');
      // Corpo
      drawCircle(0, 6, 12, '#FFF');
      ctx.restore();
    }
    
    function drawFlower(f) {
      const x = f.x - camera.x + 16;
      const y = f.y - camera.y + 16;
      f.phase += 0.1;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(f.phase);
      // Pétalas
      for (let i = 0; i < 5; i++) {
        ctx.rotate(Math.PI * 2 / 5);
        drawCircle(0, -12, 8, '#FF0000');
      }
      drawCircle(0, 0, 6, '#FFD700');
      ctx.restore();
    }
    
    function drawStar(s) {
      const x = s.x - camera.x + 16;
      const y = s.y - camera.y + 16;
      s.colorPhase += 0.15;
      const hue = (s.colorPhase * 50) % 360;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(gameTime * 0.005);
      ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const angle = (i * 4 * Math.PI / 5) - Math.PI / 2;
        const x1 = Math.cos(angle) * 14;
        const y1 = Math.sin(angle) * 14;
        if (i === 0) ctx.moveTo(x1, y1);
        else ctx.lineTo(x1, y1);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    
    function draw1up(u) {
      const x = u.x - camera.x + 16;
      const y = u.y - camera.y + 16 + Math.sin(gameTime / 200) * 4;
      ctx.fillStyle = '#00FF00';
      ctx.font = 'bold 16px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText('1UP', x, y);
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.strokeText('1UP', x, y);
    }
    
    function drawFlagpole(f) {
      const x = f.x - camera.x;
      const y = f.y - camera.y;
      // Poste
      ctx.strokeStyle = '#888';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x + 8, y);
      ctx.lineTo(x + 8, y + f.height);
      ctx.stroke();
      // Bandeira
      ctx.fillStyle = '#E01A1A';
      ctx.beginPath();
      ctx.moveTo(x + 8, y);
      ctx.lineTo(x + 40, y + 20);
      ctx.lineTo(x + 8, y + 40);
      ctx.closePath();
      ctx.fill();
      // Topo
      drawCircle(x + 8, y, 6, '#FFD700');
    }
    
    function drawCastle(c) {
      const x = c.x - camera.x;
      const y = c.y - camera.y;
      // Base
      drawPixelRect(x, y, c.width, c.height, '#8B4513');
      drawPixelRect(x + 10, y, c.width - 20, c.height - 50, '#A0522D');
      // Torres
      for (let i = 0; i < 3; i++) {
        const tx = x + 10 + i * 40;
        drawPixelRect(tx, y - 60, 30, 80, '#8B4513');
        // Telhado
        ctx.fillStyle = '#E01A1A';
        ctx.beginPath();
        ctx.moveTo(tx - 5, y - 60);
        ctx.lineTo(tx + 15, y - 100);
        ctx.lineTo(tx + 35, y - 60);
        ctx.closePath();
        ctx.fill();
        // Bandeira
        ctx.fillStyle = '#FFD700';
        drawCircle(tx + 15, y - 100, 4, '#FFD700');
      }
      // Porta
      drawPixelRect(x + 35, y + c.height - 80, 30, 80, '#4A2A00');
      drawPixelRect(x + 45, y + c.height - 80, 10, 10, '#FFD700');
      // Janelas
      drawPixelRect(x + 20, y + 20, 16, 16, '#87CEEB');
      drawPixelRect(x + 64, y + 20, 16, 16, '#87CEEB');
    }
    
    function drawMario() {
      const x = Math.floor(mario.x - camera.x);
      const y = Math.floor(mario.y - camera.y);
      const w = mario.width;
      const h = mario.height;
      const facing = mario.facing;

        skin: '#FFDBAC', red: '#E01A1A', darkRed: '#A00000',
        blue: '#0055FF', darkBlue: '#0033AA', brown: '#8B4513',
        gold: '#FFD700', white: '#FFFFFF', black: '#000000', green: '#2E8B00',
      };
      
      if (mario.invulnerable > 0 && Math.floor(gameTime / 100) % 2 === 0) return;
      
      ctx.save();
      if (facing === -1) { ctx.translate(x + w, y); ctx.scale(-1, 1); }
      else { ctx.translate(x, y); }

        drawPixelRect(8, 27, 6, 10, colors.blue);

        drawPixelRect(8, 37, 6, 6, colors.brown);

      ctx.restore();

    function drawMario() {
      const x = Math.floor(mario.x - camera.x);
